<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Documental</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#0f1720; --panel:#16212c; --panel2:#1c2b38; --border:#28394a;
  --text:#e6edf3; --muted:#8ea2b3; --accent:#3ba7ff; --accent2:#22c58b;
  --warn:#e8b339; --danger:#ef5a5a; --radius:10px;
}
html[data-theme="claro"]{
  --bg:#f4f6f9; --panel:#ffffff; --panel2:#eef2f6; --border:#d7dee6;
  --text:#1b2733; --muted:#5c6b7a; --accent:#1a73c7; --accent2:#178f5c;
  --warn:#b8790a; --danger:#c8382c;
}
.themeToggle{display:flex;gap:6px;}
.themeToggle .btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
*{box-sizing:border-box;}
body{margin:0;font-family:'Segoe UI',system-ui,Arial,sans-serif;background:var(--bg);color:var(--text);}
button{cursor:pointer;font-family:inherit;}
input,select,textarea{font-family:inherit;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 10px;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);}
a{color:var(--accent);}
.hidden{display:none !important;}
.solo-admin{display:none !important;}
body:not(.modo-lectura) .solo-admin{display:flex !important;}
body.modo-lectura::before{
  content:"👁️ MODO SOLO LECTURA — puedes ver e imprimir, no puedes editar ni eliminar";
  display:block; position:sticky; top:0; z-index:999; background:var(--warn); color:#1a1a1a;
  text-align:center; font-size:12px; font-weight:600; padding:5px;
}

/* LOGIN */
#loginScreen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 15% 20%, rgba(59,167,255,.16), transparent 45%),
    radial-gradient(circle at 85% 15%, rgba(34,197,139,.14), transparent 40%),
    radial-gradient(circle at 50% 100%, rgba(59,167,255,.10), transparent 55%),
    linear-gradient(160deg, #0b131c 0%, #0f1720 45%, #101d29 100%);
}
#loginScreen::before, #loginScreen::after{
  content:"";position:absolute;border-radius:50%;filter:blur(60px);pointer-events:none;
}
#loginScreen::before{width:420px;height:420px;top:-140px;left:-120px;background:rgba(59,167,255,.18);}
#loginScreen::after{width:380px;height:380px;bottom:-160px;right:-100px;background:rgba(34,197,139,.15);}
.loginBox{position:relative;z-index:1;backdrop-filter:blur(2px);}
.loginBox{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:32px;width:100%;max-width:380px;}
.loginBox h1{font-size:20px;margin:0 0 4px;}
.loginBox p.sub{color:var(--muted);margin:0 0 20px;font-size:13px;}
.loginBox input{width:100%;margin-bottom:10px;}
.loginBox button.primary{width:100%;padding:10px;margin-top:6px;}
.loginTabs{display:flex;gap:8px;margin-bottom:16px;}
.loginTabs button{flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--muted);padding:8px;border-radius:6px;}
.loginTabs button.active{background:var(--accent);color:#08131d;border-color:var(--accent);font-weight:600;}
#loginError{color:var(--danger);font-size:13px;min-height:18px;margin-top:6px;}

/* APP SHELL */
#app{display:none;min-height:100vh;grid-template-columns:230px 1fr;}
#app.show{display:grid;}
#sidebar{background:var(--panel);border-right:1px solid var(--border);padding:18px 12px;display:flex;flex-direction:column;}
#sidebar h1{font-size:16px;margin:4px 8px 20px;color:var(--accent);}
#sidebar h1 span{display:block;font-size:11px;color:var(--muted);font-weight:400;}
.navBtn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;border:none;background:transparent;color:var(--text);text-align:left;font-size:14px;margin-bottom:2px;width:100%;}
.navBtn:hover{background:var(--panel2);}
.navBtn.active{background:var(--accent);color:#08131d;font-weight:600;}
#userBox{margin-top:auto;padding-top:14px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);}
#userBox button{width:100%;margin-top:8px;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:8px;border-radius:6px;}
#main{padding:26px 32px;overflow-y:auto;max-height:100vh;}
.pageTitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.pageTitle h2{margin:0;font-size:22px;}
.pageTitle p{margin:2px 0 0;color:var(--muted);font-size:13px;}

/* GENERIC */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
.field label{font-size:12px;color:var(--muted);}
.field input,.field select,.field textarea{width:100%;}
.btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:9px 16px;border-radius:8px;font-size:14px;}
.btn:hover{border-color:var(--accent);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#08131d;font-weight:600;}
.btn.primary:hover{filter:brightness(1.08);}
.btn.green{background:var(--accent2);border-color:var(--accent2);color:#04241a;font-weight:600;}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger);}
.btn.small{padding:5px 10px;font-size:12px;}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;}
.pill.ok{background:rgba(34,197,139,.18);color:var(--accent2);}
.pill.warn{background:rgba(232,179,57,.18);color:var(--warn);}
.pill.danger{background:rgba(239,90,90,.18);color:var(--danger);}
.pill.muted{background:rgba(142,162,179,.18);color:var(--muted);}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--border);}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;}
tr:hover td{background:var(--panel2);}
.emptyState{text-align:center;padding:40px 20px;color:var(--muted);}
.statRow{display:flex;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
.statCard{flex:1;min-width:140px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.statCard .n{font-size:26px;font-weight:700;}
.statCard .l{font-size:12px;color:var(--muted);}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:16px;}
.tabs button{background:transparent;border:none;color:var(--muted);padding:10px 14px;font-size:13px;border-bottom:2px solid transparent;}
.tabs button.active{color:var(--accent);border-color:var(--accent);font-weight:600;}
.modalBg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
.modalBox{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;}
.modalBox h3{margin-top:0;}
.closeX{float:right;background:none;border:none;color:var(--muted);font-size:20px;}
.aiBox{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:14px;margin-top:10px;}
.aiBox h4{margin:0 0 8px;color:var(--accent);font-size:13px;}
.aiBox pre{white-space:pre-wrap;font-family:inherit;font-size:13px;background:var(--bg);padding:10px;border-radius:6px;border:1px solid var(--border);}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--muted);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg);}}
.helpNote{font-size:12px;color:var(--muted);background:var(--panel2);border:1px dashed var(--border);border-radius:6px;padding:8px 10px;margin-top:8px;}
.checklistItem{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:var(--panel2);}
.checklistItem input[type=checkbox]{margin-top:3px;width:18px;height:18px;}
.checklistItem .meta{font-size:11px;color:var(--muted);margin-top:2px;}
.checklistItem.vencido{border-color:var(--danger);}
.checklistItem.proximo{border-color:var(--warn);}
@media(max-width:800px){
  #app.show{grid-template-columns:1fr;grid-template-rows:auto 1fr;}
  #sidebar{flex-direction:row;overflow-x:auto;}
  .grid2,.grid3{grid-template-columns:1fr;}
}

/* ══ MÓDULO DOCUMENTOS LEGALES (pagaré, letra, contratos) ══ */
#legalesRoot{ --gold:var(--accent); --gold-dim:var(--accent); --emerald:var(--accent2); --red:var(--danger); }
.doc-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.doc-tab{padding:8px 16px;background:var(--panel);border:1px solid var(--border);color:var(--muted);border-radius:20px;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s;}
.doc-tab.active{background:var(--accent);color:#0f1720;border-color:var(--accent);}
.doc-content{display:none;}
.doc-content.active{display:block;}
.doc-literatura{background:rgba(59,167,255,.08);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:12px 16px;margin-bottom:16px;font-size:13px;color:var(--muted);line-height:1.6;}
.doc-literatura strong{color:var(--text);}
.doc-form-preview{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:900px){.doc-form-preview{grid-template-columns:1fr;}}
.doc-form{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
.doc-form h3{font-size:14px;font-weight:700;color:var(--accent);margin:0 0 14px;}
.doc-form h3:not(:first-child){margin-top:16px;}
.form-group{display:flex;flex-direction:column;gap:5px;margin-bottom:11px;}
.form-group label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
.form-group input,.form-group select,.form-group textarea{background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:8px 10px;font-size:13px;width:100%;}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--accent);}
.doc-preview{background:#fff;color:#111;border-radius:var(--radius);padding:28px;min-height:400px;font-family:'Times New Roman',serif;font-size:13px;line-height:1.7;overflow-y:auto;box-shadow:0 4px 30px rgba(0,0,0,.4);}
.doc-btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
.btn-calc{padding:9px 20px;background:linear-gradient(135deg,var(--accent),#2a8ae0);color:#0f1720;font-weight:700;font-size:13px;border:none;border-radius:6px;cursor:pointer;}
.btn-calc:hover{filter:brightness(1.1);}
.btn-secondary{padding:9px 18px;background:var(--panel2);color:var(--muted);font-weight:600;font-size:13px;border:1px solid var(--border);border-radius:6px;cursor:pointer;}
.btn-secondary:hover{border-color:var(--accent);color:var(--text);}
.doc-placeholder{color:#999;text-align:center;margin-top:100px;font-family:sans-serif;}
.doc-header{text-align:center;margin-bottom:24px;}
.doc-title{font-size:17px;font-weight:900;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:4px;}
.doc-subtitle{font-size:12px;color:#555;}
.doc-body{margin-bottom:24px;text-align:justify;font-family:Georgia,'Times New Roman',serif;}
.doc-body p{margin-bottom:9px;}
.doc-firma-row{display:flex;justify-content:space-between;margin-top:50px;flex-wrap:wrap;gap:16px;}
.doc-firma{text-align:center;width:45%;}
.doc-firma-line{border-top:1px solid #333;padding-top:6px;font-size:12px;}
.doc-monto-box{border:2px solid #333;padding:11px;text-align:center;font-size:14px;font-weight:700;margin:18px 0;}
.doc-footer{border-top:1px solid #ccc;padding-top:9px;font-size:10px;color:#777;margin-top:26px;}

.toast-container{position:fixed;bottom:20px;right:20px;z-index:99999;display:flex;flex-direction:column;gap:8px;}
.toast{padding:12px 18px;border-radius:8px;background:var(--panel);border:1px solid var(--border);color:var(--text);font-size:13px;max-width:320px;box-shadow:0 8px 30px rgba(0,0,0,.5);opacity:0;transform:translateX(30px);transition:all .3s ease;display:flex;align-items:center;gap:8px;}
.toast.show{opacity:1;transform:translateX(0);}
.toast-success{border-color:var(--accent2);}
.toast-error{border-color:var(--danger);}
.toast-warning{border-color:var(--warn);}

/* ══ MÓDULOS AUDITORÍA PROFESIONAL Y TRIBUTACIÓN (variables mapeadas) ══ */
#auditoriaProRoot, #tributacionRoot {
  --bg-card2:var(--panel2); --gold:var(--accent); --gold-dim:var(--accent);
  --text-primary:var(--text); --text-muted:var(--muted); --text-secondary:var(--muted);
  --bg-hover:var(--panel2); --emerald:var(--accent2); --bg-main:var(--bg); --bg-deep:var(--bg);
  --font-mono:'Courier New',monospace;
}
.trib-tabs,.doc-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.trib-tab{padding:8px 16px;background:var(--panel);border:1px solid var(--border);color:var(--muted);border-radius:20px;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s;}
.trib-tab.active{background:var(--accent);color:#0f1720;border-color:var(--accent);}
.trib-content{display:none;}
.trib-content.active{display:block;}
table.trib-table{width:100%;border-collapse:collapse;font-size:.82rem;margin:12px 0;}
table.trib-table th{background:var(--bg);color:var(--accent);font-weight:700;padding:10px 14px;text-align:left;border-bottom:2px solid var(--border);font-size:.75rem;text-transform:uppercase;}
table.trib-table td{padding:9px 14px;border-bottom:1px solid var(--border);color:var(--muted);vertical-align:top;}
table.trib-table tr:hover td{background:var(--panel2);}
table.trib-table .pct{font-family:'Courier New',monospace;font-weight:700;color:var(--accent);text-align:center;}

.ap-tipo-card{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:18px;cursor:pointer;transition:all .2s;}
.ap-tipo-card:hover,.ap-tipo-card.activo{border-color:var(--accent);background:rgba(59,167,255,.08);}
.ap-tipo-icon{font-size:2rem;margin-bottom:8px;}
.ap-tipo-nombre{font-size:.95rem;font-weight:700;color:var(--text);}
.ap-tipo-desc{font-size:.75rem;color:var(--muted);margin-top:4px;line-height:1.5;}
.ap-fase{background:var(--panel2);border:1px solid var(--border);border-radius:10px;margin-bottom:12px;overflow:hidden;}
.ap-fase-header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;cursor:pointer;}
.ap-fase-header:hover{background:var(--panel);}
.ap-fase-numero{font-size:.65rem;font-weight:700;padding:3px 8px;border-radius:10px;background:rgba(59,167,255,.15);color:var(--accent);text-transform:uppercase;letter-spacing:.5px;}
.ap-fase-titulo{font-size:.88rem;font-weight:600;color:var(--text);margin-left:10px;flex:1;}
.ap-fase-estado{font-size:.7rem;padding:3px 10px;border-radius:10px;font-weight:700;}
.ap-fase-estado.pendiente{background:rgba(99,102,241,.15);color:#8b8bf5;}
.ap-fase-estado.en-proceso{background:rgba(232,179,57,.15);color:var(--warn);}
.ap-fase-estado.completada{background:rgba(34,197,139,.15);color:var(--accent2);}
.ap-fase-body{display:none;padding:0 16px 16px;}
.ap-fase-body.open{display:block;}
.ap-cedula{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:'Courier New',monospace;font-size:.76rem;}
.ap-cedula-header{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;padding-bottom:10px;border-bottom:2px solid var(--accent);}
.ap-cedula-field{font-size:.7rem;}
.ap-cedula-label{color:var(--muted);font-family:inherit;}
.ap-cedula-value{color:var(--text);font-weight:700;}
.ap-cedula-table{width:100%;border-collapse:collapse;font-size:.72rem;}
.ap-cedula-table th{background:var(--panel2);color:var(--muted);text-transform:uppercase;font-size:.62rem;letter-spacing:.4px;padding:6px 8px;border:1px solid var(--border);}
.ap-cedula-table td{padding:6px 8px;border:1px solid var(--border);color:var(--muted);}
.ap-cedula-table td.num{text-align:right;font-family:'Courier New',monospace;}
.ap-cedula-table tr.total{font-weight:700;background:rgba(59,167,255,.06);}
.ap-marca{display:inline-block;width:18px;height:18px;background:var(--accent);color:#0f1720;border-radius:50%;font-size:.6rem;font-weight:700;text-align:center;line-height:18px;}
.ap-hallazgo{padding:10px 14px;border-radius:8px;margin-bottom:8px;font-size:.8rem;}
.ap-hallazgo.critico{background:rgba(239,90,90,.1);border-left:3px solid var(--danger);}
.ap-hallazgo.moderado{background:rgba(232,179,57,.1);border-left:3px solid var(--warn);}
.ap-hallazgo.leve{background:rgba(99,102,241,.1);border-left:3px solid #8b8bf5;}
.ap-hallazgo.ok{background:rgba(34,197,139,.1);border-left:3px solid var(--accent2);}
.benford-bar{display:flex;align-items:flex-end;gap:4px;height:80px;margin-top:10px;}
.benford-col{flex:1;display:flex;flex-direction:column;align-items:center;}
.benford-bar-real{background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;}
.benford-bar-esp{background:rgba(34,197,139,.3);border-radius:3px 3px 0 0;min-height:2px;}
</style>
</head>
<body>
<div id="toast-container" class="toast-container"></div>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="loginBox">
    <h1>Control Documental</h1>
    <p class="sub">Oficios, plazos, cumplimiento tributario y societario en Ecuador</p>
    <input id="authEmail" type="email" placeholder="Correo electrónico" autocomplete="username">
    <input id="authPass" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button class="btn primary" id="authSubmitBtn" onclick="submitAuth()">Iniciar sesión</button>
    <div id="loginError"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div id="sidebar">
    <h1>Control Documental<span id="userEmailLabel">Gestión de Auditoría</span></h1>
    <button class="navBtn active" data-view="dashboard" onclick="goTo('dashboard')">📊 Dashboard</button>
    <button class="navBtn" data-view="empresas" onclick="goTo('empresas')">🏢 Empresas y Cumplimiento</button>
    <button class="navBtn" data-view="miembros" onclick="goTo('miembros')">🧑‍🤝‍🧑 Miembros</button>
    <button class="navBtn" data-view="publicos" onclick="goTo('publicos')">📨 Trámites Públicos</button>
    <button class="navBtn" data-view="privados" onclick="goTo('privados')">🔒 Trámites Privados</button>
    <button class="navBtn" data-view="revision" onclick="goTo('revision')">🧾 Revisión de Documentos</button>
    <button class="navBtn" data-view="elaboracion" onclick="goTo('elaboracion')">📝 Memos y Oficios</button>
    <button class="navBtn" data-view="legales" onclick="goTo('legales')">📜 Documentos Legales</button>
    <button class="navBtn" data-view="actas" onclick="goTo('actas')">🗒️ Actas de Reunión</button>
    <button class="navBtn" data-view="equipos" onclick="goTo('equipos')">👥 Equipo de Trabajo</button>
    <button class="navBtn" data-view="cumpleanos" onclick="goTo('cumpleanos')">🎂 Cumpleaños</button>
    <button class="navBtn" data-view="auditoria" onclick="goTo('auditoria')">🔎 Auditoría</button>
    <button class="navBtn" data-view="activos" onclick="goTo('activos')">🏷️ Activos Fijos</button>
    <button class="navBtn" data-view="bancario" onclick="goTo('bancario')">🏦 Área Bancaria</button>
    <button class="navBtn" data-view="vacaciones" onclick="goTo('vacaciones')">🏖️ Vacaciones</button>
    <button class="navBtn" data-view="reuniones" onclick="goTo('reuniones')">📅 Reuniones y Eventos</button>
    <button class="navBtn" data-view="actasjunta" onclick="goTo('actasjunta')">🏛️ Actas de Junta</button>
    <button class="navBtn" data-view="cesiones" onclick="goTo('cesiones')">📜 Cesión de Acciones</button>

   está en la tabla, se usa el valor conocido más cercano (el más reciente).
   Franja exenta de dividendos = 3 SBU del año de la distribución (Art. 39.2 LRTI). */
const SBU_POR_ANIO = {2021:400, 2022:425, 2023:450, 2024:460, 2025:470, 2026:482};
function sbuDelAnio(anio){
  if(SBU_POR_ANIO[anio]) return SBU_POR_ANIO[anio];
  const anios = Object.keys(SBU_POR_ANIO).map(Number).sort((a,b)=>a-b);
  if(anio > anios[anios.length-1]) return SBU_POR_ANIO[anios[anios.length-1]];
  if(anio < anios[0]) return SBU_POR_ANIO[anios[0]];
  // año intermedio no listado: usa el más cercano hacia abajo
  let masCercano = anios[0];
  for(const a of anios){ if(a<=anio) masCercano = a; }
  return SBU_POR_ANIO[masCercano];
}
function franjaExentaDelAnio(anio){ return sbuDelAnio(anio) * 3; }

// Tabla de TARIFA ÚNICA para el "pago a cuenta sobre utilidades no
// distribuidas" (Art. 39.2.1 LRTI, Ley Orgánica de Transparencia Social,
// vigente desde el ejercicio 2025/2026). IMPORTANTE: NO es la tabla

// aplica sobre el 100% del saldo acumulado no distribuido, según en qué

// tramo 2 y se aplica 0.75% a los $300,000 completos, no solo al exceso
// sobre $100,000).
const TABLA_PAGO_A_CUENTA_39_2_1 = [
  { desde: 0,           tarifa: 0.0000 },
  { desde: 100000.01,   tarifa: 0.0075 },
  { desde: 1000000.01,  tarifa: 0.0125 },
  { desde: 10000000.01, tarifa: 0.0175 },
  { desde: 100000000.01,tarifa: 0.0225 },
  { desde: 500000000.01,tarifa: 0.0250 },
];
function calcularPagoACuentaTarifaUnica(monto){
  monto = Number(monto)||0;
  if(monto<=0) return 0;
  let tarifa = TABLA_PAGO_A_CUENTA_39_2_1[0].tarifa;
  for(const t of TABLA_PAGO_A_CUENTA_39_2_1){ if(monto >= t.desde) tarifa = t.tarifa; else break; }
  return monto * tarifa;
}

// Bloqueo de acciones de escritura por área: intercepta cualquier clic en un
// botón/enlace cuyo onclick llame a una función cuyo nombre empiece con un
// verbo de escritura y decide si permitirlo según el nivel de acceso del
// área (o subárea, dentro de Dividendos) donde se encuentra el usuario:
//   - "completo": permite todo.
//   - "crear": permite agregar información NUEVA, pero bloquea editar/
//     eliminar/actualizar lo que ya existe. Para funciones que sirven tanto
//     para crear como para editar (el patrón más común en esta app es
//     "guardarXForm(id)", donde el mismo botón crea si "id" viene vacío y
//     edita si "id" trae un valor), se decide mirando el primer argumento de
//     la llamada: si está vacío, se trata como creación y se permite.
//   - "lectura"/"sin_acceso": bloquea todo lo de este patrón.
// Firebase es la protección real (rechazaría el guardado de todas formas),
// esto solo da un mensaje claro en vez de un error críptico de permisos.
const VERBOS_SIEMPRE_CREACION = /^(agregar|crear)/i;
const VERBOS_SIEMPRE_EDICION = /^(eliminar|editar|actualizar|confirmar|recalcular|sincronizar|marcar|registrar|toggleFormaPago|toggleMetodoPago|cambiarMetodoPago)/i;
const PATRON_FUNCION_ESCRITURA = /^(guardar|eliminar|agregar|crear|actualizar|confirmar|recalcular|sincronizar|editar|marcar|registrar|toggleFormaPago|toggleMetodoPago|cambiarMetodoPago)/i;

// Decide si una llamada de tipo botón-con-onclick que invoca una función con
// argumentos representa
// crear algo nuevo (permitido en nivel "crear") mirando su primer argumento
// — vacío/nulo/sin argumentos se interpreta como creación.
function esLlamadaDeCreacion(nombreFuncion, onclickAttr){
  if(VERBOS_SIEMPRE_CREACION.test(nombreFuncion)) return true;
  if(VERBOS_SIEMPRE_EDICION.test(nombreFuncion)) return false;
  // Resto (típicamente "guardarXForm(id)"): mira el primer argumento.
  const argsMatch = onclickAttr.match(/\(([^)]*)\)/);
  const primerArg = (argsMatch ? argsMatch[1].split(",")[0] : "").trim();
  return primerArg === "" || primerArg === "''" || primerArg === '""' || primerArg === "null" || primerArg === "undefined";
}

document.addEventListener("click", function(e){

  const onclickAttr = btn.getAttribute("onclick") || "";
  const match = onclickAttr.match(/^\s*(\w+)\(/);
  if(!match || !PATRON_FUNCION_ESCRITURA.test(match[1])) return;
  if(nivelActual === "crear" && esLlamadaDeCreacion(match[1], onclickAttr)) return; // permitido: es una creación nueva
  e.preventDefault();
  e.stopPropagation();
  alert(nivelActual==="sin_acceso"
    ? "No tienes acceso a esta área."
    : nivelActual==="crear"
      ? "Tu permiso en esta área es solo para agregar información nueva — no puedes editar ni eliminar lo que ya existe."

}, true);

/* =========================================================================

   Compañías, Municipio, Ministerio del Trabajo). Basado en normativa 2026.
   Esto es una guía de planificación general, no asesoría legal/tributaria
   personalizada: cada empresa debe validar sus plazos exactos con su
   contador/abogado y el calendario oficial de cada institución.
   ========================================================================= */
const DIA_POR_DIGITO = {1:10,2:12,3:14,4:16,5:18,6:20,7:22,8:24,9:26,0:28};

function obtenerNovenoDigito(ruc){
  const limpio = (ruc||"").replace(/\D/g,"");
  if(limpio.length < 9) return null;
  return parseInt(limpio.charAt(8), 10);
}

// Día límite de declaraciones MENSUALES (IVA, retenciones, ATS) según la
// clasificación SRI de la empresa. Contribuyentes especiales / grandes
// contribuyentes: día 9 fijo. Sector público: día 20. Galápagos: día 28.
// Régimen normal: según noveno dígito del RUC.
function diaMensualSegunClasificacion(empresa){
  switch(empresa.clasificacionSri){
    case "especial": return 9;
    case "sector_publico": return 20;
    case "galapagos": return 28;
    default: {
      const d = obtenerNovenoDigito(empresa.ruc);
      if(d===null || isNaN(d)) return 20;
      return DIA_POR_DIGITO[d] ?? 20;
    }
  }
}

// Día límite de declaraciones ANUALES que además dependen del noveno dígito
// (Impuesto a la Renta, IVA semestral RIMPE, cuota RIMPE Popular). Los
// contribuyentes especiales/grandes contribuyentes declaran renta antes
// (día 11 fijo); sector público día 20; Galápagos día 28.
function diaAnualSegunClasificacion(empresa){
  switch(empresa.clasificacionSri){
    case "especial": return 11;
    case "sector_publico": return 20;
    case "galapagos": return 28;
    default: {
      const d = obtenerNovenoDigito(empresa.ruc);
      if(d===null || isNaN(d)) return 20;
      return DIA_POR_DIGITO[d] ?? 20;
    }
  }
}

// Compatibilidad retro (usada en algún lugar puntual)
function diaVencimientoMensual(ruc){
  const d = obtenerNovenoDigito(ruc);
  if(d===null || isNaN(d)) return 20;
  return DIA_POR_DIGITO[d] ?? 20;
}

function calcularFechaVencimiento(obligacion, empresa, anio, mes){
  if(obligacion.periodicidad==="mensual"){
    const dia = obligacion.diaMensualFijo || diaMensualSegunClasificacion(empresa);
    return new Date(anio, mes, dia); // "mes" recibido ya es el mes de vencimiento (0-index)
  }
  const dia = obligacion.diaAnualFijo || diaAnualSegunClasificacion(empresa);
  return new Date(anio, mes-1, dia);
}

// Genera SOLO las tareas mensuales aplicables para un año/mes específico
// Genera las tareas de las obligaciones MANUALES (agregadas a mano por
// empresa, además del catálogo automático) para un mes/año específico.
function generarChecklistManualMensual(empresa, anio, mesIndex1a12){
  return (empresa.obligacionesManuales||[]).filter(o=>o.periodicidad==="mensual").map(o => {
    const ultimoDiaMes = new Date(anio, mesIndex1a12, 0).getDate();
    const dia = Math.min(o.diaVencimiento||28, ultimoDiaMes);
    const vencimiento = new Date(anio, mesIndex1a12-1, dia).getTime();
    return {
      obligacion: { id:o.id, nombre:o.nombre, institucion:o.institucion||"Manual", descripcion:o.descripcion||"", esManual:true },
      vencimiento, periodoKey: `manual_${o.id}_${anio}-${String(mesIndex1a12).padStart(2,"0")}`
    };
  });
}
// Igual que la anterior, pero para las obligaciones manuales anuales.
function generarChecklistManualAnual(empresa, anio){
  const tareas = [];
  (empresa.obligacionesManuales||[]).filter(o=>o.periodicidad==="anual").forEach(o => {
    (o.mesesAnual&&o.mesesAnual.length ? o.mesesAnual : [1]).forEach(m => {
      const ultimoDiaMes = new Date(anio, m, 0).getDate();
      const dia = Math.min(o.diaVencimiento||28, ultimoDiaMes);
      const vencimiento = new Date(anio, m-1, dia).getTime();
      tareas.push({
        obligacion: { id:o.id, nombre:o.nombre, institucion:o.institucion||"Manual", descripcion:o.descripcion||"", esManual:true },
        vencimiento, periodoKey: `manual_${o.id}_${anio}-${String(m).padStart(2,"0")}`
      });
    });
  });
  return tareas;
}

function generarChecklistMensual(empresa, anio, mesIndex1a12){
  const obligacionesAplicables = CATALOGO_OBLIGACIONES.filter(o => {
    try { return o.periodicidad==="mensual" && o.aplicaSi(empresa); } catch(e){ return false; }
  });
  const tareas = obligacionesAplicables.map(o => {
    const vencimiento = calcularFechaVencimiento(o, empresa, anio, mesIndex1a12-1);
    const periodoKey = `${o.id}_${anio}-${String(mesIndex1a12).padStart(2,"0")}`;
    return { obligacion:o, vencimiento, periodoKey };
  });
  tareas.push(...generarChecklistManualMensual(empresa, anio, mesIndex1a12));
  return tareas.sort((a,b) => a.vencimiento - b.vencimiento);
}

// Genera SOLO las tareas anuales aplicables para un año específico
function generarChecklistAnual(empresa, anio){
  const obligacionesAplicables = CATALOGO_OBLIGACIONES.filter(o => {
    try { return o.periodicidad==="anual" && o.aplicaSi(empresa); } catch(e){ return false; }
  });
  const tareas = [];
  obligacionesAplicables.forEach(o => {
    (o.mesesAnual||[1]).forEach(m => {
      const vencimiento = calcularFechaVencimiento(o, empresa, anio, m);
      const periodoKey = `${o.id}_${anio}-${String(m).padStart(2,"0")}`;
      tareas.push({ obligacion:o, vencimiento, periodoKey });
    });
  });
  tareas.push(...generarChecklistManualAnual(empresa, anio));
  tareas.sort((a,b) => a.vencimiento - b.vencimiento);
  return tareas;
}

// Genera las tareas próximas (para el Dashboard): mes actual + 2 siguientes,
// más las obligaciones anuales del año actual/siguiente dentro de una ventana
// de +-45/400 días. Se usa solo para el resumen de alertas del Dashboard.
function generarChecklistEmpresa(empresa){
  const hoy = new Date();
  const tareas = [];
  for(let offset=0; offset<=2; offset++){
    const d = new Date(hoy.getFullYear(), hoy.getMonth()+offset, 1);
    tareas.push(...generarChecklistMensual(empresa, d.getFullYear(), d.getMonth()+1));
  }
  [hoy.getFullYear(), hoy.getFullYear()+1].forEach(anio => {
    generarChecklistAnual(empresa, anio).forEach(t => {
      const diffDias = (t.vencimiento - hoy) / 86400000;
      if(diffDias > -45 && diffDias < 400) tareas.push(t);
    });
  });
  const vistos = new Set();
  const unicas = tareas.filter(t => vistos.has(t.periodoKey) ? false : (vistos.add(t.periodoKey), true));
  unicas.sort((a,b) => a.vencimiento - b.vencimiento);
  return unicas;
}

/* =========================================================================
   ACCESO A DATOS (Firebase Realtime Database) - todo organizado bajo el
   uid del usuario: /empresas/{uid}/{id}, /tramites/{uid}/{id},
   /checklist_estado/{uid}/{id}. Cada usuario solo puede leer/escribir su
   propia rama (ver reglas recomendadas en README-DEPLOY.md).
   ========================================================================= */
function limpiarClave(s){
  return String(s).replace(/[.#$\[\]\/\s]/g, "_");
}

async function cargarEmpresas(){
  const snap = await db.ref(`empresas/${DATOS_UID}`).once("value");
  const val = snap.val() || {};
  empresasCache = Object.keys(val).map(id => ({id, ...val[id]}));
  if(!empresaSeleccionadaId && empresasCache.length) empresaSeleccionadaId = empresasCache[0].id;
}

async function guardarEmpresa(datos, id){
  const payload = {...datos, actualizado: Date.now()};
  if(id){
    await db.ref(`empresas/${DATOS_UID}/${id}`).update(payload);
  } else {
    payload.creado = Date.now();
    const ref = db.ref(`empresas/${DATOS_UID}`).push();
    await ref.set(payload);
    id = ref.key;
  }
  await cargarEmpresas();
  return id;
}

async function eliminarEmpresa(id){
  await db.ref(`empresas/${DATOS_UID}/${id}`).remove();
  if(empresaSeleccionadaId===id) empresaSeleccionadaId = null;
  await cargarEmpresas();
}

// Asigna un número interno correlativo por año y tipo (MEMO-2026-0001, OFICIO-2026-0001,
// PAGARE-2026-0001, etc.), usando una transacción para evitar duplicados.
const PREFIJOS_NUMERO = {
  memo:"MEMO", oficio:"OFICIO", pagare:"PAGARE", letra_cambio:"LETRA",
  contrato_mutuo:"MUTUO", contrato_trabajo:"CTRAB", contrato_servicios:"CSERV",
  contrato_arrendamiento:"CARR", actaJunta:"ACTA-JGA", cesionAcciones:"CESION"
};
async function obtenerSiguienteNumeroDocumento(tipo){
  const anio = new Date().getFullYear();
  const ref = db.ref(`contadores_documentos/${DATOS_UID}/${tipo}/${anio}`);
  const resultado = await ref.transaction(actual => (actual || 0) + 1);
  const numero = resultado.snapshot.val();
  const prefijo = PREFIJOS_NUMERO[tipo] || tipo.toUpperCase();
  return `${prefijo}-${anio}-${String(numero).padStart(4, "0")}`;
}

// Firebase rechaza el guardado completo si CUALQUIER valor en todo el árbol
// es undefined (no solo el campo directamente afectado) — dado lo grande y
// profundamente anidada que es la estructura de datos de Dividendos (armada
// a lo largo de muchas sesiones), se limpia recursivamente antes de cada
// guardado en vez de perseguir cada campo posible uno por uno.
function limpiarUndefined(valor){
  if(Array.isArray(valor)) return valor.map(limpiarUndefined);
  if(valor && typeof valor==="object" && !(valor instanceof Date)){
    const limpio = {};
    for(const k in valor){
      if(valor[k]!==undefined) limpio[k] = limpiarUndefined(valor[k]);
    }
    return limpio;
  }
  return valor;
}

async function guardarDatosDividendos(datos){

/* --- Conversión de números a letras (para montos en documentos legales) --- */
function numeroALetras(num){
  num = Math.round(Number(num)||0);
  if(num===0) return "CERO";
  const UNIDADES=["","UNO","DOS","TRES","CUATRO","CINCO","SEIS","SIETE","OCHO","NUEVE"];
  const DIEZ_A_VEINTE=["DIEZ","ONCE","DOCE","TRECE","CATORCE","QUINCE","DIECISÉIS","DIECISIETE","DIECIOCHO","DIECINUEVE","VEINTE"];
  const DECENAS=["","","VEINTE","TREINTA","CUARENTA","CINCUENTA","SESENTA","SETENTA","OCHENTA","NOVENTA"];
  const CENTENAS=["","CIENTO","DOSCIENTOS","TRESCIENTOS","CUATROCIENTOS","QUINIENTOS","SEISCIENTOS","SETECIENTOS","OCHOCIENTOS","NOVECIENTOS"];
  function tresDigitos(n){
    if(n===0) return "";
    if(n===100) return "CIEN";
    let s="";
    const c=Math.floor(n/100), d=Math.floor((n%100)/10), u=n%10;
    if(c>0) s+=CENTENAS[c]+" ";
    const resto=n%100;
    if(resto>=10 && resto<=20) s+=DIEZ_A_VEINTE[resto-10];
    else{
      if(d>0) s+=DECENAS[d];
      if(d>0 && u>0) s+=" Y ";
      if(u>0) s+=UNIDADES[u];
    }
    return s.trim();
  }
  function bloque(n, singular, plural){
    if(n===0) return "";
    const texto = n===1 ? "UN "+singular : tresDigitos(n)+" "+plural;
    return texto.trim();
  }
  const millones = Math.floor(num/1000000);
  const miles = Math.floor((num%1000000)/1000);
  const cientos = num%1000;
  let partes=[];
  if(millones>0) partes.push(bloque(millones,"MILLÓN","MILLONES"));
  if(miles>0) partes.push(miles===1?"MIL":tresDigitos(miles)+" MIL");
  if(cientos>0) partes.push(tresDigitos(cientos));
  return partes.join(" ").replace(/\s+/g," ").trim();
}
function montoEnLetrasUSD(monto){
  const entero = Math.floor(Number(monto)||0);
  const centavos = Math.round(((Number(monto)||0) - entero)*100);
  return `${numeroALetras(entero)} DÓLARES DE LOS ESTADOS UNIDOS DE AMÉRICA${centavos>0? ' CON '+String(centavos).padStart(2,'0')+'/100':''}`;
}


/* =========================================================================
   EXTRACCIÓN DE TEXTO (PDF con pdf.js; texto plano directo)
   ========================================================================= */
if(window.pdfjsLib){
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}
async function extraerTextoDeArchivo(file){
  const nombre = (file.name||"").toLowerCase();

  if(file.type==="text/plain" || nombre.endsWith(".txt")){
    return await file.text();
  }

  if((file.type==="application/pdf" || nombre.endsWith(".pdf")) && window.pdfjsLib){
    try{
      const buf = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({data:buf}).promise;
      let texto = "";
      for(let i=1;i<=Math.min(pdf.numPages,15);i++){
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        texto += content.items.map(it=>it.str).join(" ") + "\n";
      }
      return texto.trim();
    }catch(e){
      console.warn("No se pudo extraer texto del PDF automáticamente", e);
      return "";
    }
  }

  if((nombre.endsWith(".xlsx") || nombre.endsWith(".xls") || file.type.includes("spreadsheet")) && window.XLSX){
    try{
      const buf = await file.arrayBuffer();
      const libro = XLSX.read(buf, {type:"array"});
      let texto = "";
      libro.SheetNames.forEach(nombreHoja => {
        const hoja = libro.Sheets[nombreHoja];
        const csv = XLSX.utils.sheet_to_csv(hoja);
        texto += `--- Hoja: ${nombreHoja} ---\n${csv}\n\n`;
      });
      return texto.trim();
    }catch(e){
      console.warn("No se pudo extraer texto del Excel automáticamente", e);
      return "";
    }
  }

  if(nombre.endsWith(".docx") && window.mammoth){
    try{
      const buf = await file.arrayBuffer();
      const resultado = await mammoth.extractRawText({arrayBuffer: buf});
      return (resultado.value||"").trim();
    }catch(e){
      console.warn("No se pudo extraer texto del Word automáticamente", e);
      return "";
    }
  }

  if(nombre.endsWith(".doc")){
    console.warn(".doc (Word antiguo) no se puede leer automáticamente; usa .docx o pega el texto manualmente.");
    return "";
  }

  return "";
}

async function llamarIA(modo, contenido, contexto){

// Igual que llamarIA, pero además envía uno o más PDF en base64 para que la IA
// los lea directamente (útil cuando el PDF es un escaneo/imagen sin texto
// seleccionable, y la extracción local con pdf.js no devuelve nada).
// pdfs: [{data: "<base64 sin encabezado data:...>", nombre: "archivo.pdf"}, ...]
async function llamarIAConPdfs(modo, contenido, contexto, pdfs){
  const resp = await fetch(AI_ENDPOINT, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({modo, contenido, contexto, pdfs})
  });
  const data = await resp.json();
  if(!resp.ok || data.error){
    throw new Error(data.error || "Error al consultar la IA");
  }
  return data.resultado;
}

// Convierte un File a base64 puro (sin el prefijo "data:application/pdf;base64,")
function archivoABase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const resultado = reader.result || "";
      const base64 = String(resultado).split(",")[1] || "";
      resolve(base64);
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Intenta leer el contenido de un enlace público de OneDrive/Google Drive a
// través de la función serverless (evita problemas de CORS al acceder desde
// el navegador). Devuelve {tipo:"texto", texto} o {tipo:"pdf", pdfBase64} en
// caso de éxito, o lanza un error con un mensaje explicando por qué falló
// (enlace privado, archivo muy grande, formato no soportado, etc.).
async function leerEnlace(url){
  const resp = await fetch(LEER_ENLACE_ENDPOINT, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ url })
  });
  const data = await resp.json();
  if(!resp.ok || data.error){
    const detalle = data.diagnostico ? `\n\n(Detalle técnico para soporte: ${data.diagnostico})` : "";
    throw new Error((data.error || "No se pudo leer el enlace.") + detalle);
  }
  return data;
}

// Lee un archivo .zip completamente en memoria del navegador (nunca se sube a
// Firebase ni a ningún servidor propio): por cada archivo interno intenta
// extraer texto con la misma lógica que ya usamos para archivos sueltos
// (PDF/Excel/Word/TXT). Los PDF sin texto extraíble y de tamaño razonable se
// preparan para que la IA los lea de forma nativa (igual que con adjuntos
// sueltos). Devuelve solo lo necesario para la IA; nada se persiste.
async function leerZip(file){
  if(!window.JSZip) throw new Error("No se pudo cargar el lector de ZIP. Recarga la página e intenta de nuevo.");
  const zip = await JSZip.loadAsync(file);
  const textos = [];
  const pdfsNativos = [];
  const noLegibles = [];
  const LIMITE_PDFS_NATIVOS = 3;
  const LIMITE_PDF_BYTES = 4*1024*1024;

  const entradas = Object.values(zip.files).filter(e => !e.dir && !/__MACOSX|\.DS_Store$/i.test(e.name));
  for(const entrada of entradas){
    const nombreCorto = entrada.name.split("/").pop();
    if(!nombreCorto) continue;
    try{
      const blob = await entrada.async("blob");
      const archivoEnvuelto = new File([blob], nombreCorto, { type: blob.type || "" });
      const esPdf = /\.pdf$/i.test(nombreCorto);
      const texto = await conTimeout(extraerTextoDeArchivo(archivoEnvuelto), 20000);
      const textoUtil = (texto||"").trim().length >= 40 ? texto.trim() : "";
      if(textoUtil){
        textos.push({ nombre: nombreCorto, contenido: textoUtil });
      } else if(esPdf && blob.size <= LIMITE_PDF_BYTES && pdfsNativos.length < LIMITE_PDFS_NATIVOS){
        const base64 = await archivoABase64(archivoEnvuelto);
        pdfsNativos.push({ nombre: nombreCorto, data: base64 });
      } else {
        noLegibles.push(nombreCorto);
      }
    }catch(e){
      noLegibles.push(nombreCorto + " (error al leerlo)");
    }
  }
  return { textos, pdfsNativos, noLegibles, totalArchivos: entradas.length };
}

function fmtFecha(d){
  if(!d) return "-";
  const date = (d instanceof Date) ? d : new Date(d);
  return date.toLocaleDateString("es-EC", {year:"numeric", month:"short", day:"2-digit"});
}
function diasEntre(a,b){ return Math.round((b-a)/86400000); }
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

// Notificación flotante (usada sobre todo por el módulo de Documentos Legales,
// para validaciones y confirmaciones sin interrumpir con un alert()).
function toast(msg, type="info", duration=3500){
  const container = document.getElementById("toast-container");
  if(!container) return;
  const t = document.createElement("div");
  t.className = `toast toast-${type}`;
  const icons = { success:"✅", error:"❌", warning:"⚠️", info:"ℹ️" };
  t.innerHTML = `<span>${icons[type]||"ℹ️"}</span><span>${escapeHtml(msg)}</span>`;
  container.appendChild(t);
  requestAnimationFrame(() => t.classList.add("show"));
  setTimeout(() => { t.classList.remove("show"); setTimeout(() => t.remove(), 400); }, duration);
}

      ? `<p style="color:var(--muted);">No hay cumpleaños en los próximos 30 días. <button class="btn small" onclick="goTo('cumpleanos')">Ver todos</button></p>`
      : proximos.map(c => `<p>${c.dias===0?'🎉 <b>¡Hoy!</b>':`en ${c.dias} día(s)`} — <b>${escapeHtml(c.nombre)}</b> ${c.cargo?`(${escapeHtml(c.cargo)})`:''} cumple ${edadQueCumple(c.fechaNacimiento)} años</p>`).join("") + `<button class="btn small" onclick="goTo('cumpleanos')">Ver todos</button>`;
  }).catch(()=>{ const c=document.getElementById("alertasCumpleanosDashboard"); if(c) c.innerHTML = `<p style="color:var(--muted);">No se pudo cargar.</p>`; });

  const [pub, priv] = await Promise.all([cargarTramites("publico"), cargarTramites("privado")]);
  const hoy = new Date();

  const vencidosTramites = [...pub, ...priv].filter(t => t.fechaVencimiento && new Date(t.fechaVencimiento) < hoy && t.estado!=="Resuelto");
  const proximosTramites = [...pub, ...priv].filter(t => {
    if(!t.fechaVencimiento || t.estado==="Resuelto") return false;
    const dias = diasEntre(hoy, new Date(t.fechaVencimiento));
    return dias>=0 && dias<=7;
  });

  let totalTareasVencidas = 0, totalTareasProximas = 0;
  let alertasHtml = "";
  for(const emp of empresasCache){
    const tareas = generarChecklistEmpresa(emp);
    const estados = await obtenerEstadosChecklist(emp.id);
    const vencidas = tareas.filter(t => !estados[t.periodoKey]?.cumplido && t.vencimiento < hoy);
    const proximas = tareas.filter(t => {
      if(estados[t.periodoKey]?.cumplido) return false;
      const dias = diasEntre(hoy, t.vencimiento);
      return dias>=0 && dias<=7;
    });
    totalTareasVencidas += vencidas.length;
    totalTareasProximas += proximas.length;
    if(vencidas.length || proximas.length){
      alertasHtml += `<div style="margin-bottom:10px;"><b>${escapeHtml(emp.nombre)}</b><br>`;
      vencidas.slice(0,3).forEach(t => alertasHtml += `<span class="pill danger" style="margin:3px 3px 0 0;display:inline-block;">🔴 ${escapeHtml(t.obligacion.nombre)} - venció ${fmtFecha(t.vencimiento)}</span>`);
      proximas.slice(0,3).forEach(t => alertasHtml += `<span class="pill warn" style="margin:3px 3px 0 0;display:inline-block;">🟡 ${escapeHtml(t.obligacion.nombre)} - vence ${fmtFecha(t.vencimiento)}</span>`);
      alertasHtml += `</div>`;
    }
  }

  // Si el usuario ya navegó a otra pantalla mientras esto cargaba, no hay
  // nada que actualizar (evita el error "Cannot set properties of null").
  if(currentView!=="dashboard" || !document.getElementById("statRow")) return;

  document.getElementById("statRow").innerHTML = `
    <div class="statCard"><div class="n">${empresasCache.length}</div><div class="l">Empresas registradas</div></div>
    <div class="statCard"><div class="n">${pub.length + priv.length}</div><div class="l">Trámites totales</div></div>
    <div class="statCard" style="border-color:var(--danger)"><div class="n" style="color:var(--danger)">${vencidosTramites.length + totalTareasVencidas}</div><div class="l">Vencidos sin cumplir</div></div>
    <div class="statCard" style="border-color:var(--warn)"><div class="n" style="color:var(--warn)">${proximosTramites.length + totalTareasProximas}</div><div class="l">Próximos a vencer (7 días)</div></div>
  `;

  document.getElementById("alertasCumplimiento").innerHTML = alertasHtml || `<p style="color:var(--muted)">Sin alertas de cumplimiento pendientes. ${empresasCache.length===0?'Registra una empresa para generar tu checklist automático.':''}</p>`;

  document.getElementById("alertasTramites").innerHTML = (vencidosTramites.length+proximosTramites.length===0)
    ? `<p style="color:var(--muted)">No hay trámites próximos a vencer.</p>`
    : [...vencidosTramites, ...proximosTramites].slice(0,8).map(t => {
        const vencido = new Date(t.fechaVencimiento) < hoy;
        return `<div style="margin-bottom:8px;">
          <span class="pill ${vencido?'danger':'warn'}">${vencido?'Vencido':'Próximo'}</span>
          <b style="margin-left:6px;">${escapeHtml(t.asunto||t.numeroOficio||'Trámite')}</b>
          <div class="meta" style="font-size:12px;color:var(--muted)">${escapeHtml(t.institucion||'')} · vence ${fmtFecha(t.fechaVencimiento)} · ${t.tipo==='publico'?'Público':'Privado'}</div>
        </div>`;
      }).join("");
}

  if(!lista.length){ cont.innerHTML = `<p style="color:var(--muted);font-size:13px;">Sin obligaciones manuales agregadas.</p>`; return; }

    ${lista.map((o,idx) => `<tr>
      <td>${escapeHtml(o.nombre)}</td>
      <td>${escapeHtml(o.institucion||'-')}</td>
      <td>${o.periodicidad==='anual'?'Anual':'Mensual'}</td>
      <td>${o.periodicidad==='anual' ? (o.mesesAnual||[]).map(m=>NOMBRES_MESES[m-1]).join(", ")+`, día ${o.diaVencimiento}` : `día ${o.diaVencimiento} de cada mes`}</td>
      <td><button class="btn small danger" onclick="eliminarObligacionManual('${emp.id}',${idx})">Eliminar</button></td>
    </tr>`).join("")}

}

async function agregarObligacionManual(empresaId){
  const nombre = document.getElementById("obmNombre").value.trim();
  if(!nombre){ alert("Ingresa el nombre de la obligación."); return; }
  const periodicidad = document.getElementById("obmPeriodicidad").value;
  const diaVencimiento = parseInt(document.getElementById("obmDia").value, 10) || 15;
  const mesesAnual = periodicidad==="anual"
    ? Array.from(document.getElementById("obmMeses").selectedOptions).map(o=>parseInt(o.value,10))
    : [];
  if(periodicidad==="anual" && !mesesAnual.length){ alert("Selecciona al menos un mes para una obligación anual."); return; }
  const emp = empresasCache.find(e=>e.id===empresaId);
  const nuevaObligacion = {
    id: "obm_"+Date.now()+"_"+Math.floor(Math.random()*10000),
    nombre, institucion: document.getElementById("obmInstitucion").value.trim(),
    descripcion: document.getElementById("obmDescripcion").value.trim(),
    periodicidad, diaVencimiento, mesesAnual,
  };
  const obligacionesManuales = [...(emp.obligacionesManuales||[]), nuevaObligacion];
  await guardarEmpresa({ obligacionesManuales }, empresaId);
  empresasCache = await cargarEmpresas();
  document.getElementById("obmNombre").value = "";
  document.getElementById("obmInstitucion").value = "";
  document.getElementById("obmDescripcion").value = "";
  pintarDetalleEmpresa(empresaId);
}

async function eliminarObligacionManual(empresaId, idx){
  if(!confirm("¿Eliminar esta obligación manual?")) return;
  const emp = empresasCache.find(e=>e.id===empresaId);
  const obligacionesManuales = (emp.obligacionesManuales||[]).filter((_,i)=>i!==idx);
  await guardarEmpresa({ obligacionesManuales }, empresaId);
  empresasCache = await cargarEmpresas();
  pintarDetalleEmpresa(empresaId);
}

}

function cambiarModoChecklist(empresaId, modo){
  checklistModo = modo;
  pintarDetalleEmpresa(empresaId);
}

function cambiarPeriodo(empresaId){
  const selMes = document.getElementById("selMes");
  const selAnio = document.getElementById("selAnio");
  if(selMes) checklistMes = parseInt(selMes.value,10);
  if(selAnio) checklistAnio = parseInt(selAnio.value,10);
  const emp = empresasCache.find(e=>e.id===empresaId);
  pintarChecklistWrap(emp);
}

function obtenerTareasPeriodoActual(emp){
  return checklistModo==="mensual"
    ? generarChecklistMensual(emp, checklistAnio, checklistMes)
    : generarChecklistAnual(emp, checklistAnio);
}

async function pintarChecklistWrap(emp){
  const wrap = document.getElementById("checklistWrap");
  const tareas = obtenerTareasPeriodoActual(emp);
  const estados = await obtenerEstadosChecklist(emp.id);
  const hoy = new Date();

  if(!tareas.length){ wrap.innerHTML = `<p style="color:var(--muted)">No hay obligaciones ${checklistModo==='mensual'?'para este mes':'anuales'} según el perfil de la empresa.</p>`; return; }

  wrap.innerHTML = tareas.map(t => {
    const estado = estados[t.periodoKey] || {};
    const dias = diasEntre(hoy, t.vencimiento);
    let clase = "";
    if(!estado.cumplido && dias<0) clase = "vencido";
    else if(!estado.cumplido && dias<=7) clase = "proximo";
    return `<div class="checklistItem ${clase}">
      <input type="checkbox" ${estado.cumplido?"checked":""} onchange="toggleChecklist('${emp.id}','${t.periodoKey}',this.checked)">
      <div style="flex:1;">
        <div><b>${escapeHtml(t.obligacion.nombre)}</b> <span class="pill muted">${escapeHtml(t.obligacion.institucion)}</span></div>
        <div class="meta">${escapeHtml(t.obligacion.descripcion)}</div>
        <div class="meta">Vence: <b>${fmtFecha(t.vencimiento)}</b> ${!estado.cumplido && dias<0 ? '<span class="pill danger">Vencido</span>' : (!estado.cumplido && dias<=7 ? '<span class="pill warn">Próximo</span>' : (estado.cumplido ? '<span class="pill ok">Cumplido</span>' : ''))}</div>
        <input type="text" placeholder="Observaciones (opcional)" value="${escapeHtml(estado.notas||'')}" style="width:100%;margin-top:6px;font-size:12px;padding:6px 8px;" onchange="actualizarObservacionChecklist('${emp.id}','${t.periodoKey}',this.value)">
      </div>
    </div>`;
  }).join("");
}

async function toggleChecklist(empresaId, periodoKey, checked){
  await marcarChecklist(empresaId, periodoKey, checked);
  const emp = empresasCache.find(e=>e.id===empresaId);
  pintarChecklistWrap(emp);
}

async function confirmarEliminarEmpresa(id){
  if(!confirm("¿Eliminar esta empresa? Esto no borra los trámites asociados.")) return;
  await eliminarEmpresa(id);
  renderEmpresas();
}

/* --- Exportar CSV e imprimir el checklist del periodo seleccionado --- */
async function exportarChecklistCSV(empresaId){
  const emp = empresasCache.find(e=>e.id===empresaId);
  const tareas = obtenerTareasPeriodoActual(emp);
  const estados = await obtenerEstadosChecklist(emp.id);
  const filas = [["Obligación","Institución","Vencimiento","Estado"]];
  tareas.forEach(t => {
    const cumplido = !!estados[t.periodoKey]?.cumplido;
    filas.push([t.obligacion.nombre, t.obligacion.institucion, fmtFecha(t.vencimiento), cumplido ? "Cumplido" : "Pendiente"]);
  });
  const csv = filas.map(f => f.map(c => `"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const etiquetaPeriodo = checklistModo==="mensual" ? `${NOMBRES_MESES[checklistMes-1]}_${checklistAnio}` : `Anual_${checklistAnio}`;
  a.href = url;
  a.download = `checklist_${emp.nombre.replace(/\s+/g,'_')}_${etiquetaPeriodo}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

  const emp = empresasCache.find(e=>e.id===empresaId);
  const tareas = obtenerTareasPeriodoActual(emp);

  const etiquetaPeriodo = checklistModo==="mensual" ? `${NOMBRES_MESES[checklistMes-1]} ${checklistAnio}` : `Obligaciones anuales ${checklistAnio}`;
  const filas = tareas.map(t => {
    const cumplido = !!estados[t.periodoKey]?.cumplido;
    return `<tr>
      <td style="text-align:center;font-size:16px;">${cumplido ? "✅" : "⬜"}</td>
      <td>${escapeHtml(t.obligacion.nombre)}</td>
      <td>${escapeHtml(t.obligacion.institucion)}</td>
      <td>${fmtFecha(t.vencimiento)}</td>
      <td>${cumplido ? "Cumplido" : "Pendiente"}</td>
    </tr>`;
  }).join("");
  const win = window.open("", "_blank");
  win.document.write(`
    <html><head><title>Checklist - ${escapeHtml(emp.nombre)} - ${etiquetaPeriodo}</title>
    <style>
      body{font-family:Arial,sans-serif;padding:24px;color:#111;}
      h1{font-size:18px;margin-bottom:2px;}
      p{color:#555;margin-top:0;font-size:13px;}
      table{width:100%;border-collapse:collapse;margin-top:16px;}
      th,td{border:1px solid #ccc;padding:8px;font-size:13px;text-align:left;}
      th{background:#f0f0f0;}
    </style></head><body>
    <h1>${escapeHtml(emp.nombre)} — RUC ${escapeHtml(emp.ruc)}</h1>
    <p>${etiquetaPeriodo} · Generado el ${fmtFecha(new Date())}</p>
    <table><thead><tr><th>✔</th><th>Obligación</th><th>Institución</th><th>Vencimiento</th><th>Estado</th></tr></thead>
    <tbody>${filas || '<tr><td colspan="5" style="text-align:center;color:#888;">Sin obligaciones para este periodo</td></tr>'}</tbody></table>
    </body></html>`);
  win.document.close();
  win.focus();
  win.print();
}

// Quita del cuerpo del memo/oficio una línea de numeración que haya quedado
// como placeholder en blanco (ej. "MEMORANDO N° _____-2026" u "OFICIO N°: ____"),
// que la IA a veces incluye porque no conoce el número real — el número real
// ya lo agrega la app en un encabezado aparte, así que esa línea sobra y se
// ve como si el número estuviera dos veces (una con valor, otra en blanco).
// No toca líneas donde el número YA viene relleno con un valor real (letras).
function quitarNumeroPlaceholderDelCuerpo(texto){
  if(!texto) return texto;
  const lineas = texto.split("\n");
  const filtradas = lineas.filter(linea => {
    const l = linea.trim();
    return !/^(MEMORANDO|OFICIO)\b.{0,15}N[°ºo]\.?\s*:?\s*[_\s-]{2,}\s*\d{0,4}\s*$/i.test(l);
  });
  return filtradas.join("\n").replace(/^\s*\n+/, "");
}

  const filtroHastaEl = document.getElementById("filtroHastaTramite_"+tipo);
  const filtroEstado = filtroEstadoEl ? filtroEstadoEl.value : "";
  const filtroDesde = filtroDesdeEl && filtroDesdeEl.value ? new Date(filtroDesdeEl.value+"T00:00:00").getTime() : null;
  const filtroHasta = filtroHastaEl && filtroHastaEl.value ? new Date(filtroHastaEl.value+"T23:59:59").getTime() : null;

  let lista = tramitesCache[tipo];
  if(filtroEstado==="Vencido"){
    lista = lista.filter(t => t.fechaVencimiento && new Date(t.fechaVencimiento) < hoy && t.estado!=="Resuelto");
  } else if(filtroEstado){
    lista = lista.filter(t => (t.estado||"Pendiente")===filtroEstado);
  }
  if(filtroDesde) lista = lista.filter(t => t.fechaRecepcion && t.fechaRecepcion >= filtroDesde);
  if(filtroHasta) lista = lista.filter(t => t.fechaRecepcion && t.fechaRecepcion <= filtroHasta);

// Suma días calendario simples
function sumarDiasCalendario(fechaInicio, dias){
  const d = new Date(fechaInicio);
  d.setDate(d.getDate() + dias);
  return d;
}

// Suma días hábiles (término): salta sábados y domingos. No considera feriados
// nacionales específicos — el usuario debe verificarlos si el plazo cae cerca
// de un feriado.
function sumarDiasHabiles(fechaInicio, diasHabiles){
  const d = new Date(fechaInicio);
  let contados = 0;
  while(contados < diasHabiles){
    d.setDate(d.getDate() + 1);
    const diaSemana = d.getDay(); // 0=domingo, 6=sábado
    if(diaSemana !== 0 && diaSemana !== 6) contados++;
  }
  return d;
}

// Crea un memo u oficio en el área de "Memos y Oficios" ya vinculado a este
// trámite: pasa institución/asunto/N° de oficio como contexto de la
// solicitud, y si ya existe un borrador de respuesta del Diagnóstico IA lo
// usa como contenido inicial. Guarda el vínculo en ambos sentidos.
async function crearRespuestaDesdeTramite(tipo, id, categoria){
  const t = tramitesCache[tipo].find(x=>x.id===id);
  if(!t) return;
  const borrador = t.diagnosticoIA?.borrador_oficio_respuesta || "";
  const partesSolicitud = [
    `Responder a ${t.institucion||'la contraparte'}`,
    t.numeroOficio ? `en referencia al oficio N° ${t.numeroOficio}` : '',
    t.asunto ? `sobre: ${t.asunto}` : '',
  ].filter(Boolean).join(' ');

  const numero = await obtenerSiguienteNumeroDocumento(categoria);
  const datos = {
    tipo: categoria,
    solicitud: partesSolicitud,
    contenido: categoria==="oficio" ? borrador : "",
    confirmado: false,
    numeroAsignado: numero,
    historialVersiones: [],
    tramiteVinculado: { tipo, id, institucion: t.institucion||'', asunto: t.asunto||'' }
  };
  const nuevoId = await guardarDocumentoElaborado(datos, null);
  await guardarTramite({ oficioRespuestaId: nuevoId, oficioRespuestaCategoria: categoria }, id);
  tramitesCache[tipo] = await cargarTramites(tipo);

  document.getElementById("modalDetalleHost").innerHTML = "";
  currentView = "elaboracion";
  document.querySelectorAll(".navBtn").forEach(b => b.classList.toggle("active", b.dataset.view==="elaboracion"));
  elaboracionCategoriaActual = categoria;
  await renderElaboracion();
  abrirDetalleElaboracion(categoria, nuevoId);
}

function abrirRespuestaVinculada(tipo, id){
  const t = tramitesCache[tipo].find(x=>x.id===id);
  if(!t || !t.oficioRespuestaId) return;
  const categoria = t.oficioRespuestaCategoria || "oficio";
  document.getElementById("modalDetalleHost").innerHTML = "";
  currentView = "elaboracion";
  document.querySelectorAll(".navBtn").forEach(b => b.classList.toggle("active", b.dataset.view==="elaboracion"));
  elaboracionCategoriaActual = categoria;
  renderElaboracion().then(() => abrirDetalleElaboracion(categoria, t.oficioRespuestaId));
}

function pintarListaEnlacesTramite(tipo, id, enlaces){
  const cont = document.getElementById("listaEnlacesTramite");
  if(!cont) return;
  if(!enlaces.length){ cont.innerHTML = `<p style="color:var(--muted);font-size:13px;">Sin enlaces agregados.</p>`; return; }
  cont.innerHTML = enlaces.map((e,idx) => `
    <div class="checklistItem">
      <div style="flex:1;overflow:hidden;text-overflow:ellipsis;">
        <a href="${escapeHtml(e.url)}" target="_blank" style="color:inherit;">🔗 ${escapeHtml(e.etiqueta||e.url)}</a>
        <div id="enlaceEstado_${idx}" style="font-size:12px;color:var(--muted);margin-top:2px;"></div>
      </div>
      <button class="btn small" onclick="ejecutarLeerEnlaceTramite('${tipo}','${id}',${idx})">🧠 Leer con IA</button>
      <button class="btn small danger" onclick="eliminarEnlaceTramite('${tipo}','${id}',${idx})">Eliminar</button>
    </div>`).join("");
}

async function guardarObservacionesTramite(tipo, id){
  const texto = document.getElementById("obsTramite").value;
  await guardarTramite({ observaciones: texto }, id);
  tramitesCache[tipo] = await cargarTramites(tipo);
  setSafeText("obsEstado", "Observaciones guardadas.");
}

async function agregarEnlaceTramite(tipo, id){
  const urlInput = document.getElementById("nuevoEnlaceUrl");
  const etiquetaInput = document.getElementById("nuevoEnlaceEtiqueta");
  const url = urlInput.value.trim();
  if(!url){ alert("Pega un enlace primero."); return; }
  const etiqueta = etiquetaInput.value.trim();
  const t = tramitesCache[tipo].find(x=>x.id===id);
  const nuevosEnlaces = [...(t.enlaces||[]), { url, etiqueta }];
  await guardarTramite({ enlaces: nuevosEnlaces }, id);
  tramitesCache[tipo] = await cargarTramites(tipo);
  pintarListaEnlacesTramite(tipo, id, nuevosEnlaces);
  urlInput.value = ""; etiquetaInput.value = "";
}

async function eliminarEnlaceTramite(tipo, id, idx){
  if(!confirm("¿Eliminar este enlace?")) return;
  const t = tramitesCache[tipo].find(x=>x.id===id);
  const nuevosEnlaces = (t.enlaces||[]).filter((_,i)=>i!==idx);
  await guardarTramite({ enlaces: nuevosEnlaces }, id);
  tramitesCache[tipo] = await cargarTramites(tipo);
  pintarListaEnlacesTramite(tipo, id, nuevosEnlaces);
}

async function ejecutarLeerEnlaceTramite(tipo, id, idx){
  const t = tramitesCache[tipo].find(x=>x.id===id);
  const enlace = (t.enlaces||[])[idx];
  if(!enlace) return;
  setSafeHTML("enlaceEstado_"+idx, `<span class="spinner"></span> Leyendo enlace...`);
  try{
    const leido = await leerEnlace(enlace.url);
    setSafeText("enlaceEstado_"+idx, "Enlace leído. Analizando con IA...");
    const contexto = tipo==="publico" ? "Oficio de institución pública" : "Trámite privado";
    let resultado;
    if(leido.tipo==="pdf"){
      resultado = await llamarIAConPdfs("diagnostico_oficio", null, contexto, [{ data: leido.pdfBase64, nombre: enlace.etiqueta||enlace.url }]);
    } else {
      resultado = await llamarIA("diagnostico_oficio", leido.texto, contexto);
    }
    const historialPrevio = t.historialDiagnosticos || [];
    const nuevoHistorial = t.diagnosticoIA
      ? [...historialPrevio, { fecha: Date.now(), diagnostico: t.diagnosticoIA }]
      : historialPrevio;
    await guardarTramite({
      diagnosticoIA: resultado,
      historialDiagnosticos: nuevoHistorial,
      soportesRequeridos: resultado.documentos_sugeridos||[]
    }, id);
    tramitesCache[tipo] = await cargarTramites(tipo);
    setSafeText("enlaceEstado_"+idx, "Análisis completo — ve a la pestaña 'Diagnóstico IA' para verlo.");
  }catch(e){
    setSafeText("enlaceEstado_"+idx, "");
    alert("No se pudo leer/analizar el enlace: " + e.message);
  }
}

function toggleHistorialDiagnostico(){
  const wrap = document.getElementById("historialDiagnosticoWrap");
  const visible = !wrap.classList.contains("hidden");
  if(visible){ wrap.classList.add("hidden"); return; }
  wrap.classList.remove("hidden");
  const historial = window._historialActual || [];
  wrap.innerHTML = historial.slice().reverse().map((h,idxRev) => {
    const idxReal = historial.length - 1 - idxRev;
    return `<div class="card" style="margin-bottom:8px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <b style="font-size:12px;color:var(--muted);">${fmtFecha(h.fecha)}</b>

      </div>
      ${renderDiagnosticoIA(h.diagnostico)}
    </div>`;
  }).join("");
}

async function eliminarHistorialDiagnostico(idx){
  if(!confirm("¿Eliminar este análisis del historial?")) return;
  const {tipo, id} = window._historialTramiteInfo;
  const t = tramitesCache[tipo].find(x=>x.id===id);
  const nuevoHistorial = (t.historialDiagnosticos||[]).filter((_,i)=>i!==idx);
  await guardarTramite({historialDiagnosticos: nuevoHistorial}, id);
  tramitesCache[tipo] = await cargarTramites(tipo);
  const actualizado = tramitesCache[tipo].find(x=>x.id===id);
  pintarTabIA(actualizado, tipo);

function renderDiagnosticoIA(r){
  if(!r) return "";
  const riesgoColor = {alto:"danger",medio:"warn",bajo:"ok"}[r.nivel_riesgo] || "muted";
  return `<div class="aiBox">
    <h4>Diagnóstico</h4>
    <p><span class="pill ${riesgoColor}">Riesgo ${escapeHtml(r.nivel_riesgo||'-')}</span> ${r.institucion_emisora?`· Emitido por: ${escapeHtml(r.institucion_emisora)}`:''}</p>

    ${r.plazo_detectado?`<p><b>Plazo detectado:</b> ${escapeHtml(r.plazo_detectado)}</p>`:''}
    ${r.alcance?`<h4>Alcance del oficio</h4><p>${escapeHtml(r.alcance)}</p>`:''}
    ${r.areas_legales?.length?`<h4>Implicaciones legales por área</h4>${r.areas_legales.map(a=>`<p><span class="pill muted">${escapeHtml(a.area||'')}</span> ${escapeHtml(a.problema||'')}</p>`).join("")}`:''}
    ${r.puntos_clave?.length?`<p><b>Puntos clave:</b></p><ul>${r.puntos_clave.map(p=>`<li>${escapeHtml(p)}</li>`).join("")}</ul>`:''}
    <h4>Cómo responder</h4><p>${escapeHtml(r.como_responder||'')}</p>
    <h4>Solución recomendada</h4><p>${escapeHtml(r.solucion_recomendada||'')}</p>
    ${r.borrador_oficio_respuesta?(function(){
      const claveB = registrarBorrador(r.borrador_oficio_respuesta);
      return `<h4>Borrador de oficio de respuesta</h4><pre>${escapeHtml(r.borrador_oficio_respuesta)}</pre>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn small" onclick="copiarTexto(this)" data-texto="${encodeURIComponent(r.borrador_oficio_respuesta)}">Copiar borrador</button>
        <button class="btn small" onclick="descargarWordBorrador('${claveB}')">⬇️ Descargar Word</button>
        <button class="btn small" onclick="descargarPDFBorrador('${claveB}')">⬇️ Descargar PDF</button>
      </div>`;
    })():''}
    ${r.requiere_documentos_soporte?`<p style="margin-top:10px;"><b>⚠️ Este trámite requiere documentos de soporte.</b> Ve a la pestaña "Soportes" para revisarlos con IA.</p>`:''}

function copiarTexto(btn){
  const texto = decodeURIComponent(btn.dataset.texto);
  navigator.clipboard.writeText(texto).then(()=>{ btn.textContent = "¡Copiado!"; setTimeout(()=>btn.textContent="Copiar borrador",1500); });
}

async function ejecutarDiagnosticoIA(tipo, id){
  const texto = document.getElementById("iaTexto").value.trim();
  if(!texto){ alert("Ingresa o pega el texto del oficio."); return; }
  const estadoEl = document.getElementById("iaEstado");
  // Borra explícitamente el resultado anterior antes de mostrar el nuevo
  document.getElementById("resultadoIA").innerHTML = "";
  estadoEl.innerHTML = `<span class="spinner"></span> Analizando con IA...`;
  try{
    const resultado = await llamarIA("diagnostico_oficio", texto, tipo==="publico"?"Oficio de institución pública":"Trámite privado");
    const tramiteActual = tramitesCache[tipo].find(x=>x.id===id);
    const historialPrevio = tramiteActual?.historialDiagnosticos || [];
    // Si ya había un diagnóstico anterior, lo guardamos en el historial antes de reemplazarlo
    const nuevoHistorial = tramiteActual?.diagnosticoIA
      ? [...historialPrevio, { fecha: Date.now(), diagnostico: tramiteActual.diagnosticoIA }]
      : historialPrevio;
    await guardarTramite({
      textoDocumento: texto,
      diagnosticoIA: resultado,
      historialDiagnosticos: nuevoHistorial,
      soportesRequeridos: resultado.documentos_sugeridos||[]
    }, id);
    tramitesCache[tipo] = await cargarTramites(tipo);
    estadoEl.textContent = "Análisis completo.";
    pintarTabIA(tramitesCache[tipo].find(x=>x.id===id), tipo);
  }catch(e){
    estadoEl.textContent = "";
    alert("No se pudo completar el análisis: " + e.message + "\n\nVerifica que ANTHROPIC_API_KEY esté configurada en Netlify.");
  }
}
