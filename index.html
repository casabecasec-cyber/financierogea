async function confirmarEliminarElaboracion(categoria, id){
  if(!confirm("¿Eliminar este documento?")) return;
  await eliminarDocumentoElaborado(id);
  await pintarListaElaboracion();
}

async function abrirDetalleElaboracion(categoria, id){
  elaboracionDocsCache[categoria] = await cargarDocumentosElaborados(categoria);
  let d = elaboracionDocsCache[categoria].find(x=>x.id===id);
  // Auto-corrección: documentos marcados como definitivos ANTES de que el
  // número se empezara a asignar automáticamente pudieron quedar sin número,
  // y como el botón "Marcar como definitivo" ya no aparece una vez confirmado,
  // no había forma de dispararlo de nuevo. Se asigna aquí, en silencio, apenas
  // se detecta el caso, para que quede resuelto sin que el usuario tenga que hacer nada.
  if(d.confirmado && !d.numeroAsignado){
    const numero = await obtenerSiguienteNumeroDocumento(categoria);
    await guardarDocumentoElaborado({ numeroAsignado: numero }, id);
    elaboracionDocsCache[categoria] = await cargarDocumentosElaborados(categoria);
    d = elaboracionDocsCache[categoria].find(x=>x.id===id);
  }
  // Auto-corrección: documentos generados antes de que le pidiéramos a la IA
  // que no incluya su propia línea de "MEMORANDO N°"/"OFICIO N°" (que queda en
  // blanco/subrayada) pueden traerla duplicada junto al encabezado con el
  // número real que ya agrega la app. Se limpia aquí, en silencio.
  const contenidoLimpio = quitarNumeroPlaceholderDelCuerpo(d.contenido);
  if(contenidoLimpio !== d.contenido){
    await guardarDocumentoElaborado({ contenido: contenidoLimpio }, id);
    elaboracionDocsCache[categoria] = await cargarDocumentosElaborados(categoria);
    d = elaboracionDocsCache[categoria].find(x=>x.id===id);
  }
  const cfg = ELABORACION_CONFIG[categoria];
  const host = document.getElementById("modalElaboracionHost");
  host.innerHTML = `
    <div class="modalBg">
      <div class="modalBox" style="max-width:720px;">
        <button class="closeX" onclick="document.getElementById('modalElaboracionHost').innerHTML=''; pintarListaElaboracion();">×</button>
        <h3>${cfg.titulo.slice(0,-1)} ${badgeEstadoElaboracion(d)}</h3>
        ${d.tramiteVinculado ? `<p class="helpNote">🔗 Vinculado al trámite ${d.tramiteVinculado.tipo==='publico'?'público':'privado'} de <b>${escapeHtml(d.tramiteVinculado.institucion||'')}</b>${d.tramiteVinculado.asunto?' — '+escapeHtml(d.tramiteVinculado.asunto):''}. <button class="btn small" onclick="abrirTramiteDesdeElaboracion('${d.tramiteVinculado.tipo}','${d.tramiteVinculado.id}')">Ver trámite</button></p>` : ''}
        <div class="field"><label>¿Qué ${categoria==='memo'?'memo':'oficio'} necesitas? (describe destinatario, asunto, puntos clave)</label>
          <textarea id="elabSolicitud" rows="3" ${d.confirmado?'disabled':''}>${escapeHtml(d.solicitud||"")}</textarea>
        </div>
        <button class="btn primary" onclick="ejecutarGenerarDocumento('${categoria}','${id}')" ${d.confirmado?'disabled':''}>✨ Generar con IA</button>
        <span id="elabEstadoGenerar" style="margin-left:10px;color:var(--muted);font-size:13px;"></span>

        <div class="field" style="margin-top:16px;"><label>Contenido del ${categoria==='memo'?'memo':'oficio'} (editable — se guarda automáticamente al salir del cuadro)</label>
          <textarea id="elabContenido" rows="14" ${d.confirmado?'disabled':''} onblur="guardarContenidoManual('${categoria}','${id}', true)">${escapeHtml(d.contenido||"")}</textarea>
        </div>
        <button class="btn small" onclick="guardarContenidoManual('${categoria}','${id}')" ${d.confirmado?'disabled':''}>💾 Guardar cambios manuales</button>
        <span id="elabEstadoAutoguardado" style="margin-left:10px;color:var(--muted);font-size:12px;"></span>

        <div class="field" style="margin-top:16px;"><label>Instrucciones para que la IA revise/corrija (opcional)</label>
          <textarea id="elabInstrucciones" rows="2" placeholder="Ej. hazlo más formal, corrige la fecha, agrega un párrafo sobre..." ${d.confirmado?'disabled':''}></textarea>
        </div>
        <button class="btn" onclick="ejecutarRevisarDocumento('${categoria}','${id}')" ${d.confirmado?'disabled':''}>🔄 Revisar/Corregir con IA</button>
        <span id="elabEstadoRevisar" style="margin-left:10px;color:var(--muted);font-size:13px;"></span>

        <div style="margin-top:18px;display:flex;gap:8px;flex-wrap:wrap;">
          ${!d.confirmado ? `<button class="btn green" onclick="confirmarDocumentoElaborado('${categoria}','${id}')">✅ Marcar como definitivo</button>` : ''}
          <button class="btn small" onclick="imprimirDocumentoElaborado('${categoria}','${id}')">🖨️ Imprimir</button>
          <button class="btn small" onclick="descargarPDFElaboracion('${categoria}','${id}')">⬇️ Descargar PDF</button>
          <button class="btn small" onclick="descargarWordElaboracion('${categoria}','${id}')">⬇️ Descargar Word</button>
        </div>
        ${(d.historialVersiones||[]).length ? `
          <div style="margin-top:16px;">
            <button class="btn small" onclick="toggleHistorialElaboracion()">🕑 Ver versiones anteriores (${d.historialVersiones.length})</button>
            <div id="historialElaboracionWrap" class="hidden" style="margin-top:10px;"></div>
          </div>` : ''}
      </div>
    </div>`;
  window._historialElaboracionActual = d.historialVersiones||[];
}

async function guardarContenidoManual(categoria, id, silencioso){
  const contenido = document.getElementById("elabContenido").value;
  const solicitud = document.getElementById("elabSolicitud").value;
  await guardarDocumentoElaborado({ contenido, solicitud }, id);
  elaboracionDocsCache[categoria] = await cargarDocumentosElaborados(categoria);
  if(silencioso){
    setSafeText("elabEstadoAutoguardado", "Guardado automáticamente " + new Date().toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'}));
  } else {
    const estadoEl = document.getElementById("elabEstadoRevisar");
    if(estadoEl) estadoEl.textContent = "Cambios guardados.";
  }
}

async function ejecutarGenerarDocumento(categoria, id){
  const solicitud = document.getElementById("elabSolicitud").value.trim();
  if(!solicitud){ alert("Describe qué necesitas que redacte la IA."); return; }
  const cfg = ELABORACION_CONFIG[categoria];
  const estadoEl = document.getElementById("elabEstadoGenerar");
  estadoEl.innerHTML = `<span class="spinner"></span> Generando...`;
  try{
    const resultado = await llamarIA(cfg.modoGenerar, solicitud, "");
    const docActual = elaboracionDocsCache[categoria].find(x=>x.id===id);
    const historialPrevio = docActual?.historialVersiones || [];
    const nuevoHistorial = docActual?.contenido
      ? [...historialPrevio, { fecha: Date.now(), contenido: docActual.contenido, origen: "Generación anterior" }]
      : historialPrevio;
    await guardarDocumentoElaborado({ solicitud, contenido: resultado.texto, historialVersiones: nuevoHistorial }, id);
    elaboracionDocsCache[categoria] = await cargarDocumentosElaborados(categoria);
    estadoEl.textContent = "Borrador generado.";
    abrirDetalleElaboracion(categoria, id);
  }catch(e){
    estadoEl.textContent = "";
    alert("No se pudo generar el documento: " + e.message);
  }
}

async function ejecutarRevisarDocumento(categoria, id){
  const contenidoActual = document.getElementById("elabContenido").value.trim();
  const instrucciones = document.getElementById("elabInstrucciones").value.trim();
  if(!contenidoActual){ alert("Aún no hay contenido para revisar. Genera primero un borrador."); return; }
  const cfg = ELABORACION_CONFIG[categoria];
  const estadoEl = document.getElementById("elabEstadoRevisar");
  estadoEl.innerHTML = `<span class="spinner"></span> Revisando con IA...`;
  try{
    const resultado = await llamarIA(cfg.modoRevisar, contenidoActual, instrucciones);
    const docActual = elaboracionDocsCache[categoria].find(x=>x.id===id);
    const historialPrevio = docActual?.historialVersiones || [];
    const nuevoHistorial = [...historialPrevio, { fecha: Date.now(), contenido: contenidoActual, origen: instrucciones || "Revisión general" }];
    await guardarDocumentoElaborado({ contenido: resultado.texto, historialVersiones: nuevoHistorial }, id);
    elaboracionDocsCache[categoria] = await cargarDocumentosElaborados(categoria);
    estadoEl.textContent = "Revisión aplicada.";
    abrirDetalleElaboracion(categoria, id);
  }catch(e){
    estadoEl.textContent = "";
    alert("No se pudo revisar el documento: " + e.message);
  }
}

async function confirmarDocumentoElaborado(categoria, id){
  const docActual = elaboracionDocsCache[categoria].find(x=>x.id===id);
  if(!docActual?.contenido?.trim()){ alert("Genera o escribe el contenido antes de marcarlo como definitivo."); return; }
  if(!confirm("Al marcarlo como definitivo ya no se podrá seguir editando este documento. ¿Continuar?")) return;
  const payload = { confirmado:true, fechaConfirmado:Date.now() };
  // Salvaguarda: documentos creados antes de que el número se asignara
  // automáticamente al crear (versión anterior de la app) todavía pueden no
  // tener número — se les asigna aquí para que nunca quede uno "definitivo" sin número.
  if(!docActual.numeroAsignado){
    payload.numeroAsignado = await obtenerSiguienteNumeroDocumento(categoria);
  }
  await guardarDocumentoElaborado(payload, id);
  elaboracionDocsCache[categoria] = await cargarDocumentosElaborados(categoria);
  abrirDetalleElaboracion(categoria, id);
}

function toggleHistorialElaboracion(){
  const wrap = document.getElementById("historialElaboracionWrap");
  const visible = !wrap.classList.contains("hidden");
  if(visible){ wrap.classList.add("hidden"); return; }
  wrap.classList.remove("hidden");
  const historial = window._historialElaboracionActual || [];
  wrap.innerHTML = historial.slice().reverse().map(h => `
    <div class="card" style="margin-bottom:8px;">
      <div style="display:flex;justify-content:space-between;"><b style="font-size:12px;color:var(--muted);">${fmtFecha(h.fecha)}</b> <span class="pill muted">${escapeHtml(h.origen||'')}</span></div>
      <pre style="margin-top:6px;">${escapeHtml(h.contenido||'')}</pre>
    </div>`
  ).join("");
}

// Encabezado usado al imprimir/descargar un memo/oficio. Nunca dice "sin
// confirmar" si el documento SÍ está marcado como definitivo (aunque, por
// alguna razón, no tuviera número asignado) — evita el bug de mostrar
// "BORRADOR" en un documento que ya se confirmó.
function encabezadoDocumentoElaborado(d){
  if(d.numeroAsignado){
    return `<p><b>N° ${escapeHtml(d.numeroAsignado)}</b> · ${fmtFecha(d.fechaConfirmado||d.creado)}</p>`;
  }
  if(d.confirmado){
    return `<p><b>DOCUMENTO DEFINITIVO</b> · ${fmtFecha(d.fechaConfirmado||d.creado)}</p>`;
  }
  return `<p style="color:#b00;"><b>BORRADOR — sin confirmar</b> · ${fmtFecha(d.creado)}</p>`;
}

async function imprimirDocumentoElaborado(categoria, id){
  const d = elaboracionDocsCache[categoria].find(x=>x.id===id);
  if(!d?.contenido){ alert("Aún no hay contenido para imprimir."); return; }
  const cfg = ELABORACION_CONFIG[categoria];
  const encabezado = encabezadoDocumentoElaborado(d);
  const win = window.open("", "_blank");
  win.document.write(`<html><head><title>${cfg.titulo.slice(0,-1)} ${escapeHtml(d.numeroAsignado||'')}</title>
    <style>body{font-family:Arial,sans-serif;padding:32px;color:#111;} pre{white-space:pre-wrap;font-family:inherit;font-size:14px;line-height:1.5;}</style>
    </head><body>${encabezado}<hr><pre>${escapeHtml(d.contenido)}</pre></body></html>`);
  win.document.close();
  win.focus();
  win.print();
}

// Descarga el memo/oficio en PDF: abre el diálogo de impresión del navegador
// con "Guardar como PDF" ya disponible (mismo mecanismo usado en el resto de
// la app para "descargar PDF", ya que no se carga una librería de generación
// de PDF en el navegador). Queda como una acción aparte de "Imprimir" para
// que sea explícito que el resultado se puede guardar como archivo.
async function descargarPDFElaboracion(categoria, id){
  const d = elaboracionDocsCache[categoria].find(x=>x.id===id);
  if(!d?.contenido){ alert("Aún no hay contenido para descargar."); return; }
  const cfg = ELABORACION_CONFIG[categoria];
  const encabezado = encabezadoDocumentoElaborado(d);
  const nombreArchivo = `${cfg.titulo.slice(0,-1)}_${d.numeroAsignado||'borrador'}`.replace(/\s+/g,"_");
  const win = window.open("", "_blank");
  win.document.write(`<html><head><title>${escapeHtml(nombreArchivo)}</title>
    <style>body{font-family:Arial,sans-serif;padding:32px;color:#111;} pre{white-space:pre-wrap;font-family:inherit;font-size:14px;line-height:1.5;}</style>
    </head><body>${encabezado}<hr><pre>${escapeHtml(d.contenido)}</pre>
    <script>window.onload = () => setTimeout(() => window.print(), 200);<\/script>
    </body></html>`);
  win.document.close();
  win.focus();
}

async function descargarWordElaboracion(categoria, id){
  const d = elaboracionDocsCache[categoria].find(x=>x.id===id);
  if(!d?.contenido){ alert("Aún no hay contenido para descargar."); return; }
  const cfg = ELABORACION_CONFIG[categoria];
  const encabezadoHtml = encabezadoDocumentoElaborado(d);
  const cuerpoHtml = d.contenido.split("\n").map(l=>`<p>${escapeHtml(l)||'&nbsp;'}</p>`).join("");
  const nombreArchivo = `${cfg.titulo.slice(0,-1)}_${d.numeroAsignado||'borrador'}`;
  descargarWord(nombreArchivo, encabezadoHtml + cuerpoHtml);
}

async function generarDocumentoLegal(tipo, id){
  const plantilla = PLANTILLAS_DOC_LEGAL[tipo];
  const campos = {};
  plantilla.campos.forEach(c => { campos[c.id] = document.getElementById("lc_"+c.id).value; });

  // Un resumen corto de las partes para identificar el documento en la lista

  const resumenPartes = posiblesNombres.slice(0,2).join(" / ") || "Sin nombre";
  const nuevoId = await guardarDocumentoLegal({ tipo, campos, contenido, resumenPartes, endosos:[], numeroAsignado:null, confirmado:false }, id||null);

// Calcula el % de avance de una acta según el estado de sus puntos tratados:
// cerrado cuenta como 100%, en proceso como 50%, pendiente como 0%.
function calcularAvanceActa(puntos){
  if(!puntos || !puntos.length) return null;
  const PESO = { cerrado:100, en_proceso:50, pendiente:0 };
  const suma = puntos.reduce((s,p) => s + (PESO[p.estado] ?? 0), 0);
  return Math.round(suma / puntos.length);
}

function badgeAvanceActa(porcentaje){
  if(porcentaje===null) return `<span class="pill muted">Sin puntos</span>`;
  const color = porcentaje>=100 ? "ok" : (porcentaje>=40 ? "warn" : "danger");
  return `<span class="pill ${color}">${porcentaje}%</span>`;
}

function pintarAvanceActa(id){
  const cont = document.getElementById("avanceActaWrap");
  if(!cont) return;
  const a = actasCache.find(x=>x.id===id);
  const puntos = a.puntos||[];
  const porcentaje = calcularAvanceActa(puntos);
  if(porcentaje===null){ cont.innerHTML = `<p style="color:var(--muted);font-size:13px;">Sin puntos tratados aún — el % de avance aparecerá cuando agregues alguno.</p>`; return; }
  const cerrados = puntos.filter(p=>p.estado==="cerrado").length;
  const enProceso = puntos.filter(p=>p.estado==="en_proceso").length;
  const pendientes = puntos.filter(p=>p.estado==="pendiente").length;
  const colorBarra = porcentaje>=100 ? "var(--accent2)" : (porcentaje>=40 ? "var(--warn)" : "var(--danger)");
  cont.innerHTML = `
    <div style="margin:10px 0;">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;">
        <b>Avance de la reunión</b><b>${porcentaje}%</b>
      </div>
      <div style="background:var(--panel2);border-radius:6px;height:10px;overflow:hidden;">
        <div style="background:${colorBarra};height:100%;width:${porcentaje}%;transition:width .3s;"></div>
      </div>
      <p style="color:var(--muted);font-size:12px;margin-top:4px;">
        ✅ ${cerrados} cerrado(s) · 🟡 ${enProceso} en proceso · ⚪ ${pendientes} pendiente(s) — de ${puntos.length} punto(s) total
      </p>
    </div>`;
}

/* --- Seguimiento de puntos tratados: cada punto puede recibir tantas
   actualizaciones (seguimientos) como haga falta, en cualquier momento,
   no solo al crear el acta. --- */
async function abrirDetalleSeguimientoActa(id){
  let a = actasCache.find(x=>x.id===id);
  if(!a) return;
  // Migración de compatibilidad: actas creadas antes de este cambio solo
  // tienen "asuntos" como texto libre; se convierte una sola vez a puntos
  // estructurados (sin perder el texto original, que se conserva para imprimir).
  // IMPORTANTE: se guarda de inmediato en Firebase (no solo en memoria), para
  // que la tabla principal y el % de Avance la reflejen también, no solo esta vista.
  if(!a.puntos && a.asuntos){
    const puntosMigrados = a.asuntos.split("\n").map(l=>l.trim()).filter(Boolean).map(linea => ({
      id: "pt_"+Date.now()+"_"+Math.floor(Math.random()*10000),
      descripcion: linea, estado: "pendiente", seguimientos: []
    }));
    await guardarActa({ puntos: puntosMigrados }, id);
    actasCache = await cargarActas();
    a = actasCache.find(x=>x.id===id);
  }
  if(!a.puntos){ await guardarActa({ puntos: [] }, id); actasCache = await cargarActas(); a = actasCache.find(x=>x.id===id); }
  const host = document.getElementById("modalActaHost");
  host.innerHTML = `
    <div class="modalBg">
      <div class="modalBox" style="max-width:760px;">
        <button class="closeX" onclick="document.getElementById('modalActaHost').innerHTML=''; pintarTablaActas();">×</button>
        <h3>📌 Puntos tratados — Para Avance</h3>
        <p style="color:var(--muted);margin-top:-8px;"><b>${escapeHtml(a.titulo)}</b> — ${fmtFecha(a.fecha)}</p>
        <div id="avanceActaWrap"></div>
        <p class="helpNote">Estos son los puntos que determinan el % de Avance de la reunión. Agrégalos aquí y ve sumándoles seguimiento las veces que haga falta (en esta sesión o en cualquier momento posterior) sin perder el historial de avances anteriores.</p>
        <div class="field"><label>Nuevo punto (Para Avance)</label><input type="text" id="nuevoPuntoActa" placeholder="Describe un punto tratado y presiona 'Agregar'" style="width:100%;"></div>
        <button class="btn small" onclick="agregarPuntoActa('${id}')">+ Agregar punto</button>
        <div id="listaPuntosActa" style="margin-top:14px;"></div>
      </div>
    </div>`;
  pintarListaPuntosActa(id);
}

  const a = actasCache.find(x=>x.id===id);

async function guardarActaForm(id){

    asistentes: _actaAsistentesTemp.filter(a=>a.nombre.trim()),

    pendientes: val("actaPendientes"),

function bloqueLista(texto){
  const items = (texto||"").split("\n").map(s=>s.trim()).filter(Boolean);
  return items.length ? items.map(i=>`<li>${escapeHtml(i)}</li>`).join("") : `<li style="color:#888;">Ninguno</li>`;
}

async function imprimirActa(id){
  const a = actasCache.find(x=>x.id===id);
  const asistentes = normalizarAsistentes(a.asistentes);
  const firmantes = (a.firmantes||"").split("\n").map(s=>s.trim()).filter(Boolean);
  const puntos = a.puntos||[];
  const porcentajeAvance = calcularAvanceActa(puntos);
  const bloqueSeguimiento = puntos.length ? puntos.map(p => `
    <div style="margin-bottom:10px;">
      <p style="margin:0;"><b>${escapeHtml(p.descripcion)}</b> — <i>${ESTADO_PUNTO_ACTA_INFO[p.estado]?.label||p.estado}</i></p>
      ${(p.seguimientos||[]).length ? `<ul style="margin:4px 0;">${p.seguimientos.map(s=>`<li style="font-size:12px;"><b>${fmtFecha(s.fecha)}:</b> ${escapeHtml(s.nota)}</li>`).join("")}</ul>` : `<p style="font-size:12px;color:#888;margin:2px 0;">Sin seguimiento registrado.</p>`}
    </div>`).join("") : `<ul>${bloqueLista(a.asuntos)}</ul>`;

    <style>body{font-family:Arial,sans-serif;padding:32px;color:#111;} h1{font-size:18px;} h2{font-size:14px;margin-top:18px;} ul{margin:4px 0;} .firmas{display:flex;gap:40px;margin-top:50px;flex-wrap:wrap;} .firma{text-align:center;width:220px;border-top:1px solid #333;padding-top:6px;margin-top:40px;font-size:13px;}</style>
    </head><body>
    <h1>ACTA DE REUNIÓN — ${escapeHtml(a.titulo)}</h1>
    <p><b>Fecha:</b> ${fmtFecha(a.fecha)} &nbsp; <b>Hora/Lugar:</b> ${escapeHtml(a.horaLugar||'-')}</p>
    ${porcentajeAvance!==null?`<p><b>Avance de la reunión:</b> ${porcentajeAvance}% (según puntos cerrados/en proceso/pendientes)</p>`:''}
    <h2>Asistentes</h2><ul>${asistentes.length?asistentes.map(x=>`<li>${escapeHtml(x.nombre)}${x.cargo?' — '+escapeHtml(x.cargo):''}</li>`).join(""):'<li style="color:#888;">Ninguno</li>'}</ul>
    <h2>Puntos tratados y seguimiento</h2>${bloqueSeguimiento}

    ${a.proximaReunion?`<h2>Próxima reunión</h2><p>${escapeHtml(a.proximaReunion)}</p>`:''}
    <div class="firmas">${firmantes.map(f=>`<div class="firma">${escapeHtml(f)}</div>`).join("") || '<p style="color:#888;">Sin firmantes registrados</p>'}</div>
    </body></html>`);
  win.document.close(); win.focus(); win.print();
}

/* --- Envío del acta por WhatsApp, con las referencias personalizadas de cada asistente --- */
function extraerReferenciasAsistente(nombreAsistente, textoAsuntos){
  if(!nombreAsistente || !textoAsuntos) return [];
  const primerNombre = nombreAsistente.trim().split(/\s+/)[0].toLowerCase();
  const lineas = textoAsuntos.split("\n").map(l=>l.trim()).filter(Boolean);
  return lineas.filter(l => l.toLowerCase().includes(primerNombre));
}

function abrirEnvioWhatsAppActa(id){
  const a = actasCache.find(x=>x.id===id);
  const asistentes = normalizarAsistentes(a.asistentes);
  const host = document.getElementById("modalActaHost");
  host.innerHTML = `
    <div class="modalBg">
      <div class="modalBox" style="max-width:600px;">
        <button class="closeX" onclick="document.getElementById('modalActaHost').innerHTML=''">×</button>
        <h3>📲 Enviar acta por WhatsApp</h3>
        <p class="helpNote">Se genera un mensaje para cada asistente con los datos generales de la reunión y, si se le nombra en "Asuntos tratados", las líneas específicas que le corresponden.</p>
        ${!asistentes.length ? `<p style="color:var(--muted);">Esta acta no tiene asistentes con datos registrados. Edita el acta y agrégalos.</p>` :
        asistentes.map((asis, idx) => {
          const sinWsp = !asis.whatsapp;
          return `<div class="checklistItem">
            <div style="flex:1;">
              <b>${escapeHtml(asis.nombre)}</b> ${asis.cargo?`<span class="pill muted">${escapeHtml(asis.cargo)}</span>`:''}
              ${sinWsp ? `<div class="meta" style="color:var(--warn);">Sin número de WhatsApp registrado</div>` : `<div class="meta">${escapeHtml(asis.whatsapp)}</div>`}
            </div>
            ${!sinWsp ? `<button class="btn small green" onclick="enviarActaWhatsApp('${id}', ${idx})">Enviar</button>` : ''}
          </div>`;
        }).join("")}
      </div>
    </div>`;
}

function enviarActaWhatsApp(actaId, idxAsistente){
  const a = actasCache.find(x=>x.id===actaId);
  const asistentes = normalizarAsistentes(a.asistentes);
  const asis = asistentes[idxAsistente];
  if(!asis?.whatsapp) return;
  const referencias = extraerReferenciasAsistente(asis.nombre, a.asuntos);
  let mensaje = `Hola ${asis.nombre}, te comparto un resumen del Acta de Reunión "${a.titulo}" (${fmtFecha(a.fecha)}).\n`;
  if(referencias.length){
    mensaje += `\nPuntos que te corresponden:\n${referencias.map(r=>'• '+r).join('\n')}\n`;
  }
  if(a.pendientes){
    mensaje += `\nPuntos pendientes generales:\n${a.pendientes.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>'• '+l).join('\n')}\n`;
  }
  if(a.proximaReunion){
    mensaje += `\nPróxima reunión: ${a.proximaReunion}\n`;
  }
  const numeroLimpio = asis.whatsapp.replace(/[^0-9]/g,"");
  const url = `https://wa.me/${numeroLimpio}?text=${encodeURIComponent(mensaje)}`;
  window.open(url, "_blank");
}

function pintarAuditoriaEquipos(){
  const cont = document.getElementById("equiposVistaContenido");
  const hoy = new Date();
  const filas = [];
  equiposCache.forEach(eq => {
    (eq.miembros||[]).forEach(m => {
      if(!m.fechaTermino || m.estado==="terminado") return;
      const dias = diasEntre(hoy, new Date(m.fechaTermino));
      if(dias<=7){
        filas.push({
          proyecto: eq.nombreProyecto, integrante: m.nombre, tarea: m.tarea,
          fechaTermino: m.fechaTermino, dias, estado: m.estado, equipoId: eq.id
        });
      }
    });
    // También el proyecto en general, si tiene fecha término vencida
    if(eq.fechaTermino){
      const diasProy = diasEntre(hoy, new Date(eq.fechaTermino));
      const pendientes = (eq.miembros||[]).some(m=>m.estado!=="terminado");
      if(diasProy<=7 && pendientes){
        filas.push({ proyecto: eq.nombreProyecto, integrante:"(Proyecto completo)", tarea:"Fecha término del proyecto", fechaTermino: eq.fechaTermino, dias: diasProy, estado:"proyecto", equipoId: eq.id });
      }
    }
  });
  filas.sort((a,b)=>a.fechaTermino-b.fechaTermino);

  cont.innerHTML = `
    <div class="card">

          <td>${fmtFecha(f.fechaTermino)} ${f.dias<0?'<span class="pill danger">Vencido</span>':'<span class="pill warn">Próximo</span>'}</td>
          <td>${ESTADO_TAREA_INFO[f.estado]?.label || (f.estado==='proyecto'?'Proyecto':f.estado)}</td>

async function agregarPuntoManual(equipoId){
  const input = document.getElementById("nuevoPuntoManual");
  const desc = input.value.trim();
  if(!desc){ alert("Escribe la descripción del punto."); return; }
  const eq = equiposCache.find(x=>x.id===equipoId);
  const nuevoPunto = { id:"p_"+Date.now()+"_"+Math.floor(Math.random()*10000), descripcion:desc, soportes:[], observacion:"", cumplido:false, analisisIA:null };
  const nuevosPuntos = [...(eq.puntos||[]), nuevoPunto];
  await guardarEquipo({ puntos: nuevosPuntos }, equipoId);
  equiposCache = await cargarEquipos();
  input.value = "";
  pintarListaPuntosProyecto(equipoId, nuevosPuntos);
}

async function ejecutarGenerarPuntos(equipoId){
  const texto = document.getElementById("eqTextoRespaldo").value.trim();
  if(!texto){ alert("Sube un archivo o pega el texto del documento de respaldo."); return; }
  const estadoEl = document.getElementById("eqEstadoPuntos");
  estadoEl.innerHTML = `<span class="spinner"></span> Analizando con IA...`;
  try{
    const resultado = await llamarIA("generar_puntos_proyecto", texto, "");
    const eq = equiposCache.find(x=>x.id===equipoId);
    const puntosExistentes = eq.puntos||[];
    const nuevosPuntos = [
      ...puntosExistentes,
      ...(resultado.puntos||[]).map(desc => ({
        id: "p_"+Date.now()+"_"+Math.floor(Math.random()*10000),
        descripcion: desc, soportes: [], observacion: "", cumplido: false, analisisIA: null
      }))
    ];
    await guardarEquipo({ textoRespaldo: texto, puntos: nuevosPuntos }, equipoId);
    equiposCache = await cargarEquipos();
    estadoEl.textContent = `Se generaron ${resultado.puntos?.length||0} puntos.`;
    pintarListaPuntosProyecto(equipoId, nuevosPuntos);
  }catch(e){
    estadoEl.textContent = "";
    alert("No se pudo generar los puntos: " + e.message);
  }
}

async function guardarLinkGeneral(equipoId, url){

}

async function ejecutarAnalizarLinkGeneral(equipoId, checkboxEl){
  if(!checkboxEl.checked) return; // solo dispara al marcar, no al desmarcar
  const eq = equiposCache.find(x=>x.id===equipoId);
  const url = document.getElementById("eqLinkGeneral").value.trim();
  const puntos = eq.puntos||[];
  if(!url){ alert("Pega el enlace primero."); checkboxEl.checked = false; return; }
  if(!puntos.length){ alert("Este proyecto todavía no tiene puntos requeridos generados."); checkboxEl.checked = false; return; }
  await guardarLinkGeneral(equipoId, url);
  setSafeHTML("eqEstadoLinkGeneral", `<span class="spinner"></span> Leyendo enlace...`);
  setSafeHTML("resultadoLinkGeneral", "");
  try{
    const leido = await leerEnlace(url);
    setSafeText("eqEstadoLinkGeneral", "Enlace leído. Analizando con IA...");
    const listaPuntos = puntos.map((p,i) => `${i+1}. ${p.descripcion}`).join("\n");
    const resultado = leido.tipo==="pdf"
      ? await llamarIAConPdfs("analizar_respaldo_general_proyecto", null, listaPuntos, [{ data: leido.pdfBase64, nombre: url }])
      : await llamarIA("analizar_respaldo_general_proyecto", leido.texto, listaPuntos);
    await guardarEquipo({ analisisRespaldoGeneral: resultado }, equipoId);
    equiposCache = await cargarEquipos();
    setSafeText("eqEstadoLinkGeneral", "Análisis completo.");
    setSafeHTML("resultadoLinkGeneral", renderAnalisisRespaldoGeneral(resultado));
  }catch(e){
    setSafeText("eqEstadoLinkGeneral", "");
    alert("No se pudo leer/analizar el enlace: " + e.message);
    checkboxEl.checked = false;
  }
}

// Analiza un .zip como respaldo de todos los puntos del proyecto. El ZIP se
// procesa por completo en el navegador y NUNCA se guarda (ni el zip ni los
// archivos que trae adentro) — solo se guarda el resultado del análisis de
// la IA, igual que con el link general.
async function ejecutarAnalizarZipGeneral(equipoId){
  const input = document.getElementById("eqZipGeneral");
  const file = input.files[0];
  if(!file){ alert("Selecciona un archivo .zip primero."); return; }
  const eq = equiposCache.find(x=>x.id===equipoId);
  const puntos = eq.puntos||[];
  if(!puntos.length){ alert("Este proyecto todavía no tiene puntos requeridos generados."); return; }
  setSafeHTML("eqEstadoLinkGeneral", `<span class="spinner"></span> Leyendo ZIP (puede tardar si trae muchos archivos)...`);
  setSafeHTML("resultadoLinkGeneral", "");
  try{
    const leido = await leerZip(file);
    if(!leido.textos.length && !leido.pdfsNativos.length){
      throw new Error(`No se pudo leer ningún archivo dentro del ZIP (${leido.totalArchivos} archivo(s) revisados). Formatos soportados: PDF, Excel, Word, TXT.`);
    }
    setSafeText("eqEstadoLinkGeneral", `Se leyeron ${leido.textos.length + leido.pdfsNativos.length} de ${leido.totalArchivos} archivo(s). Analizando con IA...`);
    const listaPuntos = puntos.map((p,i) => `${i+1}. ${p.descripcion}`).join("\n");
    const contenidoCombinado = leido.textos.map(t => `--- Archivo: ${t.nombre} ---\n${t.contenido}`).join("\n\n") || null;
    const resultado = leido.pdfsNativos.length
      ? await llamarIAConPdfs("analizar_respaldo_general_proyecto", contenidoCombinado, listaPuntos, leido.pdfsNativos)
      : await llamarIA("analizar_respaldo_general_proyecto", contenidoCombinado, listaPuntos);
    await guardarEquipo({ analisisRespaldoGeneral: resultado }, equipoId);
    equiposCache = await cargarEquipos();
    const notaNoLegibles = leido.noLegibles.length ? ` (no se pudieron leer: ${leido.noLegibles.join(", ")})` : "";
    setSafeText("eqEstadoLinkGeneral", "Análisis completo." + notaNoLegibles);
    setSafeHTML("resultadoLinkGeneral", renderAnalisisRespaldoGeneral(resultado));
    input.value = "";
  }catch(e){
    setSafeText("eqEstadoLinkGeneral", "");
    alert("No se pudo leer/analizar el ZIP: " + e.message);
  }
}

// El modal de detalle del equipo puede cerrarse mientras una operación async
// (guardar, subir, analizar) sigue en curso. Estos helpers evitan que la app
// truene con "Cannot set properties of null" si el elemento ya no está en el
// DOM para cuando la operación termina — el dato ya se guardó correctamente
// en Firebase de todas formas, solo se omite la actualización visual.
function setSafeHTML(id, html){
  const el = document.getElementById(id);
  if(el) el.innerHTML = html;
}
function setSafeText(id, texto){
  const el = document.getElementById(id);
  if(el) el.textContent = texto;
}

async function eliminarSoportePunto(equipoId, puntoId, idxSoporte){
  if(!confirm("¿Eliminar este adjunto/soporte?")) return;
  try{
    const eq = equiposCache.find(x=>x.id===equipoId);
    const puntos = [...(eq.puntos||[])];
    const idx = puntos.findIndex(x=>x.id===puntoId);
    const soporteAEliminar = (puntos[idx].soportes||[])[idxSoporte];
    const nuevosSoportes = (puntos[idx].soportes||[]).filter((_,i)=>i!==idxSoporte);
    puntos[idx] = {...puntos[idx], soportes: nuevosSoportes};
    await guardarEquipo({ puntos }, equipoId);
    // Si el soporte tenía un PDF pesado guardado aparte, lo borramos también.
    if(soporteAEliminar && soporteAEliminar.pdfRef){
      eliminarPdfSoporte(soporteAEliminar.pdfRef).catch(e=>console.warn("No se pudo borrar el PDF pesado asociado", e));
    }
    equiposCache = await cargarEquipos();
    setSafeHTML("soportes_"+puntoId, renderSoportesPunto(equipoId, puntoId, nuevosSoportes));
  }catch(e){
    alert("No se pudo eliminar el adjunto: " + (e.message||e));
  }
}

// Evita que la extracción de texto se quede colgada indefinidamente con
// archivos problemáticos: si no termina en el plazo dado, sigue adelante
// como si no se hubiera podido extraer texto (en vez de trabar la interfaz).
function conTimeout(promesa, ms){
  return Promise.race([
    promesa,
    new Promise(resolve => setTimeout(()=>resolve(""), ms))
  ]);
}

const TAMANIO_MAXIMO_PDF_NATIVO = 4*1024*1024; // 4 MB: deja margen bajo el límite de tamaño de solicitud de Netlify
const TAMANIO_MAXIMO_LECTURA_LOCAL = 15*1024*1024; // 15 MB: por encima de esto no intentamos ni renderizar el PDF con pdf.js (para no trabar el navegador)

async function agregarSoporteArchivo(equipoId, puntoId){
  const input = document.getElementById("archivo_"+puntoId);
  const file = input.files[0];
  if(!file){ alert("Selecciona un archivo primero."); return; }
  const esPdf = /\.pdf$/i.test(file.name) || file.type==="application/pdf";
  try{
    let textoUtil = "";
    if(file.size > TAMANIO_MAXIMO_LECTURA_LOCAL){
      // Archivo muy pesado: no intentamos renderizar cada página con pdf.js
      // (eso es lo que trababa el navegador); vamos directo a adjuntarlo para
      // que la IA lo lea, si es PDF y cabe dentro del límite de envío.
      setSafeText("estadoPunto_"+puntoId, "Archivo pesado: se omite la lectura local de texto...");
    } else {
      setSafeText("estadoPunto_"+puntoId, "Leyendo archivo (puede tardar unos segundos si es grande)...");
      const textoBruto = await conTimeout(extraerTextoDeArchivo(file), 20000);
      // Umbral: un PDF escaneado puede devolver un puñado de caracteres "basura"
      // (metadatos, números de página sueltos, una capa de OCR parcial) que no
      // alcanza para que la IA analice el contenido real. Si hay menos de 40
      // caracteres útiles, lo tratamos igual que "sin texto".
      textoUtil = (textoBruto||"").trim().length >= 40 ? textoBruto.trim() : "";
    }

    const eq = equiposCache.find(x=>x.id===equipoId);
    const puntos = [...(eq.puntos||[])];
    const idx = puntos.findIndex(x=>x.id===puntoId);
    const nuevoSoporte = { tipo:"archivo", nombre:file.name, contenidoTexto: textoUtil };
    let mensajeEstado;

    if(esPdf && !textoUtil){
      if(file.size > TAMANIO_MAXIMO_PDF_NATIVO){
        mensajeEstado = `Archivo adjuntado, pero pesa ${(file.size/1024/1024).toFixed(1)} MB y no tiene texto extraíble — supera el límite de ${(TAMANIO_MAXIMO_PDF_NATIVO/1024/1024)} MB para que la IA lo lea directamente. Comprímelo, divídelo en partes más pequeñas, o pega el texto manualmente.`;
      } else {
        setSafeText("estadoPunto_"+puntoId, "Convirtiendo PDF para envío a la IA...");
        const soporteId = "sp_"+Date.now()+"_"+Math.floor(Math.random()*100000);
        const base64 = await archivoABase64(file);
        await guardarPdfSoporte(soporteId, base64);
        nuevoSoporte.pdfRef = soporteId;
        mensajeEstado = "Archivo adjuntado. No tiene texto extraíble útil (parece un escaneo/imagen) — la IA leerá el PDF directamente al analizar este punto.";
      }
    } else {
      mensajeEstado = textoUtil ? "Archivo adjuntado y leído." : "Archivo adjuntado (no se pudo extraer texto automáticamente; formato no compatible con lectura automática).";
    }

    puntos[idx] = {...puntos[idx], soportes:[...(puntos[idx].soportes||[]), nuevoSoporte]};
    await guardarEquipo({ puntos }, equipoId);
    equiposCache = await cargarEquipos();
    setSafeHTML("soportes_"+puntoId, renderSoportesPunto(equipoId, puntoId, puntos[idx].soportes));
    setSafeText("estadoPunto_"+puntoId, mensajeEstado);
    input.value = "";
  }catch(e){
    setSafeText("estadoPunto_"+puntoId, "");
    alert("No se pudo adjuntar el archivo: " + (e.message||e));
  }
}

async function agregarSoporteLink(equipoId, puntoId){

async function ejecutarAnalizarPunto(equipoId, puntoId){
  const eq = equiposCache.find(x=>x.id===equipoId);
  const punto = (eq.puntos||[]).find(x=>x.id===puntoId);
  const soportes = punto.soportes||[];
  const soportesArchivoConTexto = soportes.filter(s => s.tipo==="archivo" && s.contenidoTexto);
  const soportesLink = soportes.filter(s => s.tipo==="link");
  // Soportes que son PDF sin texto extraíble (escaneos/imágenes): su PDF se guardó
  // aparte (pdfRef) y se carga bajo demanda justo antes de llamar a la IA.
  const soportesPdfNativos = soportes.filter(s => s.tipo==="archivo" && !s.contenidoTexto && s.pdfRef);
  if(!soportesArchivoConTexto.length && !soportesPdfNativos.length && !soportesLink.length){ alert("Adjunta al menos un soporte (archivo o link) antes de analizar."); return; }
  setSafeHTML("estadoPunto_"+puntoId, `<span class="spinner"></span> Analizando con IA...`);
  try{
    const partesTexto = soportesArchivoConTexto.map(s => `Archivo "${s.nombre}": ${s.contenidoTexto}`);
    const pdfs = [];

    // Intenta leer cada enlace (OneDrive/Drive) para que la IA analice su
    // contenido real, en vez de solo saber que existe el enlace.
    if(soportesLink.length){
      setSafeHTML("estadoPunto_"+puntoId, `<span class="spinner"></span> Leyendo enlace(s)...`);
      for(const s of soportesLink){
        try{
          const leido = await leerEnlace(s.url);
          if(leido.tipo==="pdf") pdfs.push({ data: leido.pdfBase64, nombre: s.nombre||s.url });
          else partesTexto.push(`Enlace "${s.nombre||s.url}" (${s.url}):\n${leido.texto}`);
        }catch(err){
          partesTexto.push(`Enlace "${s.nombre||s.url}" (${s.url}): no se pudo leer automáticamente (${err.message}). Trátalo solo como referencia, sin su contenido.`);
        }
      }
    }

    // PDF ya adjuntados como archivo sin texto extraíble (escaneos/imágenes)
    if(soportesPdfNativos.length){
      setSafeHTML("estadoPunto_"+puntoId, `<span class="spinner"></span> Cargando PDF adjunto(s)...`);
      for(const s of soportesPdfNativos){
        const base64 = await cargarPdfSoporte(s.pdfRef);
        if(base64) pdfs.push({ data: base64, nombre: s.nombre });
      }
    }

    const contenidoTexto = partesTexto.join("\n\n").trim() || null;
    if(!contenidoTexto && !pdfs.length){ throw new Error("No se pudo leer contenido de ningún soporte. Vuelve a subir el archivo o revisa que el enlace sea público."); }

    setSafeHTML("estadoPunto_"+puntoId, `<span class="spinner"></span> Analizando con IA...`);
    const resultado = pdfs.length
      ? await llamarIAConPdfs("analizar_punto_proyecto", contenidoTexto, punto.descripcion, pdfs)
      : await llamarIA("analizar_punto_proyecto", contenidoTexto, punto.descripcion);

    const puntos = [...(eq.puntos||[])];
    const idx = puntos.findIndex(x=>x.id===puntoId);
    puntos[idx] = {...puntos[idx], analisisIA: resultado};
    await guardarEquipo({ puntos }, equipoId);
    equiposCache = await cargarEquipos();
    setSafeText("estadoPunto_"+puntoId, "Análisis completo.");
    if(document.getElementById("listaPuntosProyecto")) pintarListaPuntosProyecto(equipoId, puntos);
  }catch(e){
    setSafeText("estadoPunto_"+puntoId, "");
    alert("No se pudo analizar: " + e.message);
  }
}

async function actualizarMiembro(equipoId, idx, campo, valor){
  const eq = equiposCache.find(x=>x.id===equipoId);
  const miembros = [...(eq.miembros||[])];
  miembros[idx] = {...miembros[idx], [campo]: valor};

let colaboradoresCache = [];

function diasHastaProximoCumpleanos(fechaNacTimestamp){
  const nac = new Date(fechaNacTimestamp);
  const hoy = new Date();
  const hoySinHora = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate());
  let proximo = new Date(hoy.getFullYear(), nac.getMonth(), nac.getDate());
  if(proximo < hoySinHora) proximo = new Date(hoy.getFullYear()+1, nac.getMonth(), nac.getDate());
  return Math.round((proximo - hoySinHora)/86400000);
}
function edadQueCumple(fechaNacTimestamp){
  const nac = new Date(fechaNacTimestamp);
  const dias = diasHastaProximoCumpleanos(fechaNacTimestamp);
  const fechaCumple = new Date(Date.now()+dias*86400000);
  return fechaCumple.getFullYear() - nac.getFullYear();
}

// Llama a la función serverless con el token de sesión del admin actual, para
// que el servidor pueda verificar que quien pide la acción es realmente admin.
async function llamarGestionUsuarios(payload){
  const idToken = await currentUser.getIdToken();
  const resp = await fetch(CREAR_USUARIO_ENDPOINT, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ idToken, ...payload })
  });
  const textoCrudo = await resp.text();
  let data;
  try{ data = JSON.parse(textoCrudo); }
  catch(e){ throw new Error(`La función respondió algo inesperado (HTTP ${resp.status}): ${textoCrudo.slice(0,200)}`); }
  if(!resp.ok || data.error){ throw new Error(data.error || `Error al gestionar usuarios (HTTP ${resp.status}).`); }
  return data;
}

   ========================================================================= */
let activosFijosCache = [];
let empresaActivosSeleccionada = null;

function calcularDepreciacionActivo(activo){
  const costo = Number(activo.costoCompra||0);
  const residual = Number(activo.valorResidual||0);
  const vidaUtil = Number(activo.vidaUtilAnios||0);
  if(vidaUtil<=0 || !activo.fechaCompra) return {depreciacionAnual:0, depreciacionAcumulada:0, valorLibros:costo, vidaUtilCumplida:false, aniosTranscurridos:0};
  const aniosTranscurridos = (Date.now()-new Date(activo.fechaCompra).getTime())/(365.25*86400000);
  const depreciacionAnual = (costo-residual)/vidaUtil;
  const depreciacionAcumulada = Math.min(depreciacionAnual*Math.max(aniosTranscurridos,0), costo-residual);
  const valorLibros = Math.max(costo - depreciacionAcumulada, residual);
  return { depreciacionAnual, depreciacionAcumulada, valorLibros, vidaUtilCumplida: aniosTranscurridos>=vidaUtil, aniosTranscurridos };
}

async function agregarMejoraActivo(activoId){
  const fecha = document.getElementById("mejFecha").value;
  const descripcion = document.getElementById("mejDescripcion").value.trim();
  const costo = parseFloat(document.getElementById("mejCosto").value)||0;
  if(!fecha || !descripcion){ alert("Completa fecha y descripción de la mejora."); return; }
  const a = activosFijosCache.find(x=>x.id===activoId);
  const nuevasMejoras = [...(a.mejoras||[]), { fecha: new Date(fecha+"T00:00:00").getTime(), descripcion, costo }];
  await guardarActivoFijo({ mejoras: nuevasMejoras }, activoId);
  activosFijosCache = await cargarActivosFijos(empresaActivosSeleccionada);
  pintarListaMejoras(nuevasMejoras);
  document.getElementById("mejFecha").value=""; document.getElementById("mejDescripcion").value=""; document.getElementById("mejCosto").value="";
}

async function pintarListaBancos(){
  const cont = document.getElementById("vistaBancariaInterna");
  try{
    bancosCache = await cargarBancos(empresaBancariaSeleccionada);
  }catch(e){
    cont.innerHTML = `<div class="card emptyState" style="color:var(--danger);">No se pudo cargar. Error: ${escapeHtml(e.message||String(e))}<br><span style="font-size:12px;">Si dice "permission_denied", agrega la ruta "bancos_empresa" a las reglas de Realtime Database.</span></div>`;
    return;
  }
  const hoy = new Date();
  const alertas = [];
  bancosCache.forEach(b => (b.lineasCredito||[]).forEach(l => {
    if(l.vencimiento){
      const dias = diasEntre(hoy, new Date(l.vencimiento));
      if(dias<=30) alertas.push({banco:b.nombreBanco, monto:l.monto, vencimiento:l.vencimiento, dias});
    }
  }));
  cont.innerHTML = `
    <div class="card"><button class="btn primary" onclick="abrirFormularioBanco()">+ Nuevo banco</button></div>
    ${alertas.length ? `<div class="card" style="border-color:var(--warn);">
      <h3 style="margin-top:0;color:var(--warn);">⚠️ Líneas de crédito por vencer (30 días)</h3>
      ${alertas.map(a=>`<p>${escapeHtml(a.banco)} — $${Number(a.monto||0).toFixed(2)} — vence ${fmtFecha(a.vencimiento)} ${a.dias<0?'<span class="pill danger">Vencida</span>':'<span class="pill warn">Próxima</span>'}</p>`).join("")}
    </div>` : ''}
    <div class="card" id="tablaBancos"></div>
  `;
  pintarTablaBancos();
}

async function agregarLineaCredito(bancoId){

async function pintarFlujoCaja(){
  const cont = document.getElementById("vistaBancariaInterna");
  const datos = await cargarFlujoCaja(empresaBancariaSeleccionada) || {};
  cont.innerHTML = `
    <div class="card">
      <p class="helpNote">Proyección simple a 2 años para presentar al banco, aplicando el mismo porcentaje de crecimiento anual sobre ingresos y gastos.</p>
      <div class="grid2">
        <div class="field"><label>Ingreso anual base (año actual, USD)</label><input type="number" id="fcIngreso" value="${datos.ingresoBase||''}"></div>
        <div class="field"><label>Gasto anual base (año actual, USD)</label><input type="number" id="fcGasto" value="${datos.gastoBase||''}"></div>
      </div>
      <div class="field"><label>Porcentaje de crecimiento anual estimado (%)</label><input type="number" id="fcCrecimiento" value="${datos.porcentajeCrecimiento||''}"></div>
      <div class="field"><label>Notas / supuestos (opcional)</label><textarea id="fcNotas" rows="2">${escapeHtml(datos.notas||'')}</textarea></div>

    </div>
    <div class="card" id="tablaFlujoCaja"></div>
  `;
  if(datos.ingresoBase) pintarTablaFlujoCaja(datos);

function pintarTablaFlujoCaja(datos){
  const cont = document.getElementById("tablaFlujoCaja");
  const cr = Number(datos.porcentajeCrecimiento||0)/100;
  const anioActual = new Date().getFullYear();
  const filas = [0,1,2].map(offset => {
    const factor = Math.pow(1+cr, offset);
    const ingreso = Number(datos.ingresoBase||0)*factor;
    const gasto = Number(datos.gastoBase||0)*factor;
    return { anio: anioActual+offset, ingreso, gasto, neto: ingreso-gasto };
  });
  cont.innerHTML = `
    <table><thead><tr><th>Año</th><th>Ingreso proyectado</th><th>Gasto proyectado</th><th>Flujo neto</th></tr></thead><tbody>
      ${filas.map(f=>`<tr><td>${f.anio}</td><td>$${f.ingreso.toFixed(2)}</td><td>$${f.gasto.toFixed(2)}</td><td>$${f.neto.toFixed(2)}</td></tr>`).join("")}
    </tbody></table>
    <button class="btn small" style="margin-top:10px;" onclick="imprimirFlujoCaja()">🖨️ Imprimir para el banco</button>
  `;
}

async function calcularYGuardarFlujoCaja(){
  const datos = {
    ingresoBase: parseFloat(document.getElementById("fcIngreso").value)||0,
    gastoBase: parseFloat(document.getElementById("fcGasto").value)||0,
    porcentajeCrecimiento: parseFloat(document.getElementById("fcCrecimiento").value)||0,
    notas: document.getElementById("fcNotas").value,
  };
  await guardarFlujoCaja(empresaBancariaSeleccionada, datos);
  pintarTablaFlujoCaja(datos);
}

let vacacionesCache = [];

async function renderVacaciones(){
  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="pageTitle"><div><h2>Planificación de Vacaciones</h2><p>Controla quién sale, cuándo regresa, y quién queda a cargo del puesto mientras tanto</p></div>
      <button class="btn primary" onclick="abrirFormularioVacacion()">+ Nueva vacación</button></div>
    <div class="card" id="alertasVacaciones"></div>
    <div class="card" id="tablaVacaciones">Cargando...</div>
    <div id="modalVacacionHost"></div>
  `;
  try{
    vacacionesCache = await cargarVacaciones();
  }catch(e){
    document.getElementById("tablaVacaciones").innerHTML = `<div class="emptyState" style="color:var(--danger);">No se pudo cargar. Error: ${escapeHtml(e.message||String(e))}<br><span style="font-size:12px;">Si dice "permission_denied", agrega la ruta "vacaciones" a las reglas de Realtime Database.</span></div>`;
    document.getElementById("alertasVacaciones").innerHTML = "";
    return;
  }
  pintarAlertasVacaciones();
  pintarTablaVacaciones();
}

// Compatibilidad: registros creados antes de este cambio guardaron el dato
// bajo "responsableVehiculo"; los nuevos usan "responsablePuesto".
function responsablePuestoDe(v){
  return v.responsablePuesto || v.responsableVehiculo || "";
}

function pintarAlertasVacaciones(){
  const cont = document.getElementById("alertasVacaciones");
  const hoy = new Date();
  const actuales = vacacionesCache.filter(v => v.fechaSalida<=hoy.getTime() && v.fechaRegreso>=hoy.getTime());
  const proximas = vacacionesCache.filter(v => {
    const dias = diasEntre(hoy, new Date(v.fechaSalida));
    return dias>0 && dias<=7;
  });
  cont.innerHTML = `<h3 style="margin-top:0;">🏖️ Estado actual</h3>
    ${actuales.length ? actuales.map(v=>`<p>🟢 <b>${escapeHtml(v.colaborador)}</b> está de vacaciones ahora (regresa ${fmtFecha(v.fechaRegreso)}) ${responsablePuestoDe(v)?`— puesto a cargo de <b>${escapeHtml(responsablePuestoDe(v))}</b>`:''}</p>`).join("") : ''}
    ${proximas.length ? proximas.map(v=>`<p>🟡 <b>${escapeHtml(v.colaborador)}</b> sale en ${diasEntre(hoy,new Date(v.fechaSalida))} día(s) (${fmtFecha(v.fechaSalida)})</p>`).join("") : ''}
    ${!actuales.length && !proximas.length ? `<p style="color:var(--muted);">Nadie está de vacaciones ni sale en los próximos 7 días.</p>` : ''}`;
}

function pintarTablaVacaciones(){
  const cont = document.getElementById("tablaVacaciones");
  if(!vacacionesCache.length){ cont.innerHTML = `<div class="emptyState">Aún no hay vacaciones planificadas.</div>`; return; }
  const hoy = Date.now();
  cont.innerHTML = `<table><thead><tr><th>Colaborador</th><th>Salida</th><th>Regreso</th><th>Responsable del puesto</th><th>Estado</th><th></th></tr></thead><tbody>
    ${vacacionesCache.map(v => {
      let estado = "Programada";
      if(v.fechaSalida<=hoy && v.fechaRegreso>=hoy) estado = "En curso";
      else if(v.fechaRegreso<hoy) estado = "Finalizada";
      const pillClass = estado==="En curso" ? "ok" : (estado==="Finalizada" ? "muted" : "warn");
      return `<tr>
        <td><b>${escapeHtml(v.colaborador)}</b></td>
        <td>${fmtFecha(v.fechaSalida)}</td>
        <td>${fmtFecha(v.fechaRegreso)}</td>
        <td>${escapeHtml(responsablePuestoDe(v)||'-')}</td>
        <td><span class="pill ${pillClass}">${estado}</span></td>
        <td>
          <button class="btn small" onclick="abrirFormularioVacacion('${v.id}')">Editar</button>
          <button class="btn small danger" onclick="confirmarEliminarVacacion('${v.id}')">Eliminar</button>
        </td>
      </tr>`;
    }).join("")}
  </tbody></table>`;
}

async function confirmarEliminarVacacion(id){
  if(!confirm("¿Eliminar este registro de vacaciones?")) return;
  await eliminarVacacion(id);
  vacacionesCache = await cargarVacaciones();
  pintarAlertasVacaciones();
  pintarTablaVacaciones();
}

function abrirFormularioVacacion(id){
  const v = id ? vacacionesCache.find(x=>x.id===id) : null;
  const host = document.getElementById("modalVacacionHost");
  host.innerHTML = `
    <div class="modalBg">
      <div class="modalBox">
        <button class="closeX" onclick="document.getElementById('modalVacacionHost').innerHTML=''">×</button>
        <h3>${v?"Editar":"Nueva"} vacación</h3>
        <div class="field"><label>Colaborador</label><input id="vacColaborador" value="${v?escapeHtml(v.colaborador||''):''}"></div>
        <div class="grid2">
          <div class="field"><label>Fecha de salida</label><input type="date" id="vacSalida" value="${v?.fechaSalida?new Date(v.fechaSalida).toISOString().slice(0,10):''}"></div>
          <div class="field"><label>Fecha de regreso</label><input type="date" id="vacRegreso" value="${v?.fechaRegreso?new Date(v.fechaRegreso).toISOString().slice(0,10):''}"></div>
        </div>
        <div class="field"><label>Responsable del puesto mientras está fuera</label><input id="vacResponsablePuesto" value="${v?escapeHtml(responsablePuestoDe(v)):''}"></div>
        <div class="field"><label>Observaciones</label><textarea id="vacObservaciones" rows="2">${v?escapeHtml(v.observaciones||''):''}</textarea></div>
        <button class="btn primary" style="width:100%;margin-top:8px;" onclick="guardarVacacionForm('${v?v.id:''}')">Guardar</button>
      </div>
    </div>`;
}

async function guardarVacacionForm(id){
  const val = elId => document.getElementById(elId).value;
  if(!val("vacColaborador").trim()){ alert("Ingresa el nombre del colaborador."); return; }
  if(!val("vacSalida") || !val("vacRegreso")){ alert("Ingresa fecha de salida y regreso."); return; }
  const datos = {
    colaborador: val("vacColaborador").trim(),
    fechaSalida: new Date(val("vacSalida")+"T00:00:00").getTime(),
    fechaRegreso: new Date(val("vacRegreso")+"T00:00:00").getTime(),
    responsablePuesto: val("vacResponsablePuesto").trim(),
    observaciones: val("vacObservaciones").trim(),
  };
  await guardarVacacion(datos, id||null);
  document.getElementById("modalVacacionHost").innerHTML = "";
  vacacionesCache = await cargarVacaciones();
  pintarAlertasVacaciones();
  pintarTablaVacaciones();
}

/* =========================================================================
   MÓDULO: DIVIDENDOS
   Importa el libro Excel (Resumen Capital, Resumen Dividendos, hojas por
   empresa), audita su consistencia, permite editar/agregar años manualmente,
   y genera recomendaciones de distribución con IA según la normativa vigente.
   ========================================================================= */
let datosDividendosCache = null;
let dividendoVistaActual = "importar";
let empresaDividendoSeleccionada = null;
let accionistaDividendoSeleccionado = null;

function normalizarNombreEmpresa(nombre){
  return String(nombre||"").toUpperCase().replace(/\s+S\.?A\.?S?\.?\s*$/,"").trim();
}

/* --- Utilidades de parseo de hojas --- */
function detectarFilaHeader(filas, desde){
  for(let i=desde||0; i<filas.length; i++){
    const fila = filas[i]||[];
    if(fila.some(c => String(c||"").trim().toUpperCase()==="ACCIONISTA")) return i;
  }
  return -1;
}

function mapearColumnasHeader(headerRow){
  const cols = { anios:{}, colIdentificacion:-1, colAccionista:-1, colFecha:-1, colEmpresa:-1, colTotal:-1, colImpuestoRenta:-1, colDividendoPagar:-1 };
  (headerRow||[]).forEach((val, idx) => {
    const txt = String(val==null?"":val).trim().toUpperCase();
    if(txt==="EMPRESA") cols.colEmpresa = idx;
    else if(txt==="IDENTIFICACION") cols.colIdentificacion = idx;
    else if(txt==="ACCIONISTA") cols.colAccionista = idx;
    else if(txt==="FECHA") cols.colFecha = idx;
    else if(txt==="TOTAL") cols.colTotal = idx;
    else if(txt==="IMPUESTO RENTA") cols.colImpuestoRenta = idx;
    else if(txt==="DIVIDENDO A PAGAR") cols.colDividendoPagar = idx;
    else if(/^(19|20)\d{2}$/.test(txt)) cols.anios[txt] = idx;
    else if(typeof val==="number" && val>=1990 && val<=2035) cols.anios[String(Math.round(val))] = idx;
  });
  return cols;
}

function parsearHojaResumen(filas){
  const headerIdx = detectarFilaHeader(filas, 0);
  if(headerIdx===-1) return null;
  const cols = mapearColumnasHeader(filas[headerIdx]);
  const anios = Object.keys(cols.anios).map(Number).sort((a,b)=>a-b);
  const empresas = {};
  let empresaActual = null;
  for(let i=headerIdx+1; i<filas.length; i++){
    const fila = filas[i]||[];
    const accionistaVal = String(fila[cols.colAccionista]||"").trim();
    const empresaVal = cols.colEmpresa>-1 ? String(fila[cols.colEmpresa]||"").trim() : null;
    if(empresaVal && empresaVal.toUpperCase().includes("RESUMEN GENERAL")) break;
    if(accionistaVal.toUpperCase()==="TOTAL") break;
    if(accionistaVal.toUpperCase().startsWith("COMPROBACI")) break;
    if(!accionistaVal && !empresaVal) continue;
    if(empresaVal) empresaActual = empresaVal;
    if(!empresaActual) continue;
    const claveEmpresa = normalizarNombreEmpresa(empresaActual);
    if(!empresas[claveEmpresa]) empresas[claveEmpresa] = { nombreOriginal: empresaActual, filas: [], suman: {} };
    if(accionistaVal.toUpperCase()==="SUMAN:"){
      anios.forEach(a => { empresas[claveEmpresa].suman[a] = Number(fila[cols.anios[a]])||0; });
      empresaActual = null;
      continue;
    }
    const filaDatos = { identificacion: cols.colIdentificacion>-1 ? String(fila[cols.colIdentificacion]||"") : "", accionista: accionistaVal, valores: {} };
    anios.forEach(a => { filaDatos.valores[a] = Number(fila[cols.anios[a]])||0; });
    if(cols.colTotal>-1) filaDatos.total = Number(fila[cols.colTotal])||0;
    if(cols.colImpuestoRenta>-1) filaDatos.impuestoRenta = Number(fila[cols.colImpuestoRenta])||0;
    if(cols.colDividendoPagar>-1) filaDatos.dividendoPagar = Number(fila[cols.colDividendoPagar])||0;
    empresas[claveEmpresa].filas.push(filaDatos);
  }
  return { anios, empresas };
}

function parsearHojaEmpresa(filas){
  const header1Idx = detectarFilaHeader(filas, 0);
  if(header1Idx===-1) return null;
  const cols = mapearColumnasHeader(filas[header1Idx]);
  const anios = Object.keys(cols.anios).map(Number).sort((a,b)=>a-b);
  const capital = { filas: [], suman: {} };
  let i = header1Idx+1;
  for(; i<filas.length; i++){
    const fila = filas[i]||[];
    const accionistaVal = String(fila[cols.colAccionista]||"").trim();
    if(accionistaVal.toUpperCase()==="SUMAN:"){
      anios.forEach(a=>{ capital.suman[a] = Number(fila[cols.anios[a]])||0; });
      i++;
      break;
    }
    if(!accionistaVal) continue;
    const filaDatos = { identificacion: String(fila[cols.colIdentificacion]||""), accionista: accionistaVal, valores:{} };
    anios.forEach(a=>{ filaDatos.valores[a] = Number(fila[cols.anios[a]])||0; });
    capital.filas.push(filaDatos);
  }
  const utilidad = { filas: [], suman: {}, totalDeclarado: {} };
  for(; i<filas.length; i++){
    const fila = filas[i]||[];
    const col0 = String(fila[0]||"").trim();
    const accionistaVal = String(fila[cols.colAccionista]||"").trim();
    if(col0.toUpperCase().startsWith("UTILIDAD NO DISTRIBUIDA")){
      anios.forEach(a=>{ utilidad.totalDeclarado[a] = Number(fila[cols.anios[a]])||0; });
      continue;
    }
    if(accionistaVal.toUpperCase()==="SUMAN:"){
      anios.forEach(a=>{ utilidad.suman[a] = Number(fila[cols.anios[a]])||0; });
      continue;
    }
    if(!accionistaVal) continue;
    const filaDatos = { identificacion: String(fila[cols.colIdentificacion]||""), accionista: accionistaVal, valores:{} };
    anios.forEach(a=>{ filaDatos.valores[a] = Number(fila[cols.anios[a]])||0; });
    utilidad.filas.push(filaDatos);
  }
  return { anios, capital, utilidad };
}

async function parsearLibroDividendos(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:"array"});
  const hojaCapital = wb.Sheets["Resumen Capital"];
  const hojaDividendos = wb.Sheets["Resumen Dividendos"];
  if(!hojaCapital || !hojaDividendos) throw new Error('El libro debe tener las hojas "Resumen Capital" y "Resumen Dividendos".');
  const filasCapital = XLSX.utils.sheet_to_json(hojaCapital, {header:1, defval:null, raw:true});
  const filasDividendos = XLSX.utils.sheet_to_json(hojaDividendos, {header:1, defval:null, raw:true});
  const resumenCapital = parsearHojaResumen(filasCapital);
  const resumenDividendos = parsearHojaResumen(filasDividendos);
  const nombresHojasEmpresas = wb.SheetNames.filter(n => n!=="Resumen Capital" && n!=="Resumen Dividendos");
  const porEmpresa = {};
  nombresHojasEmpresas.forEach(nombreHoja => {
    const filas = XLSX.utils.sheet_to_json(wb.Sheets[nombreHoja], {header:1, defval:null, raw:true});
    const parsed = parsearHojaEmpresa(filas);
    if(parsed) porEmpresa[normalizarNombreEmpresa(nombreHoja)] = { nombreHoja, ...parsed };
  });
  return { resumenCapital, resumenDividendos, porEmpresa, fechaImportacion: Date.now(), nombreArchivo: file.name };
}

/* --- Fusiona un nuevo archivo importado con los datos ya existentes.
   Si una empresa ya existía, el archivo más reciente la reemplaza por completo
   (no se mezclan campo por campo); los años se acumulan (unión). --- */
function fusionarDatosDividendos(base, nuevo){
  if(!base){
    return { resumenCapital: nuevo.resumenCapital, resumenDividendos: nuevo.resumenDividendos, porEmpresa: nuevo.porEmpresa,
      fechaImportacion: nuevo.fechaImportacion, nombreArchivo: nuevo.nombreArchivo };
  }
  const resultado = JSON.parse(JSON.stringify(base));
  if(!resultado.resumenCapital) resultado.resumenCapital = {anios:[], empresas:{}};
  if(!resultado.resumenDividendos) resultado.resumenDividendos = {anios:[], empresas:{}};
  if(!resultado.porEmpresa) resultado.porEmpresa = {};

  resultado.resumenCapital.anios = Array.from(new Set([...(resultado.resumenCapital.anios||[]), ...(nuevo.resumenCapital?.anios||[])])).sort((a,b)=>a-b);
  Object.keys(nuevo.resumenCapital?.empresas||{}).forEach(clave => { resultado.resumenCapital.empresas[clave] = nuevo.resumenCapital.empresas[clave]; });

  resultado.resumenDividendos.anios = Array.from(new Set([...(resultado.resumenDividendos.anios||[]), ...(nuevo.resumenDividendos?.anios||[])])).sort((a,b)=>a-b);
  Object.keys(nuevo.resumenDividendos?.empresas||{}).forEach(clave => { resultado.resumenDividendos.empresas[clave] = nuevo.resumenDividendos.empresas[clave]; });

  Object.keys(nuevo.porEmpresa||{}).forEach(clave => { resultado.porEmpresa[clave] = nuevo.porEmpresa[clave]; });

  resultado.nombreArchivo = nuevo.nombreArchivo;
  resultado.fechaImportacion = nuevo.fechaImportacion;
  return resultado;
}

/* --- Creación manual de una empresa con sus accionistas, cuando no hay plantilla Excel --- */
function crearEmpresaManualDividendos(nombre, accionistas){
  const clave = normalizarNombreEmpresa(nombre);
  const anioActual = new Date().getFullYear();
  if(!datosDividendosCache){
    datosDividendosCache = { resumenCapital:{anios:[],empresas:{}}, resumenDividendos:{anios:[],empresas:{}}, porEmpresa:{} };
  }
  if(!datosDividendosCache.resumenCapital.anios.includes(anioActual)){
    datosDividendosCache.resumenCapital.anios.push(anioActual);
    datosDividendosCache.resumenCapital.anios.sort((a,b)=>a-b);
  }
  const filasCapital = accionistas.map(a => ({ identificacion:"", accionista:a.nombre, valores:{ [anioActual]: a.porcentaje } }));
  datosDividendosCache.resumenCapital.empresas[clave] = { nombreOriginal: nombre, filas: filasCapital, suman: { [anioActual]: 100 } };
  datosDividendosCache.resumenDividendos.empresas[clave] = {
    nombreOriginal: nombre,
    filas: accionistas.map(a => ({ accionista:a.nombre, valores:{}, total:0, impuestoRenta:0, dividendoPagar:0 })),
    suman: {}
  };
  datosDividendosCache.porEmpresa[clave] = {
    nombreHoja: nombre, anios: [anioActual], origenManual: true,
    capital: { filas: JSON.parse(JSON.stringify(filasCapital)), suman: { [anioActual]: 100 } },
    utilidad: { filas: [], suman: {}, totalDeclarado: {} }
  };
  return clave;
}

/* --- Auditoría: cruces de consistencia --- */
function ejecutarAuditoriaDividendos(datos){
  const hallazgos = [];
  const TOL = 0.05;
  const empresasResumenCap = Object.keys(datos.resumenCapital?.empresas||{});
  const empresasResumenDiv = Object.keys(datos.resumenDividendos?.empresas||{});
  const todasEmpresas = Array.from(new Set([...empresasResumenCap, ...empresasResumenDiv, ...Object.keys(datos.porEmpresa||{})]));

  todasEmpresas.forEach(clave => {
    const nombreOriginal = (datos.resumenCapital?.empresas?.[clave]?.nombreOriginal) || (datos.resumenDividendos?.empresas?.[clave]?.nombreOriginal) || clave;
    const hojaEmpresa = datos.porEmpresa?.[clave];

    // 1. Capital: Resumen Capital SUMAN vs hoja de empresa (capital SUMAN)
    if(datos.resumenCapital?.empresas?.[clave] && hojaEmpresa){
      datos.resumenCapital.anios.forEach(a => {
        const v1 = datos.resumenCapital.empresas[clave].suman[a]||0;
        const v2 = hojaEmpresa.capital?.suman?.[a]||0;
        if(Math.abs(v1-v2) > TOL){
          hallazgos.push({ empresa: nombreOriginal, anio:a, tipo:"Capital: Resumen vs hoja empresa", valorA:v1, valorB:v2, diferencia: v1-v2 });
        }
      });
    }
    // 2. Dividendos: Resumen Dividendos SUMAN vs hoja de empresa (utilidad SUMAN y totalDeclarado)
    if(datos.resumenDividendos?.empresas?.[clave] && hojaEmpresa){
      datos.resumenDividendos.anios.forEach(a => {
        const vResumen = datos.resumenDividendos.empresas[clave].suman[a]||0;
        const vHojaSuman = hojaEmpresa.utilidad?.suman?.[a]||0;
        const vHojaDeclarado = hojaEmpresa.utilidad?.totalDeclarado?.[a];
        if(Math.abs(vResumen-vHojaSuman) > TOL){
          hallazgos.push({ empresa: nombreOriginal, anio:a, tipo:"Dividendos: Resumen vs SUMAN hoja empresa", valorA:vResumen, valorB:vHojaSuman, diferencia:vResumen-vHojaSuman });
        }
        if(vHojaDeclarado!==undefined && Math.abs(vHojaDeclarado-vHojaSuman) > TOL){
          hallazgos.push({ empresa: nombreOriginal, anio:a, tipo:"Dividendos: total declarado vs SUMAN accionistas (hoja empresa)", valorA:vHojaDeclarado, valorB:vHojaSuman, diferencia:vHojaDeclarado-vHojaSuman });
        }
      });
    }
    // 3. Por accionista en Resumen Dividendos: TOTAL = suma de años; DIVIDENDO A PAGAR = TOTAL - IMPUESTO RENTA
    if(datos.resumenDividendos?.empresas?.[clave]){
      datos.resumenDividendos.empresas[clave].filas.forEach(f => {
        const sumaAnios = Object.values(f.valores).reduce((s,v)=>s+(v||0),0);
        if(f.total!==undefined && Math.abs(f.total-sumaAnios) > TOL){
          hallazgos.push({ empresa: nombreOriginal, anio:"-", tipo:`TOTAL no coincide con suma de años (${f.accionista})`, valorA:f.total, valorB:sumaAnios, diferencia:f.total-sumaAnios });
        }
        if(f.total!==undefined && f.impuestoRenta!==undefined && f.dividendoPagar!==undefined){
          const esperado = f.total - f.impuestoRenta;
          if(Math.abs(esperado-f.dividendoPagar) > TOL){
            hallazgos.push({ empresa: nombreOriginal, anio:"-", tipo:`DIVIDENDO A PAGAR no coincide con TOTAL - IMPUESTO RENTA (${f.accionista})`, valorA:esperado, valorB:f.dividendoPagar, diferencia:esperado-f.dividendoPagar });
          }
        }
      });
    }
  });
  return hallazgos;
}

  const input = document.getElementById("archivoDividendos");

  const estadoEl = document.getElementById("estadoImportarDividendos");
  estadoEl.innerHTML = `<span class="spinner"></span> Procesando y validando archivo...`;
  try{
    const datosArchivo = await parsearLibroDividendos(file);
    // Auditoría individual de este archivo antes de fusionar, para avisar si ya trae inconsistencias
    const hallazgosPropios = ejecutarAuditoriaDividendos(datosArchivo);
    datosDividendosCache = fusionarDatosDividendos(datosDividendosCache, datosArchivo);
    await guardarDatosDividendos(datosDividendosCache);
    await guardarArchivoDividendos(datosArchivo);
    await registrarCambio("Dividendos", "importar", `Archivo importado: ${file.name} (${Object.keys(datosArchivo.porEmpresa).length} empresa(s))`);

    estadoEl.textContent = "";
    alert("No se pudo procesar el archivo: " + (e.message||String(e)));
  }
}

// Recalcula el Historial de Dividendos por accionista tomando, para cada año,
// la "Utilidad a Distribuir" del Comparativo SRI/Súper Cías/Contable y
// repartiéndola entre los accionistas según su % real de participación ese
// año (capital de cada accionista ese año / capital total de la empresa ese
// año, del Historial de capital social). Así el historial de dividendos
// queda consistente con esas dos fuentes en vez de depender solo del Excel
// original importado.
async function recalcularHistorialDividendosDesdeComparativo(){
  const clave = empresaDividendoSeleccionada;
  const datosCapital = datosDividendosCache.resumenCapital.empresas[clave];
  const datosResumen = datosDividendosCache.resumenDividendos.empresas[clave];
  if(!datosCapital || !datosResumen){ alert("Faltan datos de capital o de dividendos para esta empresa."); return; }
  if(!confirm(`Esto reemplaza, año por año, el valor de cada accionista en el Historial de Dividendos.

Para cada año se usa el AUMENTO real de la Utilidad Acumulada de ese año respecto al anterior (no solo el campo "Utilidad a Distribuir") — así, si algún año no tiene "Utilidad a Distribuir" registrada pero el acumulado sí subió (por ejemplo, por un ajuste manual del acumulado), esa diferencia igual se reparte y el total siempre cuadra con la Utilidad Acumulada final.

Si un año no tiene su propio dato de capital social, se usa el capital del año siguiente más cercano que sí tenga datos.

Los montos de IMP. RENTA y A PAGAR no se tocan. ¿Continuar?`)) return;

  const filasComparativo = calcularFilasComparativo(clave); // ya viene ordenado por año, con acumuladoMostrado encadenado
  const aniosCapitalLocal = datosDividendosCache.resumenCapital.anios;
  // Unión de todos los años relevantes: los del Comparativo (que ya cubren
  // 1992-año actual) y los que ya existan en el Historial de capital.
  const todosLosAnios = Array.from(new Set([...aniosCapitalLocal, ...filasComparativo.map(f=>f.anio)])).sort((a,b)=>a-b);

  // Busca el año más cercano (primero hacia adelante, luego hacia atrás si no
  // hay ninguno) que sí tenga datos de capital social, para usar su % cuando
  // el año en cuestión no tenga capital propio registrado.
  function anioConCapitalMasCercano(anio){
    if((datosCapital.suman[anio]||0) > 0) return anio;
    const haciaAdelante = aniosCapitalLocal.filter(a=>a>=anio && (datosCapital.suman[a]||0)>0).sort((a,b)=>a-b);
    if(haciaAdelante.length) return haciaAdelante[0];
    const haciaAtras = aniosCapitalLocal.filter(a=>a<=anio && (datosCapital.suman[a]||0)>0).sort((a,b)=>b-a);
    return haciaAtras.length ? haciaAtras[0] : null;
  }

  // Unión de accionistas (capital + dividendos ya existentes), para no perder a nadie
  const nombresUnion = Array.from(new Set([
    ...datosCapital.filas.map(f=>f.accionista),
    ...datosResumen.filas.map(f=>f.accionista)
  ]));
  // Reconstruye (o crea) la fila de dividendos de cada accionista, conservando
  // impuestoRenta/dividendoPagar si ya existían.
  const filasNuevas = nombresUnion.map(nombre => {
    const existente = datosResumen.filas.find(f=>f.accionista===nombre);
    return {
      accionista: nombre,
      valores: {},
      total: 0,
      impuestoRenta: existente?.impuestoRenta || 0,
      dividendoPagar: existente?.dividendoPagar || 0,
    };
  });

  const sumanNuevo = {};
  let acumuladoAnterior = 0; // arranca en 0 (año 1991, igual que en el Comparativo)
  for(const anio of todosLosAnios){
    const filaComp = filasComparativo.find(f=>f.anio===anio);
    const acumuladoEsteAnio = filaComp ? (filaComp.acumuladoMostrado||0) : acumuladoAnterior;
    // Monto EFECTIVO a repartir este año = cuánto subió el acumulado respecto
    // al año anterior — esto captura tanto la "Utilidad a Distribuir" normal
    // de ese año, como cualquier salto que venga de un ajuste manual del
    // acumulado sin una "Utilidad a Distribuir" explícita ese mismo año.
    const montoEfectivo = acumuladoEsteAnio - acumuladoAnterior;
    acumuladoAnterior = acumuladoEsteAnio;

    if(Math.abs(montoEfectivo) < 0.005){ sumanNuevo[anio] = 0; continue; }

    const anioCapitalAUsar = anioConCapitalMasCercano(anio);
    const totalCapitalAnio = anioCapitalAUsar!==null ? (datosCapital.suman[anioCapitalAUsar]||0) : 0;
    let sumaAnio = 0;
    filasNuevas.forEach(fn => {
      const filaCap = anioCapitalAUsar!==null ? datosCapital.filas.find(f=>f.accionista===fn.accionista) : null;
      const capitalAccionista = filaCap ? (filaCap.valores[anioCapitalAUsar]||0) : 0;
      const porcentaje = totalCapitalAnio ? (capitalAccionista/totalCapitalAnio) : 0;
      const valorAsignado = montoEfectivo * porcentaje;
      fn.valores[anio] = valorAsignado;
      sumaAnio += valorAsignado;
    });
    sumanNuevo[anio] = sumaAnio;
  }
  filasNuevas.forEach(fn => {
    fn.total = Object.values(fn.valores).reduce((s,v)=>s+(v||0), 0);
  });

  datosResumen.filas = filasNuevas;
  datosResumen.suman = sumanNuevo;
  datosDividendosCache.resumenDividendos.anios = todosLosAnios;

  await guardarDatosDividendos(datosDividendosCache);
  await registrarCambio("Dividendos", "editar", `Historial de dividendos recalculado desde Comparativo SRI + % de capital (con ajuste de saltos de acumulado): ${datosDividendosCache.porEmpresa[clave]?.nombreHoja||clave}`);
  pintarDetalleEmpresaDividendo();
}

// Concilia, año por año, la Utilidad Acumulada CORRIDA del Comparativo SRI...
// contra la Utilidad Acumulada corrida del Historial de Dividendos (suma
// corrida de SUMAN) — la MISMA lógica que ya usa la fila "TOTAL ACUMULADO
// EMPRESA" en pantalla. Se compara por acumulados (no por el campo "Utilidad
// a Distribuir" en crudo de cada año) porque el recálculo reparte según el
// AUMENTO real del acumulado de cada año, que puede venir de una "Utilidad a
// Distribuir" explícita o de un ajuste manual del acumulado — comparar los
// acumulados corridos es lo único que siempre refleja correctamente si ya
// cuadra o no, en cualquiera de los dos casos.
function calcularConciliacionComparativoVsDividendos(clave){
  const datosResumen = datosDividendosCache.resumenDividendos.empresas[clave];
  const filasComparativo = calcularFilasComparativo(clave);
  const aniosDividendos = datosDividendosCache.resumenDividendos.anios || [];
  const aniosUnion = Array.from(new Set([...filasComparativo.map(f=>f.anio), ...aniosDividendos])).sort((a,b)=>a-b);

  let acumuladoDividendosCorrido = 0;
  const filas = aniosUnion.map(anio => {
    const filaComp = filasComparativo.find(f=>f.anio===anio);
    const utilidadDistribuirComparativo = filaComp ? (filaComp.utilidadMostrada||0) : 0;
    const acumuladoComparativo = filaComp ? (filaComp.acumuladoMostrado||0) : null;
    const sumanDividendos = (datosResumen?.suman[anio])||0;
    acumuladoDividendosCorrido += sumanDividendos;
    const diferencia = acumuladoComparativo!==null ? (acumuladoDividendosCorrido - acumuladoComparativo) : 0;
    const cuadra = acumuladoComparativo===null ? true : Math.abs(diferencia) < 0.5;
    return { anio, utilidadDistribuirComparativo, sumanDividendos, acumuladoComparativo, acumuladoDividendosCorrido, diferencia, cuadra };
  }).filter(f => Math.abs(f.utilidadDistribuirComparativo) > 0.001 || Math.abs(f.sumanDividendos) > 0.001 || (f.acumuladoComparativo!==null && Math.abs(f.acumuladoComparativo) > 0.001));

  const ultima = filas[filas.length-1];
  const totalDiferencia = ultima ? ultima.diferencia : 0;
  const totalComparativo = ultima ? (ultima.acumuladoComparativo||0) : 0;
  const totalDividendos = ultima ? ultima.acumuladoDividendosCorrido : 0;
  return { filas, totalDiferencia, totalComparativo, totalDividendos };
}

async function guardarNuevoAnioCapital(){
  const anio = parseInt(document.getElementById("nuevoAnioCapital").value, 10);
  if(!anio){ alert("Ingresa el año a agregar."); return; }
  const datosCapital = datosDividendosCache.resumenCapital.empresas[empresaDividendoSeleccionada];
  if(!datosCapital){ alert("Genera primero las filas de accionistas."); return; }
  let sumaAnio = 0;
  datosCapital.filas.forEach((f, idx) => {
    const input = document.getElementById("nuevoCapitalMonto_"+idx);
    if(!input) return;
    const monto = parseFloat(input.value)||0;
    f.valores[anio] = monto;
    sumaAnio += monto;
  });
  datosCapital.suman[anio] = sumaAnio;
  if(!datosDividendosCache.resumenCapital.anios.includes(anio)){
    datosDividendosCache.resumenCapital.anios.push(anio);
    datosDividendosCache.resumenCapital.anios.sort((a,b)=>a-b);
  }
  // Reflejar también en la hoja individual de la empresa, si existe
  const hojaEmpresa = datosDividendosCache.porEmpresa[empresaDividendoSeleccionada];
  if(hojaEmpresa){
    if(!hojaEmpresa.anios.includes(anio)){ hojaEmpresa.anios.push(anio); hojaEmpresa.anios.sort((a,b)=>a-b); }
    hojaEmpresa.capital.filas.forEach(f => {
      const filaResumen = datosCapital.filas.find(x=>x.accionista===f.accionista);
      if(filaResumen) f.valores[anio] = filaResumen.valores[anio];
    });
    hojaEmpresa.capital.suman[anio] = sumaAnio;
  }
  await guardarDatosDividendos(datosDividendosCache);
  await registrarCambio("Dividendos", "editar", `Año ${anio} de capital agregado manualmente a ${datosDividendosCache.porEmpresa[empresaDividendoSeleccionada]?.nombreHoja||empresaDividendoSeleccionada}`);
  pintarDetalleEmpresaDividendo();
}
