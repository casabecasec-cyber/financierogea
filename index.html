/* =========================================================================
   MÓDULO: ESTADOS FINANCIEROS (sub-sección de Área Bancaria)
   Plan de cuentas editable/importable (manual o CSV/Excel) + hasta 5
   estados (periodos/años/escenarios) con valores manuales por cuenta.
   Genera automáticamente el Estado de Situación Financiera (Balance
   General: Activo = Pasivo + Patrimonio, con agrupación corriente/no
   corriente e indicador de cuadre) y el Estado de Resultados (Ingresos -
   Costos - Gastos = Utilidad). Estilo ejecutivo para impresión (mismas
   convenciones de imprimirReporteActivos: .tarjetas, .tarjeta, h2.seccion,
   tfoot, @page) y exportación a Excel real usando SheetJS (xlsx.full.min,
   ya cargado por la app — sin nuevas dependencias externas).

   Plan de cuentas: el usuario puede (a) usar el catálogo NIIF para PYMES
   predefinido (PLAN_CUENTAS_NIIF_PYMES_DEFAULT, ~180 cuentas jerárquicas),
   (b) importar su propio CSV/Excel (flujo existente sin cambios), o
   (c) crear cuentas manualmente desde cero. Convención de código
   jerárquico: "1", "1.1", "1.1.01", "1.1.01.01" (nivel = # de segmentos).
   Las cuentas de agrupación (nivel 1-3) no se usan para capturar valores
   (se dejan en 0); efCalcularEstados() suma TODAS las cuentas de un tipo
   sin hacer rollup por prefijo de código, así que mientras solo se ingresen
   valores en las cuentas de detalle (nivel más profundo de cada rama), los
   totales por tipo cuadran correctamente — no fue necesario modificar esa
   lógica de cálculo.
   ========================================================================= */
const PLAN_CUENTAS_NIIF_PYMES_DEFAULT = [
  {codigo:"1",nombre:"ACTIVO",tipo:"Activo",nivel:1,corriente:""},
  {codigo:"1.1",nombre:"ACTIVO CORRIENTE",tipo:"Activo",nivel:2,corriente:"Sí"},

function efUsarPlanPredefinido(catalogo){

function efExportarPlanCuentasCSV(){
  const filas = [['codigo','nombre','tipo','corriente','nivel'], ...efPlanCuentas.map(c=>[c.codigo||'',c.nombre||'',c.tipo||'',c.corriente||'',c.nivel||1])];
  const csv = filas.map(f=>f.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'plan_cuentas.csv'; a.click();
  URL.revokeObjectURL(a.href);
}
function efParseCSV(text){
  const lineas = text.split(/\r?\n/).filter(l=>l.trim().length);
  return lineas.map(l=>{
    const out=[]; let cur=''; let enQ=false;
    for(let i=0;i<l.length;i++){
      const ch=l[i];
      if(ch==='"'){ if(enQ && l[i+1]==='"'){ cur+='"'; i++; } else enQ=!enQ; }
      else if((ch===','||ch===';') && !enQ){ out.push(cur); cur=''; }
      else cur+=ch;
    }
    out.push(cur);
    return out.map(v=>v.trim());
  });
}
function efImportarPlanCuentas(ev){
  const file = ev.target.files[0]; if(!file) return;
  const nombreArch = file.name.toLowerCase();
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      let filas;
      if(nombreArch.endsWith('.csv')){
        filas = efParseCSV(e.target.result);
      } else {
        const wb = XLSX.read(e.target.result, {type:'binary'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        filas = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:''});
      }
      if(!filas.length){ toast('Archivo vacío', 'error'); return; }
      const header = filas[0].map(h=>String(h||'').toLowerCase().trim());
      const idxCod = header.findIndex(h=>h.includes('cod'));
      const idxNom = header.findIndex(h=>h.includes('nombre')||h.includes('cuenta'));
      const idxTipo = header.findIndex(h=>h.includes('tipo'));
      const idxCorr = header.findIndex(h=>h.includes('corriente'));
      const idxNivel = header.findIndex(h=>h.includes('nivel'));
      const nuevas = filas.slice(1).filter(r=>r.some(v=>String(v||'').trim())).map(r=>({
        codigo: idxCod>=0?String(r[idxCod]||'').trim():'',
        nombre: idxNom>=0?String(r[idxNom]||'').trim():'',
        tipo: idxTipo>=0 && EF_TIPOS.includes(String(r[idxTipo]||'').trim()) ? String(r[idxTipo]).trim() : 'Activo',
        corriente: idxCorr>=0?String(r[idxCorr]||'').trim():'',
        nivel: idxNivel>=0?(parseInt(r[idxNivel])||1):1,
      }));
      if(!nuevas.length){ toast('No se encontraron filas válidas (se esperan columnas código, nombre, tipo)', 'error'); return; }
      efPlanCuentas = efPlanCuentas.concat(nuevas);
      efPintarTablaPlan();
      efPintarValoresEstado();
      toast(`${nuevas.length} cuentas importadas ✓`, 'success');
    }catch(err){ toast('Error al leer el archivo: '+(err.message||err), 'error'); }
  };
  if(nombreArch.endsWith('.csv')) reader.readAsText(file);
  else reader.readAsBinaryString(file);
  ev.target.value = '';
}

/* --- Cálculo de los dos estados a partir del plan de cuentas + valores ---
   Verificado con dataset de prueba: Activo = Pasivo + Patrimonio + Utilidad
   dispara el indicador "cuadrado"/"no cuadra" correctamente (ver validación
   en Node adjunta al cierre de esta sesión de cambios). */
/* Cuentas "contra" (ej. depreciación acumulada, provisiones, inventario final
   en costo de ventas): el usuario ingresa el valor como magnitud positiva y
   aquí se resta automáticamente del total de su tipo/grupo, sin depender de
   que el usuario recuerde escribir el número en negativo. Las cuentas del
   catálogo NIIF PYMES original no usan esta bandera (compatibilidad total). */
function efValorCuenta(c, valores){
  const v = Number((valores||{})[c.codigo]||0);
  return c.contra ? -Math.abs(v) : v;
}
function efCalcularEstados(valores){
  valores = valores || {};
  const grupo = t => efPlanCuentas.filter(c=>c.tipo===t);
  const sum = arr => arr.reduce((s,c)=>s+efValorCuenta(c,valores),0);
  const activo = grupo('Activo'), pasivo = grupo('Pasivo'), patrimonio = grupo('Patrimonio');
  const ingreso = grupo('Ingreso'), costo = grupo('Costo'), gasto = grupo('Gasto');
  const activoCorriente = activo.filter(c=>c.corriente==='Sí'), activoNoCorriente = activo.filter(c=>c.corriente!=='Sí');
  const pasivoCorriente = pasivo.filter(c=>c.corriente==='Sí'), pasivoNoCorriente = pasivo.filter(c=>c.corriente!=='Sí');
  const totActivo = sum(activo), totPasivo = sum(pasivo), totPatrimonio = sum(patrimonio);
  const totIngreso = sum(ingreso), totCosto = sum(costo), totGasto = sum(gasto);
  const utilidad = totIngreso - totCosto - totGasto;
  const diferencia = totActivo - (totPasivo + totPatrimonio + utilidad);
  const cuadre = Math.abs(diferencia) < 0.01;
  return {
    activo, pasivo, patrimonio, ingreso, costo, gasto,
    activoCorriente, activoNoCorriente, pasivoCorriente, pasivoNoCorriente,
    totActivo, totPasivo, totPatrimonio, totIngreso, totCosto, totGasto, utilidad,
    cuadre, diferencia,
  };
}

function efCompararEstados(){
  const cont = document.getElementById('efResultado');
  if(!cont) return;
  const calcs = efEstados.map(e=>({label:e.label||'', r: efCalcularEstados(e.valores)}));
  cont.innerHTML = `

/* Exportación a Excel REAL (.xlsx binario) usando SheetJS (xlsx.full.min.js),
   que la app ya carga desde cdnjs — no se agrega ninguna dependencia nueva. */
function efExportarExcel(idx){
  const est = efEstados[idx];
  const r = efCalcularEstados(est.valores);
  const empresa = empresasCache.find(e=>e.id===empresaBancariaSeleccionada);
  const wb = XLSX.utils.book_new();
  const filaArr = c => [c.codigo||'', c.nombre||'', efValorCuenta(c,est.valores)];
  const balanceRows = [
    ['ESTADO DE SITUACIÓN FINANCIERA','',''],
    [empresa?.nombre||'', 'Periodo:', est.label||''],
    [],
    ['ACTIVO CORRIENTE','',''], ...r.activoCorriente.map(filaArr),
    ['ACTIVO NO CORRIENTE','',''], ...r.activoNoCorriente.map(filaArr),
    ['TOTAL ACTIVO','', r.totActivo],
    [],
    ['PASIVO CORRIENTE','',''], ...r.pasivoCorriente.map(filaArr),
    ['PASIVO NO CORRIENTE','',''], ...r.pasivoNoCorriente.map(filaArr),
    ['TOTAL PASIVO','', r.totPasivo],
    [],
    ['PATRIMONIO','',''], ...r.patrimonio.map(filaArr),
    ['Utilidad del ejercicio','', r.utilidad],
    ['TOTAL PASIVO + PATRIMONIO','', r.totPasivo+r.totPatrimonio+r.utilidad],
    [],
    ['Balance cuadrado', r.cuadre?'SI':'NO', r.diferencia],
  ];
  const resultadoRows = [
    ['ESTADO DE RESULTADOS','',''],
    [empresa?.nombre||'', 'Periodo:', est.label||''],
    [],
    ['INGRESOS','',''], ...r.ingreso.map(filaArr),
    ['TOTAL INGRESOS','', r.totIngreso],
    [],
    ['COSTOS','',''], ...r.costo.map(filaArr),
    ['TOTAL COSTOS','', r.totCosto],
    [],
    ['GASTOS','',''], ...r.gasto.map(filaArr),
    ['TOTAL GASTOS','', r.totGasto],
    [],
    ['UTILIDAD DEL EJERCICIO','', r.utilidad],
  ];
  const wsBal = XLSX.utils.aoa_to_sheet(balanceRows);
  const wsRes = XLSX.utils.aoa_to_sheet(resultadoRows);
  const wsPlan = XLSX.utils.aoa_to_sheet([['codigo','nombre','tipo','corriente','nivel'], ...efPlanCuentas.map(c=>[c.codigo||'',c.nombre||'',c.tipo||'',c.corriente||'',c.nivel||1])]);
  XLSX.utils.book_append_sheet(wb, wsBal, 'Situacion Financiera');
  XLSX.utils.book_append_sheet(wb, wsRes, 'Resultados');
  XLSX.utils.book_append_sheet(wb, wsPlan, 'Plan de Cuentas');
  XLSX.writeFile(wb, `Estados_Financieros_${(est.label||'periodo').replace(/[^a-z0-9]+/gi,'_')}.xlsx`);
  toast('Excel exportado ✓', 'success');
}

   MÓDULO: PLANIFICACIÓN DE VACACIONES

let vacacionesCache = [];

async function renderVacaciones(){
  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="pageTitle"><div><h2>Planificación de Vacaciones</h2><p>Controla quién sale, cuándo regresa, y quién queda a cargo del puesto mientras tanto</p></div>
      <button class="btn primary" onclick="abrirFormularioVacacion()">+ Nueva vacación</button></div>
    <div class="card" id="alertasVacaciones"></div>
    <div class="card" id="tablaVacaciones">Cargando...</div>
    <div id="modalVacacionHost"></div>
  `;
  try{
    vacacionesCache = await cargarVacaciones();
  }catch(e){
    document.getElementById("tablaVacaciones").innerHTML = `<div class="emptyState" style="color:var(--danger);">No se pudo cargar. Error: ${escapeHtml(e.message||String(e))}<br><span style="font-size:12px;">Si dice "permission_denied", agrega la ruta "vacaciones" a las reglas de Realtime Database.</span></div>`;
    document.getElementById("alertasVacaciones").innerHTML = "";
    return;
  }
  pintarAlertasVacaciones();
  pintarTablaVacaciones();
}

// Compatibilidad: registros creados antes de este cambio guardaron el dato
// bajo "responsableVehiculo"; los nuevos usan "responsablePuesto".
function responsablePuestoDe(v){
  return v.responsablePuesto || v.responsableVehiculo || "";
}

function pintarAlertasVacaciones(){
  const cont = document.getElementById("alertasVacaciones");
  const hoy = new Date();
  const actuales = vacacionesCache.filter(v => v.fechaSalida<=hoy.getTime() && v.fechaRegreso>=hoy.getTime());
  const proximas = vacacionesCache.filter(v => {
    const dias = diasEntre(hoy, new Date(v.fechaSalida));
    return dias>0 && dias<=7;
  });
  cont.innerHTML = `<h3 style="margin-top:0;">🏖️ Estado actual</h3>
    ${actuales.length ? actuales.map(v=>`<p>🟢 <b>${escapeHtml(v.colaborador)}</b> está de vacaciones ahora (regresa ${fmtFecha(v.fechaRegreso)}) ${responsablePuestoDe(v)?`— puesto a cargo de <b>${escapeHtml(responsablePuestoDe(v))}</b>`:''}</p>`).join("") : ''}
    ${proximas.length ? proximas.map(v=>`<p>🟡 <b>${escapeHtml(v.colaborador)}</b> sale en ${diasEntre(hoy,new Date(v.fechaSalida))} día(s) (${fmtFecha(v.fechaSalida)})</p>`).join("") : ''}
    ${!actuales.length && !proximas.length ? `<p style="color:var(--muted);">Nadie está de vacaciones ni sale en los próximos 7 días.</p>` : ''}`;
}

function pintarTablaVacaciones(){
  const cont = document.getElementById("tablaVacaciones");
  if(!vacacionesCache.length){ cont.innerHTML = `<div class="emptyState">Aún no hay vacaciones planificadas.</div>`; return; }
  const hoy = Date.now();
  cont.innerHTML = `<table><thead><tr><th>Colaborador</th><th>Salida</th><th>Regreso</th><th>Responsable del puesto</th><th>Estado</th><th></th></tr></thead><tbody>
    ${vacacionesCache.map(v => {
      let estado = "Programada";
      if(v.fechaSalida<=hoy && v.fechaRegreso>=hoy) estado = "En curso";
      else if(v.fechaRegreso<hoy) estado = "Finalizada";
      const pillClass = estado==="En curso" ? "ok" : (estado==="Finalizada" ? "muted" : "warn");
      return `<tr>
        <td><b>${escapeHtml(v.colaborador)}</b></td>
        <td>${fmtFecha(v.fechaSalida)}</td>
        <td>${fmtFecha(v.fechaRegreso)}</td>
        <td>${escapeHtml(responsablePuestoDe(v)||'-')}</td>
        <td><span class="pill ${pillClass}">${estado}</span></td>
        <td>
          <button class="btn small" onclick="abrirFormularioVacacion('${v.id}')">Editar</button>
          <button class="btn small danger" onclick="confirmarEliminarVacacion('${v.id}')">Eliminar</button>
        </td>
      </tr>`;
    }).join("")}
  </tbody></table>`;
}

async function confirmarEliminarVacacion(id){
  if(!confirm("¿Eliminar este registro de vacaciones?")) return;
  await eliminarVacacion(id);
  vacacionesCache = await cargarVacaciones();
  pintarAlertasVacaciones();
  pintarTablaVacaciones();
}

function abrirFormularioVacacion(id){
  const v = id ? vacacionesCache.find(x=>x.id===id) : null;
  const host = document.getElementById("modalVacacionHost");
  host.innerHTML = `
    <div class="modalBg">
      <div class="modalBox">
        <button class="closeX" onclick="document.getElementById('modalVacacionHost').innerHTML=''">×</button>
        <h3>${v?"Editar":"Nueva"} vacación</h3>
        <div class="field"><label>Colaborador</label><input id="vacColaborador" value="${v?escapeHtml(v.colaborador||''):''}"></div>
        <div class="grid2">
          <div class="field"><label>Fecha de salida</label><input type="date" id="vacSalida" value="${v?.fechaSalida?new Date(v.fechaSalida).toISOString().slice(0,10):''}"></div>
          <div class="field"><label>Fecha de regreso</label><input type="date" id="vacRegreso" value="${v?.fechaRegreso?new Date(v.fechaRegreso).toISOString().slice(0,10):''}"></div>
        </div>
        <div class="field"><label>Responsable del puesto mientras está fuera</label><input id="vacResponsablePuesto" value="${v?escapeHtml(responsablePuestoDe(v)):''}"></div>
        <div class="field"><label>Observaciones</label><textarea id="vacObservaciones" rows="2">${v?escapeHtml(v.observaciones||''):''}</textarea></div>
        <button class="btn primary" style="width:100%;margin-top:8px;" onclick="guardarVacacionForm('${v?v.id:''}')">Guardar</button>
      </div>
    </div>`;
}

async function guardarVacacionForm(id){
  const val = elId => document.getElementById(elId).value;
  if(!val("vacColaborador").trim()){ alert("Ingresa el nombre del colaborador."); return; }
  if(!val("vacSalida") || !val("vacRegreso")){ alert("Ingresa fecha de salida y regreso."); return; }
  const datos = {
    colaborador: val("vacColaborador").trim(),
    fechaSalida: new Date(val("vacSalida")+"T00:00:00").getTime(),
    fechaRegreso: new Date(val("vacRegreso")+"T00:00:00").getTime(),
    responsablePuesto: val("vacResponsablePuesto").trim(),
    observaciones: val("vacObservaciones").trim(),
  };
  await guardarVacacion(datos, id||null);
  document.getElementById("modalVacacionHost").innerHTML = "";
  vacacionesCache = await cargarVacaciones();
  pintarAlertasVacaciones();
  pintarTablaVacaciones();
}

async function ejecutarGenerarSocietario(id){

  try{

// Arma el texto compartible (mismo contenido para WhatsApp y correo)
// Fecha/hora de inicio y fin en formato compacto (YYYYMMDDTHHMMSS) que
// requieren tanto el enlace de Google Calendar como el archivo .ics. Si no
// hay hora definida, usa 09:00 como referencia; si no hay hora de fin, usa
// 1 hora de duración por defecto — son solo para armar el evento de
// calendario, no cambian lo que se guarda ni se muestra en la tabla.
function fechasCalendarioReunion(r){
  const horaInicio = r.horaInicio || "09:00";
  const inicio = new Date(`${r.fechaInicio}T${horaInicio}:00`);
  let fin;
  if(r.incluyeHoraFin && r.horaFin){
    fin = new Date(`${r.fechaInicio}T${r.horaFin}:00`);
    if(fin <= inicio) fin = new Date(inicio.getTime() + 60*60*1000);
  } else {
    fin = new Date(inicio.getTime() + 60*60*1000);
  }
  const fmt = d => d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0') + "T" + String(d.getHours()).padStart(2,'0') + String(d.getMinutes()).padStart(2,'0') + "00";
  return { inicio: fmt(inicio), fin: fmt(fin) };
}

// Enlace que abre Google Calendar con el evento ya prellenado, listo para
// agregar con un clic — es la forma real de "enviar como evento" por
// WhatsApp, ya que su API de enlace directo solo admite texto (no permite
// adjuntar archivos de calendario).
function linkGoogleCalendarReunion(r){
  const { inicio, fin } = fechasCalendarioReunion(r);
  const params = new URLSearchParams({
    action: "TEMPLATE",
    text: r.nombre,
    dates: `${inicio}/${fin}`,
    details: r.descripcion || "",
    location: r.ubicacion || "",
  });
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}

// Devuelve la lista de nombres de participantes de una reunión/evento —
// combina los miembros elegidos de la lista de Miembros y los "otros"
// escritos a mano.
function nombresParticipantesReunion(r){
  const deMiembros = (r.participantesIds||[]).map(id => colaboradoresCache.find(c=>c.id===id)?.nombre).filter(Boolean);
  return [...deMiembros, ...(r.participantesOtros||[])];
}

function textoReunionEvento(r){
  const fechaEvento = new Date(r.fechaInicio+"T00:00:00");
  const horario = r.horaInicio ? `${r.horaInicio}${r.incluyeHoraFin && r.horaFin ? ' a '+r.horaFin : ''}` : 'Sin hora definida';
  const participantes = nombresParticipantesReunion(r);
  let txt = `📅 ${r.nombre}\n\n`;
  if(r.descripcion) txt += `${r.descripcion}\n\n`;
  txt += `🗓️ Fecha: ${fmtFecha(fechaEvento.getTime())}\n`;
  txt += `🕐 Hora: ${horario}\n`;
  if(r.ubicacion) txt += `📍 Ubicación: ${r.ubicacion}\n`;
  if(participantes.length) txt += `👥 Participantes: ${participantes.join(", ")}\n`;
  txt += `\n📆 Agregar a mi calendario: ${linkGoogleCalendarReunion(r)}\n`;
  return txt;
}

// Genera el archivo .ics del evento (estándar iCalendar) — funciona para
// importar/abrir directamente en Outlook, Apple Calendar, Google Calendar, y
// la mayoría de apps de calendario. No se puede adjuntar automáticamente a un
// chat de WhatsApp (su enlace directo no lo admite), pero sí se puede
// compartir manualmente como archivo desde donde se descargue.
function generarICSReunion(r){
  const { inicio, fin } = fechasCalendarioReunion(r);
  const escaparICS = s => (s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
  const ahora = new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
  return [
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Control Documental//Reuniones y Eventos//ES",
    "BEGIN:VEVENT",
    `UID:${r.id}@control-documental`,
    `DTSTAMP:${ahora}`,
    `DTSTART:${inicio}`,
    `DTEND:${fin}`,
    `SUMMARY:${escaparICS(r.nombre)}`,
    r.descripcion ? `DESCRIPTION:${escaparICS(r.descripcion)}` : "",
    r.ubicacion ? `LOCATION:${escaparICS(r.ubicacion)}` : "",
    "END:VEVENT","END:VCALENDAR"
  ].filter(Boolean).join("\r\n");
}

function descargarICSReunion(id){
  const r = reunionesEventosCache.find(x=>x.id===id);
  if(!r) return;
  const blob = new Blob([generarICSReunion(r)], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement("a"), { href:url, download: `${r.nombre.replace(/[^\w\-]+/g,"_")}.ics` });
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function enviarReunionWhatsApp(id){
  const r = reunionesEventosCache.find(x=>x.id===id);
  if(!r) return;
  const url = `https://wa.me/?text=${encodeURIComponent(textoReunionEvento(r))}`;
  window.open(url, "_blank");
}

function enviarReunionCorreo(id){
  const r = reunionesEventosCache.find(x=>x.id===id);
  if(!r) return;
  const asunto = `Invitación: ${r.nombre}`;
  const url = `mailto:?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(textoReunionEvento(r))}`;
  window.open(url, "_blank");
}

/* =========================================================================
   MÓDULO: DIVIDENDOS
   Importa el libro Excel (Resumen Capital, Resumen Dividendos, hojas por
   empresa), audita su consistencia, permite editar/agregar años manualmente,
   y genera recomendaciones de distribución con IA según la normativa vigente.
   ========================================================================= */
let datosDividendosCache = null;
let dividendoVistaActual = "importar";
let empresaDividendoSeleccionada = null;
let accionistaDividendoSeleccionado = null;

function normalizarNombreEmpresa(nombre){
  return String(nombre||"").toUpperCase().replace(/\s+S\.?A\.?S?\.?\s*$/,"").trim();
}

/* --- Utilidades de parseo de hojas --- */
function detectarFilaHeader(filas, desde){
  for(let i=desde||0; i<filas.length; i++){
    const fila = filas[i]||[];
    if(fila.some(c => String(c||"").trim().toUpperCase()==="ACCIONISTA")) return i;
  }
  return -1;
}

function mapearColumnasHeader(headerRow){
  const cols = { anios:{}, colIdentificacion:-1, colAccionista:-1, colFecha:-1, colEmpresa:-1, colTotal:-1, colImpuestoRenta:-1, colDividendoPagar:-1 };
  (headerRow||[]).forEach((val, idx) => {
    const txt = String(val==null?"":val).trim().toUpperCase();
    if(txt==="EMPRESA") cols.colEmpresa = idx;
    else if(txt==="IDENTIFICACION") cols.colIdentificacion = idx;
    else if(txt==="ACCIONISTA") cols.colAccionista = idx;
    else if(txt==="FECHA") cols.colFecha = idx;
    else if(txt==="TOTAL") cols.colTotal = idx;
    else if(txt==="IMPUESTO RENTA") cols.colImpuestoRenta = idx;
    else if(txt==="DIVIDENDO A PAGAR") cols.colDividendoPagar = idx;
    else if(/^(19|20)\d{2}$/.test(txt)) cols.anios[txt] = idx;
    else if(typeof val==="number" && val>=1990 && val<=2035) cols.anios[String(Math.round(val))] = idx;
  });
  return cols;
}

function parsearHojaResumen(filas){
  const headerIdx = detectarFilaHeader(filas, 0);
  if(headerIdx===-1) return null;
  const cols = mapearColumnasHeader(filas[headerIdx]);
  const anios = Object.keys(cols.anios).map(Number).sort((a,b)=>a-b);
  const empresas = {};
  let empresaActual = null;
  for(let i=headerIdx+1; i<filas.length; i++){
    const fila = filas[i]||[];
    const accionistaVal = String(fila[cols.colAccionista]||"").trim();
    const empresaVal = cols.colEmpresa>-1 ? String(fila[cols.colEmpresa]||"").trim() : null;
    if(empresaVal && empresaVal.toUpperCase().includes("RESUMEN GENERAL")) break;
    if(accionistaVal.toUpperCase()==="TOTAL") break;
    if(accionistaVal.toUpperCase().startsWith("COMPROBACI")) break;
    if(!accionistaVal && !empresaVal) continue;
    if(empresaVal) empresaActual = empresaVal;
    if(!empresaActual) continue;
    const claveEmpresa = normalizarNombreEmpresa(empresaActual);
    if(!empresas[claveEmpresa]) empresas[claveEmpresa] = { nombreOriginal: empresaActual, filas: [], suman: {} };
    if(accionistaVal.toUpperCase()==="SUMAN:"){
      anios.forEach(a => { empresas[claveEmpresa].suman[a] = Number(fila[cols.anios[a]])||0; });
      empresaActual = null;
      continue;
    }
    const filaDatos = { identificacion: cols.colIdentificacion>-1 ? String(fila[cols.colIdentificacion]||"") : "", accionista: accionistaVal, valores: {} };
    anios.forEach(a => { filaDatos.valores[a] = Number(fila[cols.anios[a]])||0; });
    if(cols.colTotal>-1) filaDatos.total = Number(fila[cols.colTotal])||0;
    if(cols.colImpuestoRenta>-1) filaDatos.impuestoRenta = Number(fila[cols.colImpuestoRenta])||0;
    if(cols.colDividendoPagar>-1) filaDatos.dividendoPagar = Number(fila[cols.colDividendoPagar])||0;
    empresas[claveEmpresa].filas.push(filaDatos);
  }
  return { anios, empresas };
}

function parsearHojaEmpresa(filas){
  const header1Idx = detectarFilaHeader(filas, 0);
  if(header1Idx===-1) return null;
  const cols = mapearColumnasHeader(filas[header1Idx]);
  const anios = Object.keys(cols.anios).map(Number).sort((a,b)=>a-b);
  const capital = { filas: [], suman: {} };
  let i = header1Idx+1;
  for(; i<filas.length; i++){
    const fila = filas[i]||[];
    const accionistaVal = String(fila[cols.colAccionista]||"").trim();
    if(accionistaVal.toUpperCase()==="SUMAN:"){
      anios.forEach(a=>{ capital.suman[a] = Number(fila[cols.anios[a]])||0; });
      i++;
      break;
    }
    if(!accionistaVal) continue;
    const filaDatos = { identificacion: String(fila[cols.colIdentificacion]||""), accionista: accionistaVal, valores:{} };
    anios.forEach(a=>{ filaDatos.valores[a] = Number(fila[cols.anios[a]])||0; });
    capital.filas.push(filaDatos);
  }
  const utilidad = { filas: [], suman: {}, totalDeclarado: {} };
  for(; i<filas.length; i++){
    const fila = filas[i]||[];
    const col0 = String(fila[0]||"").trim();
    const accionistaVal = String(fila[cols.colAccionista]||"").trim();
    if(col0.toUpperCase().startsWith("UTILIDAD NO DISTRIBUIDA")){
      anios.forEach(a=>{ utilidad.totalDeclarado[a] = Number(fila[cols.anios[a]])||0; });
      continue;
    }
    if(accionistaVal.toUpperCase()==="SUMAN:"){
      anios.forEach(a=>{ utilidad.suman[a] = Number(fila[cols.anios[a]])||0; });
      continue;
    }
    if(!accionistaVal) continue;
    const filaDatos = { identificacion: String(fila[cols.colIdentificacion]||""), accionista: accionistaVal, valores:{} };
    anios.forEach(a=>{ filaDatos.valores[a] = Number(fila[cols.anios[a]])||0; });
    utilidad.filas.push(filaDatos);
  }
  return { anios, capital, utilidad };
}

async function parsearLibroDividendos(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:"array"});
  const hojaCapital = wb.Sheets["Resumen Capital"];
  const hojaDividendos = wb.Sheets["Resumen Dividendos"];
  if(!hojaCapital || !hojaDividendos) throw new Error('El libro debe tener las hojas "Resumen Capital" y "Resumen Dividendos".');
  const filasCapital = XLSX.utils.sheet_to_json(hojaCapital, {header:1, defval:null, raw:true});
  const filasDividendos = XLSX.utils.sheet_to_json(hojaDividendos, {header:1, defval:null, raw:true});
  const resumenCapital = parsearHojaResumen(filasCapital);
  const resumenDividendos = parsearHojaResumen(filasDividendos);
  const nombresHojasEmpresas = wb.SheetNames.filter(n => n!=="Resumen Capital" && n!=="Resumen Dividendos");
  const porEmpresa = {};
  nombresHojasEmpresas.forEach(nombreHoja => {
    const filas = XLSX.utils.sheet_to_json(wb.Sheets[nombreHoja], {header:1, defval:null, raw:true});
    const parsed = parsearHojaEmpresa(filas);
    if(parsed) porEmpresa[normalizarNombreEmpresa(nombreHoja)] = { nombreHoja, ...parsed };
  });
  return { resumenCapital, resumenDividendos, porEmpresa, fechaImportacion: Date.now(), nombreArchivo: file.name };
}

/* --- Fusiona un nuevo archivo importado con los datos ya existentes.
   Si una empresa ya existía, el archivo más reciente la reemplaza por completo
   (no se mezclan campo por campo); los años se acumulan (unión). --- */
function fusionarDatosDividendos(base, nuevo){
  if(!base){
    return { resumenCapital: nuevo.resumenCapital, resumenDividendos: nuevo.resumenDividendos, porEmpresa: nuevo.porEmpresa,
      fechaImportacion: nuevo.fechaImportacion, nombreArchivo: nuevo.nombreArchivo };
  }
  const resultado = JSON.parse(JSON.stringify(base));
  if(!resultado.resumenCapital) resultado.resumenCapital = {anios:[], empresas:{}};
  if(!resultado.resumenDividendos) resultado.resumenDividendos = {anios:[], empresas:{}};
  if(!resultado.porEmpresa) resultado.porEmpresa = {};

  resultado.resumenCapital.anios = Array.from(new Set([...(resultado.resumenCapital.anios||[]), ...(nuevo.resumenCapital?.anios||[])])).sort((a,b)=>a-b);
  Object.keys(nuevo.resumenCapital?.empresas||{}).forEach(clave => { resultado.resumenCapital.empresas[clave] = nuevo.resumenCapital.empresas[clave]; });

  resultado.resumenDividendos.anios = Array.from(new Set([...(resultado.resumenDividendos.anios||[]), ...(nuevo.resumenDividendos?.anios||[])])).sort((a,b)=>a-b);
  Object.keys(nuevo.resumenDividendos?.empresas||{}).forEach(clave => { resultado.resumenDividendos.empresas[clave] = nuevo.resumenDividendos.empresas[clave]; });

  Object.keys(nuevo.porEmpresa||{}).forEach(clave => { resultado.porEmpresa[clave] = nuevo.porEmpresa[clave]; });

  resultado.nombreArchivo = nuevo.nombreArchivo;
  resultado.fechaImportacion = nuevo.fechaImportacion;
  return resultado;
}

/* --- Creación manual de una empresa con sus accionistas, cuando no hay plantilla Excel --- */
function crearEmpresaManualDividendos(nombre, accionistas){
  const clave = normalizarNombreEmpresa(nombre);
  const anioActual = new Date().getFullYear();
  if(!datosDividendosCache){
    datosDividendosCache = { resumenCapital:{anios:[],empresas:{}}, resumenDividendos:{anios:[],empresas:{}}, porEmpresa:{} };
  }
  if(!datosDividendosCache.resumenCapital.anios.includes(anioActual)){
    datosDividendosCache.resumenCapital.anios.push(anioActual);
    datosDividendosCache.resumenCapital.anios.sort((a,b)=>a-b);
  }
  const filasCapital = accionistas.map(a => ({ identificacion:"", accionista:a.nombre, valores:{ [anioActual]: a.porcentaje } }));
  datosDividendosCache.resumenCapital.empresas[clave] = { nombreOriginal: nombre, filas: filasCapital, suman: { [anioActual]: 100 } };
  datosDividendosCache.resumenDividendos.empresas[clave] = {
    nombreOriginal: nombre,
    filas: accionistas.map(a => ({ accionista:a.nombre, valores:{}, total:0, impuestoRenta:0, dividendoPagar:0 })),
    suman: {}
  };
  datosDividendosCache.porEmpresa[clave] = {
    nombreHoja: nombre, anios: [anioActual], origenManual: true,
    capital: { filas: JSON.parse(JSON.stringify(filasCapital)), suman: { [anioActual]: 100 } },
    utilidad: { filas: [], suman: {}, totalDeclarado: {} }
  };
  return clave;
}

/* --- Auditoría: cruces de consistencia --- */
function ejecutarAuditoriaDividendos(datos){
  const hallazgos = [];
  const TOL = 0.05;
  const empresasResumenCap = Object.keys(datos.resumenCapital?.empresas||{});
  const empresasResumenDiv = Object.keys(datos.resumenDividendos?.empresas||{});
  const todasEmpresas = Array.from(new Set([...empresasResumenCap, ...empresasResumenDiv, ...Object.keys(datos.porEmpresa||{})]));

  todasEmpresas.forEach(clave => {
    const nombreOriginal = (datos.resumenCapital?.empresas?.[clave]?.nombreOriginal) || (datos.resumenDividendos?.empresas?.[clave]?.nombreOriginal) || clave;
    const hojaEmpresa = datos.porEmpresa?.[clave];

    // 1. Capital: Resumen Capital SUMAN vs hoja de empresa (capital SUMAN)
    if(datos.resumenCapital?.empresas?.[clave] && hojaEmpresa){
      datos.resumenCapital.anios.forEach(a => {
        const v1 = datos.resumenCapital.empresas[clave].suman[a]||0;
        const v2 = hojaEmpresa.capital?.suman?.[a]||0;
        if(Math.abs(v1-v2) > TOL){
          hallazgos.push({ empresa: nombreOriginal, anio:a, tipo:"Capital: Resumen vs hoja empresa", valorA:v1, valorB:v2, diferencia: v1-v2 });
        }
      });
    }
    // 2. Dividendos: Resumen Dividendos SUMAN vs hoja de empresa (utilidad SUMAN y totalDeclarado)
    if(datos.resumenDividendos?.empresas?.[clave] && hojaEmpresa){
      datos.resumenDividendos.anios.forEach(a => {
        const vResumen = datos.resumenDividendos.empresas[clave].suman[a]||0;
        const vHojaSuman = hojaEmpresa.utilidad?.suman?.[a]||0;
        const vHojaDeclarado = hojaEmpresa.utilidad?.totalDeclarado?.[a];
        if(Math.abs(vResumen-vHojaSuman) > TOL){
          hallazgos.push({ empresa: nombreOriginal, anio:a, tipo:"Dividendos: Resumen vs SUMAN hoja empresa", valorA:vResumen, valorB:vHojaSuman, diferencia:vResumen-vHojaSuman });
        }
        if(vHojaDeclarado!==undefined && Math.abs(vHojaDeclarado-vHojaSuman) > TOL){
          hallazgos.push({ empresa: nombreOriginal, anio:a, tipo:"Dividendos: total declarado vs SUMAN accionistas (hoja empresa)", valorA:vHojaDeclarado, valorB:vHojaSuman, diferencia:vHojaDeclarado-vHojaSuman });
        }
      });
    }
    // 3. Por accionista en Resumen Dividendos: TOTAL = suma de años; DIVIDENDO A PAGAR = TOTAL - IMPUESTO RENTA
    if(datos.resumenDividendos?.empresas?.[clave]){
      datos.resumenDividendos.empresas[clave].filas.forEach(f => {
        const sumaAnios = Object.values(f.valores).reduce((s,v)=>s+(v||0),0);
        if(f.total!==undefined && Math.abs(f.total-sumaAnios) > TOL){
          hallazgos.push({ empresa: nombreOriginal, anio:"-", tipo:`TOTAL no coincide con suma de años (${f.accionista})`, valorA:f.total, valorB:sumaAnios, diferencia:f.total-sumaAnios });
        }
        if(f.total!==undefined && f.impuestoRenta!==undefined && f.dividendoPagar!==undefined){
          const esperado = f.total - f.impuestoRenta;
          if(Math.abs(esperado-f.dividendoPagar) > TOL){
            hallazgos.push({ empresa: nombreOriginal, anio:"-", tipo:`DIVIDENDO A PAGAR no coincide con TOTAL - IMPUESTO RENTA (${f.accionista})`, valorA:esperado, valorB:f.dividendoPagar, diferencia:esperado-f.dividendoPagar });
          }
        }
      });
    }
  });
  return hallazgos;
}

async function crearEmpresaManualForm(){
  const nombre = document.getElementById("manualNombreEmpresa").value.trim();
  const accionistas = (window._accionistasManualTemp||[]).filter(a=>a.nombre.trim());
  if(!nombre){ alert("Ingresa el nombre de la empresa."); return; }
  if(!accionistas.length){ alert("Agrega al menos un accionista."); return; }
  const sumaPorcentajes = accionistas.reduce((s,a)=>s+(a.porcentaje||0),0);
  if(Math.abs(sumaPorcentajes-100) > 0.5){
    if(!confirm(`Los porcentajes suman ${sumaPorcentajes.toFixed(2)}% (no 100%). ¿Continuar de todas formas?`)) return;

  const estadoEl = document.getElementById("estadoEmpresaManual");
  crearEmpresaManualDividendos(nombre, accionistas);
  await guardarDatosDividendos(datosDividendosCache);
  await registrarCambio("Dividendos", "crear", `Empresa creada manualmente: ${nombre}`);
  window._accionistasManualTemp = [{nombre:"", porcentaje:0}];
  estadoEl.textContent = "Empresa creada correctamente.";
  pintarImportarDividendos();
}

async function ejecutarImportarDividendos(){
  const input = document.getElementById("archivoDividendos");
  const file = input.files[0];
  if(!file){ alert("Selecciona el archivo Excel primero."); return; }
  const estadoEl = document.getElementById("estadoImportarDividendos");
  estadoEl.innerHTML = `<span class="spinner"></span> Procesando y validando archivo...`;
  try{
    const datosArchivo = await parsearLibroDividendos(file);
    // Auditoría individual de este archivo antes de fusionar, para avisar si ya trae inconsistencias
    const hallazgosPropios = ejecutarAuditoriaDividendos(datosArchivo);
    datosDividendosCache = fusionarDatosDividendos(datosDividendosCache, datosArchivo);
    await guardarDatosDividendos(datosDividendosCache);
    await guardarArchivoDividendos(datosArchivo);
    await registrarCambio("Dividendos", "importar", `Archivo importado: ${file.name} (${Object.keys(datosArchivo.porEmpresa).length} empresa(s))`);
    estadoEl.textContent = hallazgosPropios.length
      ? `Archivo importado. ⚠️ Se encontraron ${hallazgosPropios.length} inconsistencia(s) en este archivo — revísalas en la pestaña Auditoría.`
      : "Archivo importado y validado sin inconsistencias.";
    input.value = "";
    pintarImportarDividendos();
  }catch(e){
    estadoEl.textContent = "";
    alert("No se pudo procesar el archivo: " + (e.message||String(e)));
  }
}

// Recalcula el Historial de Dividendos por accionista tomando, para cada año,
// la "Utilidad a Distribuir" del Comparativo SRI/Súper Cías/Contable y
// repartiéndola entre los accionistas según su % real de participación ese
// año (capital de cada accionista ese año / capital total de la empresa ese
// año, del Historial de capital social). Así el historial de dividendos
// queda consistente con esas dos fuentes en vez de depender solo del Excel
// original importado.
async function recalcularHistorialDividendosDesdeComparativo(){
  const clave = empresaDividendoSeleccionada;
  const datosCapital = datosDividendosCache.resumenCapital.empresas[clave];
  const datosResumen = datosDividendosCache.resumenDividendos.empresas[clave];
  if(!datosCapital || !datosResumen){ alert("Faltan datos de capital o de dividendos para esta empresa."); return; }
  if(!confirm(`Esto reemplaza, año por año, el valor de cada accionista en el Historial de Dividendos.

Para cada año se usa el AUMENTO real de la Utilidad Acumulada de ese año respecto al anterior (no solo el campo "Utilidad a Distribuir") — así, si algún año no tiene "Utilidad a Distribuir" registrada pero el acumulado sí subió (por ejemplo, por un ajuste manual del acumulado), esa diferencia igual se reparte y el total siempre cuadra con la Utilidad Acumulada final.

Si un año no tiene su propio dato de capital social, se usa el capital del año siguiente más cercano que sí tenga datos.

Los montos de IMP. RENTA y A PAGAR no se tocan. ¿Continuar?`)) return;

  const filasComparativo = calcularFilasComparativo(clave); // ya viene ordenado por año, con acumuladoMostrado encadenado
  const aniosCapitalLocal = datosDividendosCache.resumenCapital.anios;
  // Unión de todos los años relevantes: los del Comparativo (que ya cubren
  // 1992-año actual) y los que ya existan en el Historial de capital.
  const todosLosAnios = Array.from(new Set([...aniosCapitalLocal, ...filasComparativo.map(f=>f.anio)])).sort((a,b)=>a-b);

  // Busca el año más cercano (primero hacia adelante, luego hacia atrás si no
  // hay ninguno) que sí tenga datos de capital social, para usar su % cuando
  // el año en cuestión no tenga capital propio registrado.
  function anioConCapitalMasCercano(anio){
    if((datosCapital.suman[anio]||0) > 0) return anio;
    const haciaAdelante = aniosCapitalLocal.filter(a=>a>=anio && (datosCapital.suman[a]||0)>0).sort((a,b)=>a-b);
    if(haciaAdelante.length) return haciaAdelante[0];
    const haciaAtras = aniosCapitalLocal.filter(a=>a<=anio && (datosCapital.suman[a]||0)>0).sort((a,b)=>b-a);
    return haciaAtras.length ? haciaAtras[0] : null;
  }

  // Unión de accionistas (capital + dividendos ya existentes), para no perder a nadie
  const nombresUnion = Array.from(new Set([
    ...datosCapital.filas.map(f=>f.accionista),
    ...datosResumen.filas.map(f=>f.accionista)
  ]));
  // Reconstruye (o crea) la fila de dividendos de cada accionista, conservando
  // impuestoRenta/dividendoPagar si ya existían.
  const filasNuevas = nombresUnion.map(nombre => {
    const existente = datosResumen.filas.find(f=>f.accionista===nombre);
    return {
      accionista: nombre,
      valores: {},
      total: 0,
      impuestoRenta: existente?.impuestoRenta || 0,
      dividendoPagar: existente?.dividendoPagar || 0,
    };
  });

  const sumanNuevo = {};
  let acumuladoAnterior = 0; // arranca en 0 (año 1991, igual que en el Comparativo)
  for(const anio of todosLosAnios){
    const filaComp = filasComparativo.find(f=>f.anio===anio);
    const acumuladoEsteAnio = filaComp ? (filaComp.acumuladoMostrado||0) : acumuladoAnterior;
    // Monto EFECTIVO a repartir este año = cuánto subió el acumulado respecto
    // al año anterior — esto captura tanto la "Utilidad a Distribuir" normal
    // de ese año, como cualquier salto que venga de un ajuste manual del
    // acumulado sin una "Utilidad a Distribuir" explícita ese mismo año.
    const montoEfectivo = acumuladoEsteAnio - acumuladoAnterior;
    acumuladoAnterior = acumuladoEsteAnio;

    if(Math.abs(montoEfectivo) < 0.005){ sumanNuevo[anio] = 0; continue; }

    const anioCapitalAUsar = anioConCapitalMasCercano(anio);
    const totalCapitalAnio = anioCapitalAUsar!==null ? (datosCapital.suman[anioCapitalAUsar]||0) : 0;
    let sumaAnio = 0;
    filasNuevas.forEach(fn => {
      const filaCap = anioCapitalAUsar!==null ? datosCapital.filas.find(f=>f.accionista===fn.accionista) : null;
      const capitalAccionista = filaCap ? (filaCap.valores[anioCapitalAUsar]||0) : 0;
      const porcentaje = totalCapitalAnio ? (capitalAccionista/totalCapitalAnio) : 0;
      const valorAsignado = montoEfectivo * porcentaje;
      fn.valores[anio] = valorAsignado;
      sumaAnio += valorAsignado;
    });
    sumanNuevo[anio] = sumaAnio;
  }
  filasNuevas.forEach(fn => {
    fn.total = Object.values(fn.valores).reduce((s,v)=>s+(v||0), 0);
  });

  datosResumen.filas = filasNuevas;
  datosResumen.suman = sumanNuevo;
  datosDividendosCache.resumenDividendos.anios = todosLosAnios;

  await guardarDatosDividendos(datosDividendosCache);
  await registrarCambio("Dividendos", "editar", `Historial de dividendos recalculado desde Comparativo SRI + % de capital (con ajuste de saltos de acumulado): ${datosDividendosCache.porEmpresa[clave]?.nombreHoja||clave}`);
  pintarDetalleEmpresaDividendo();
}

        </tr>
      </tbody></table>
      <p class="helpNote" style="margin-top:8px;">${cuadraTodo ? 'Todo cuadra: el acumulado corrido del Historial de Dividendos coincide con la Utilidad Acumulada del Comparativo SRI... en todos los años.' : 'Hay diferencia acumulada a partir del/los año(s) resaltado(s) en rojo. Presiona "🔄 Recalcular desde Comparativo SRI + % de Capital" para que vuelvan a cuadrar.'}</p>
    </div>

// Concilia, año por año, la Utilidad Acumulada CORRIDA del Comparativo SRI...
// contra la Utilidad Acumulada corrida del Historial de Dividendos (suma
// corrida de SUMAN) — la MISMA lógica que ya usa la fila "TOTAL ACUMULADO
// EMPRESA" en pantalla. Se compara por acumulados (no por el campo "Utilidad
// a Distribuir" en crudo de cada año) porque el recálculo reparte según el
// AUMENTO real del acumulado de cada año, que puede venir de una "Utilidad a
// Distribuir" explícita o de un ajuste manual del acumulado — comparar los
// acumulados corridos es lo único que siempre refleja correctamente si ya
// cuadra o no, en cualquiera de los dos casos.
function calcularConciliacionComparativoVsDividendos(clave){
  const datosResumen = datosDividendosCache.resumenDividendos.empresas[clave];
  const filasComparativo = calcularFilasComparativo(clave);
  const aniosDividendos = datosDividendosCache.resumenDividendos.anios || [];
  const aniosUnion = Array.from(new Set([...filasComparativo.map(f=>f.anio), ...aniosDividendos])).sort((a,b)=>a-b);

  let acumuladoDividendosCorrido = 0;
  const filas = aniosUnion.map(anio => {
    const filaComp = filasComparativo.find(f=>f.anio===anio);
    const utilidadDistribuirComparativo = filaComp ? (filaComp.utilidadMostrada||0) : 0;
    const acumuladoComparativo = filaComp ? (filaComp.acumuladoMostrado||0) : null;
    const sumanDividendos = (datosResumen?.suman[anio])||0;
    acumuladoDividendosCorrido += sumanDividendos;
    const diferencia = acumuladoComparativo!==null ? (acumuladoDividendosCorrido - acumuladoComparativo) : 0;
    const cuadra = acumuladoComparativo===null ? true : Math.abs(diferencia) < 0.5;
    return { anio, utilidadDistribuirComparativo, sumanDividendos, acumuladoComparativo, acumuladoDividendosCorrido, diferencia, cuadra };
  }).filter(f => Math.abs(f.utilidadDistribuirComparativo) > 0.001 || Math.abs(f.sumanDividendos) > 0.001 || (f.acumuladoComparativo!==null && Math.abs(f.acumuladoComparativo) > 0.001));

  const ultima = filas[filas.length-1];
  const totalDiferencia = ultima ? ultima.diferencia : 0;
  const totalComparativo = ultima ? (ultima.acumuladoComparativo||0) : 0;
  const totalDividendos = ultima ? ultima.acumuladoDividendosCorrido : 0;
  return { filas, totalDiferencia, totalComparativo, totalDividendos };
}

    <div class="field" style="margin-bottom:6px;">

      <input type="number" id="nuevoCapitalMonto_${idx}" placeholder="Capital para el nuevo año">
    </div>`).join("");

async function guardarNuevoAnioCapital(){
  const anio = parseInt(document.getElementById("nuevoAnioCapital").value, 10);
  if(!anio){ alert("Ingresa el año a agregar."); return; }
  const datosCapital = datosDividendosCache.resumenCapital.empresas[empresaDividendoSeleccionada];
  if(!datosCapital){ alert("Genera primero las filas de accionistas."); return; }
  let sumaAnio = 0;
  datosCapital.filas.forEach((f, idx) => {
    const input = document.getElementById("nuevoCapitalMonto_"+idx);
    if(!input) return;
    const monto = parseFloat(input.value)||0;
    f.valores[anio] = monto;
    sumaAnio += monto;
  });
  datosCapital.suman[anio] = sumaAnio;
  if(!datosDividendosCache.resumenCapital.anios.includes(anio)){
    datosDividendosCache.resumenCapital.anios.push(anio);
    datosDividendosCache.resumenCapital.anios.sort((a,b)=>a-b);
  }
  // Reflejar también en la hoja individual de la empresa, si existe
  const hojaEmpresa = datosDividendosCache.porEmpresa[empresaDividendoSeleccionada];
  if(hojaEmpresa){
    if(!hojaEmpresa.anios.includes(anio)){ hojaEmpresa.anios.push(anio); hojaEmpresa.anios.sort((a,b)=>a-b); }
    hojaEmpresa.capital.filas.forEach(f => {
      const filaResumen = datosCapital.filas.find(x=>x.accionista===f.accionista);
      if(filaResumen) f.valores[anio] = filaResumen.valores[anio];
    });
    hojaEmpresa.capital.suman[anio] = sumaAnio;
  }
  await guardarDatosDividendos(datosDividendosCache);
  await registrarCambio("Dividendos", "editar", `Año ${anio} de capital agregado manualmente a ${datosDividendosCache.porEmpresa[empresaDividendoSeleccionada]?.nombreHoja||empresaDividendoSeleccionada}`);
  pintarDetalleEmpresaDividendo();
}

async function guardarNuevoAnioDividendo(){
  const anio = parseInt(document.getElementById("nuevoAnioDiv").value, 10);
  if(!anio){ alert("Ingresa el año a agregar."); return; }
  const datosResumen = datosDividendosCache.resumenDividendos.empresas[empresaDividendoSeleccionada];
  datosResumen.filas.forEach((f, idx) => {
    const inputMonto = document.getElementById("nuevoMonto_"+idx);
    if(!inputMonto) return;
    const monto = parseFloat(inputMonto.value)||0;
    const impuestoInput = document.getElementById("nuevoImpuesto_"+idx);
    const impuesto = impuestoInput && impuestoInput.value ? parseFloat(impuestoInput.value) : Math.round(monto*0.12*100)/100;
    f.valores[anio] = monto;
    f.total = (f.total||0) + monto;
    f.impuestoRenta = (f.impuestoRenta||0) + impuesto;
    f.dividendoPagar = (f.dividendoPagar||0) + (monto - impuesto);
  });
  if(!datosDividendosCache.resumenDividendos.anios.includes(anio)){
    datosDividendosCache.resumenDividendos.anios.push(anio);
    datosDividendosCache.resumenDividendos.anios.sort((a,b)=>a-b);
  }
  datosResumen.suman[anio] = datosResumen.filas.reduce((s,f)=>s+(f.valores[anio]||0),0);
  await guardarDatosDividendos(datosDividendosCache);
  await registrarCambio("Dividendos", "editar", `Año ${anio} agregado manualmente a ${datosDividendosCache.porEmpresa[empresaDividendoSeleccionada]?.nombreHoja||empresaDividendoSeleccionada}`);
  pintarDetalleEmpresaDividendo();
}

async function ejecutarRecomendacionDividendos(){
  const anio = document.getElementById("recAnio").value.trim();
  const utilidad = parseFloat(document.getElementById("recUtilidad").value)||0;
  const antesJulio = document.getElementById("recAntesJulio").value;
  const instrucciones = document.getElementById("recInstrucciones").value.trim();
  if(!utilidad){ alert("Ingresa el monto a distribuir."); return; }
  if(!empresaDistribActualSeleccionada){ alert("Selecciona una empresa primero."); return; }
  const datosCapital = datosDividendosCache.resumenCapital.empresas[empresaDistribActualSeleccionada];
  const nombreEmpresa = datosDividendosCache.porEmpresa[empresaDistribActualSeleccionada]?.nombreHoja || empresaDistribActualSeleccionada;
  const ultimoAnioCapital = Math.max(...datosDividendosCache.resumenCapital.anios);
  const totalCapitalEmpresa = (datosCapital?.suman[ultimoAnioCapital])||1;
  const accionistas = (datosCapital?.filas||[]).map(f => {
    const capitalActual = f.valores[ultimoAnioCapital]||0;
    const porcentaje = totalCapitalEmpresa ? (capitalActual/totalCapitalEmpresa*100) : 0;
    return `${f.accionista}: ${porcentaje.toFixed(2)}% de participación`;
  }).join("\n");
  const contenido = `Empresa: ${nombreEmpresa}\nAño de distribución: ${anio}\nUtilidad total de la empresa a distribuir entre todos los accionistas: USD $${utilidad.toFixed(2)}\n¿Se distribuye antes del 31 de julio de ese año?: ${antesJulio}\nAccionista(s) y participación (según capital al año ${ultimoAnioCapital}):\n${accionistas}`;
  const estadoEl = document.getElementById("estadoRecomendacionDiv");
  document.getElementById("resultadoRecomendacionDiv").innerHTML = "";
  estadoEl.innerHTML = `<span class="spinner"></span> Analizando con IA...`;
  try{
    const resultado = await llamarIA("recomendar_distribucion_dividendos", contenido, instrucciones);
    estadoEl.textContent = "Recomendación generada.";
    document.getElementById("resultadoRecomendacionDiv").innerHTML = renderRecomendacionDividendos(resultado);
    await registrarCambio("Dividendos", "generar_ia", `Recomendación de distribución generada para ${nombreEmpresa} (${anio})`);
  }catch(e){
    estadoEl.textContent = "";
    alert("No se pudo generar la recomendación: " + e.message);
  }
}

function pintarListaPagosACuenta(){
  const cont = document.getElementById("listaPagosACuenta");
  if(!cont) return;
  const clave = empresaDistribActualSeleccionada;
  const pagos = (datosDividendosCache.pagosACuenta||{})[clave] || [];
  if(!pagos.length){ cont.innerHTML = `<p style="color:var(--muted);font-size:13px;">Sin pagos a cuenta registrados.</p>`; pintarBloqueExcesoPagoACuenta(); pintarSaldoCreditoTributario(); return; }
  const hoyAnio = new Date().getFullYear();
  cont.innerHTML = `<table><thead><tr><th>Origen</th><th>Año del pago</th><th>Monto</th><th>Compensado/usado</th><th>Saldo disponible</th><th>Plazo (hasta cierre de)</th><th>Estado</th><th>Observación</th><th>Forma de pago</th><th></th></tr></thead><tbody>
    ${pagos.map((p, idx) => {
      const anioLimite = p.anio + 2;
      const vencido = hoyAnio > anioLimite;
      const porVencer = !vencido && (anioLimite - hoyAnio) <= 1;
      const esAuto = !!p.autoDesdeAnticipos;
      const montoBase = montoEfectivoPagoACuenta(p);
      const compensado = p.montoCompensado||0;
      const saldoDisponible = Math.max(0, montoBase - compensado);
      return `<tr>
        <td>${esAuto ? '<span class="pill ok">🔗 Auto (anticipos)</span>' : '<span class="pill muted">Manual (Art. 39.2.1)</span>'}</td>
        <td><input type="number" style="width:80px;" value="${p.anio}" ${esAuto?'disabled title="Se edita desde Anticipos de dividendos en Escenarios"':''} onchange="editarPagoACuenta(${idx},'anio',this.value)"></td>
        <td><input type="number" style="width:100px;" value="${p.monto}" ${esAuto?'disabled title="Se edita desde Anticipos de dividendos en Escenarios"':''} onchange="editarPagoACuenta(${idx},'monto',this.value)"></td>
        <td>${esAuto ? `$${compensado.toFixed(2)}<div style="font-size:10px;color:var(--muted);">Auto (FIFO por retenciones)</div>` : `<input type="number" style="width:100px;" value="${compensado}" onchange="editarPagoACuenta(${idx},'montoCompensado',this.value)">`}</td>
        <td>$${saldoDisponible.toFixed(2)}</td>
        <td>Ejercicio ${anioLimite}</td>
        <td>${vencido?'<span class="pill danger">Crédito perdido</span>':(porVencer?'<span class="pill warn">Por vencer</span>':'<span class="pill ok">Vigente</span>')}</td>
        <td><input type="text" style="width:160px;" value="${escapeHtml(p.observacion||'')}" ${esAuto?'disabled':''} onchange="editarPagoACuenta(${idx},'observacion',this.value)"></td>
        <td>${esAuto ? badgeFormaPagoResumenRetenciones(p) : badgeFormaPagoACuenta(p)}</td>
        <td>
          ${esAuto ? '<span style="font-size:11px;color:var(--muted);">Gestiónala en la retención (Escenarios)</span>' : `<button class="btn small" onclick="toggleFormaPagoACuenta(${idx})">💳 Pago</button><button class="btn small danger" onclick="eliminarPagoACuenta(${idx})">Eliminar</button>`}
        </td>
      </tr>
      <tr id="filaFormaPagoACuenta_${idx}" class="hidden"><td colspan="10"></td></tr>`;
    }).join("")}
  </tbody></table>`;
  pintarBloqueExcesoPagoACuenta();
  pintarSaldoCreditoTributario();
}

// Muestra el saldo de crédito tributario del pago a cuenta, por año y
// acumulado — incluye TODOS los pagos a cuenta registrados (tanto los
// manuales del Art. 39.2.1 como los auto-generados desde anticipos, ya
// que estos últimos también quedan acreditados como pago a cuenta real una
// vez efectuados). El monto usado por fila es el monto real (según la forma
// de pago registrada, si ya existe una).
function pintarSaldoCreditoTributario(){
  const cont = document.getElementById("saldoCreditoTributario");
  if(!cont) return;
  const clave = empresaDistribActualSeleccionada;
  const pagos = (datosDividendosCache.pagosACuenta||{})[clave] || [];
  if(!pagos.length){ cont.innerHTML = `<p style="color:var(--muted);font-size:13px;">Sin pagos a cuenta registrados todavía.</p>`; return; }
  const hoyAnio = new Date().getFullYear();
  let totalDisponible = 0;
  const filas = pagos.slice().sort((a,b)=>a.anio-b.anio).map(p => {
    const anioLimite = p.anio + 2;
    const vencido = hoyAnio > anioLimite;
    const porVencer = !vencido && (anioLimite - hoyAnio) <= 1;
    const montoBase = montoEfectivoPagoACuenta(p);
    const compensado = p.montoCompensado||0;
    const saldo = Math.max(0, montoBase - compensado);
    if(!vencido) totalDisponible += saldo;
    return { anio:p.anio, monto:montoBase, compensado, saldo, anioLimite, vencido, porVencer, esAuto:!!p.autoDesdeAnticipos };
  });
  cont.innerHTML = `<table style="font-size:12px;"><thead><tr><th>Origen</th><th>Año del pago</th><th>Monto pagado</th><th>Compensado</th><th>Saldo disponible</th><th>Vence en</th><th>Estado</th></tr></thead><tbody>
    ${filas.map(f => `<tr style="${f.vencido?'opacity:.55;':''}">
      <td>${f.esAuto?'<span class="pill ok">🔗 Auto</span>':'<span class="pill muted">Manual</span>'}</td>
      <td>${f.anio}</td>
      <td>$${f.monto.toFixed(2)}</td>
      <td>$${f.compensado.toFixed(2)}</td>
      <td style="font-weight:600;">$${f.saldo.toFixed(2)}</td>
      <td>Ejercicio ${f.anioLimite}</td>
      <td>${f.vencido?'<span class="pill danger">Crédito perdido</span>':(f.porVencer?'<span class="pill warn">Por vencer</span>':'<span class="pill ok">Vigente</span>')}</td>
    </tr>`).join("")}
    <tr style="font-weight:bold;background:var(--panel2);border-top:2px solid var(--accent);">
      <td colspan="4">SALDO DE CRÉDITO TRIBUTARIO DISPONIBLE (acumulado, no vencido)</td>
      <td style="color:var(--accent2);font-size:14px;">$${totalDisponible.toFixed(2)}</td>
      <td colspan="2"></td>
    </tr>
  </tbody></table>`;
}

// Monto REAL de un pago a cuenta: si ya se registró una forma de pago
// (banco o cuentas por pagar), ese es el valor confiable — puede diferir del
// campo "Monto" original (por ejemplo, si la retención vinculada se pagó
// mediante cuentas por pagar por el valor neto a los accionistas). Si no
// hay forma de pago registrada todavía, se usa el "Monto" tal cual.
function montoEfectivoPagoACuenta(p){
  if(p.metodoPago==="banco"){
    return (p.pagosBanco||[]).reduce((s,x)=>s+(x.monto||0),0);
  }
  if(p.metodoPago==="cuentasPorPagar"){
    return p.cuentasPorPagarAcumulado||0;
  }
  return p.monto||0;
}

function badgeFormaPagoACuenta(p){
  if(p.metodoPago==="banco"){
    const totalBanco = (p.pagosBanco||[]).reduce((s,x)=>s+(x.monto||0),0);
    return `<span class="pill ${Math.abs(totalBanco-p.monto)<0.5?'ok':'warn'}">Banco: $${totalBanco.toFixed(2)}</span>`;
  }
  if(p.metodoPago==="cuentasPorPagar"){
    return `<span class="pill warn">Cuentas x pagar: $${(p.cuentasPorPagarAcumulado||0).toFixed(2)}</span>`;
  }
  return `<span class="pill muted">Sin registrar</span>`;
}

// Para filas automáticas (por año, desde Anticipos+Retenciones): muestra el
// resumen de la forma de pago ya registrada en las retenciones de ese año,
// en vez de pedirla de nuevo aquí — se gestiona en la retención misma
// (Escenarios → 💳 Pago), para no duplicar el dato en dos lugares.
function badgeFormaPagoResumenRetenciones(p){
  const r = p.formaPagoRetencionesResumen || { banco:0, cuentasPorPagar:0 };
  if(!r.banco && !r.cuentasPorPagar) return `<span class="pill muted">Sin registrar (ver retención)</span>`;
  const partes = [];
  if(r.banco) partes.push(`Banco: $${r.banco.toFixed(2)}`);
  if(r.cuentasPorPagar) partes.push(`Cuentas x pagar: $${r.cuentasPorPagar.toFixed(2)}`);
  return `<span class="pill ok">${partes.join(' + ')}</span>`;
}

// Muestra (y permite documentar) el excedente de retenciones que superó el
// total de anticipos registrados en TODOS los años — ese excedente ya se
// pagó, así que NO se traslada a un año futuro como si fuera un crédito
// pendiente; en vez de eso, se pide cómo se pagó y en qué formulario.
function pintarBloqueExcesoPagoACuenta(){
  const cont = document.getElementById("bloqueExcesoPagoACuenta");
  if(!cont) return;
  const clave = empresaDistribActualSeleccionada;
  const exc = (datosDividendosCache.excesoPagoACuenta||{})[clave];
  if(!exc || exc.monto<=0.5){ cont.innerHTML = ""; return; }
  cont.innerHTML = `
    <div class="card" style="border:1px solid var(--warn);">
      <h4 style="margin-top:0;color:var(--warn);">⚠️ Diferencia a pagar — retenciones superan el anticipo del año más bajo</h4>
      <p class="helpNote">El total de retenciones formales realizadas ya se aplicó completo al año más bajo con anticipo registrado, y aun así sobran <b>$${exc.monto.toFixed(2)}</b> — esta diferencia <b>no se traslada a ningún otro año</b> (ya se retuvo/debe pagarse). Documenta cómo se pagó y, en observaciones, el N° de formulario correspondiente.</p>
      <div class="grid3">
        <div class="field" style="margin:0;"><label>Monto a pagar</label><input type="text" value="$${exc.monto.toFixed(2)}" disabled></div>
        <div class="field" style="margin:0;"><label>¿Se pagó con cheque o transferencia?</label>
          <select onchange="actualizarExcesoPagoACuenta('comoSePago',this.value)">
            <option value="">-- selecciona --</option>
            <option value="cheque" ${exc.comoSePago==='cheque'?'selected':''}>Cheque</option>
            <option value="transferencia" ${exc.comoSePago==='transferencia'?'selected':''}>Transferencia</option>
          </select>
        </div>
        <div class="field" style="margin:0;"><label>Observaciones (N° de formulario)</label><input type="text" value="${escapeHtml(exc.observacion||'')}" onchange="actualizarExcesoPagoACuenta('observacion',this.value)" placeholder="Ej. Formulario 103, N° de cheque/transferencia..."></div>
      </div>
    </div>`;
}

async function actualizarExcesoPagoACuenta(campo, valor){
  const clave = empresaDistribActualSeleccionada;
  if(!datosDividendosCache.excesoPagoACuenta || !datosDividendosCache.excesoPagoACuenta[clave]) return;

function toggleFormaPagoACuenta(idx){
  const fila = document.getElementById("filaFormaPagoACuenta_"+idx);

  if(!fila.classList.contains("hidden")){ fila.classList.add("hidden"); fila.querySelector("td").innerHTML=""; return; }

}

      <div class="field" style="margin-top:6px;"><label>Método</label>

          ${(p.pagosBanco||[]).map((x,i)=>`<tr>

        <div class="field"><label>Cuentas por pagar acumuladas hasta ahora</label>
          <div style="display:flex;gap:6px;align-items:center;">
            <b style="font-size:14px;">$${(p.cuentasPorPagarAcumulado||0).toFixed(2)}</b>
            <input type="number" id="montoNuevaCuentaPorPagarPAC_${idx}" style="width:110px;" placeholder="Monto a agregar">
            <button class="btn small" onclick="agregarCuentaPorPagarACuenta(${idx})">+ Agregar</button>
          </div>

async function actualizarMetodoPagoACuenta(idx, metodo){
  const clave = empresaDistribActualSeleccionada;
  const p = (datosDividendosCache.pagosACuenta[clave]||[])[idx];
  if(!p) return;
  p.metodoPago = metodo || null;
  if(metodo==="banco" && !p.pagosBanco) p.pagosBanco = [];
  await guardarDatosDividendos(datosDividendosCache);
  pintarListaPagosACuenta();
  const filaEl = document.getElementById("filaFormaPagoACuenta_"+idx);
  if(filaEl) filaEl.classList.remove("hidden");
  pintarFormaPagoACuentaDetalle(idx);
}

async function agregarPagoBancoACuenta(idx){
  const clave = empresaDistribActualSeleccionada;
  const p = (datosDividendosCache.pagosACuenta[clave]||[])[idx];
  if(!p) return;
  if(!p.pagosBanco) p.pagosBanco = [];
  p.pagosBanco.push({ tipo:"transferencia", monto:0, referencia:"", fecha:"" });
  await guardarDatosDividendos(datosDividendosCache);
  pintarFormaPagoACuentaDetalle(idx);
  pintarListaPagosACuenta();
}

async function actualizarPagoBancoACuenta(idx, i, campo, valor){
  const clave = empresaDistribActualSeleccionada;
  const p = (datosDividendosCache.pagosACuenta[clave]||[])[idx];
  if(!p || !p.pagosBanco[i]) return;
  p.pagosBanco[i][campo] = campo==="monto" ? (parseFloat(valor)||0) : valor;
  await guardarDatosDividendos(datosDividendosCache);
  pintarFormaPagoACuentaDetalle(idx);
  pintarListaPagosACuenta();
}

async function eliminarPagoBancoACuenta(idx, i){
  const clave = empresaDistribActualSeleccionada;

  if(!p) return;
  p.pagosBanco.splice(i,1);
  await guardarDatosDividendos(datosDividendosCache);
  pintarFormaPagoACuentaDetalle(idx);
  pintarListaPagosACuenta();
}

async function agregarCuentaPorPagarACuenta(idx){
  const clave = empresaDistribActualSeleccionada;
  const p = (datosDividendosCache.pagosACuenta[clave]||[])[idx];
  if(!p) return;
  const input = document.getElementById("montoNuevaCuentaPorPagarPAC_"+idx);
  const monto = parseFloat(input.value)||0;
  if(!monto){ alert("Ingresa un monto mayor a cero."); return; }
  p.cuentasPorPagarAcumulado = (p.cuentasPorPagarAcumulado||0) + monto;
  await guardarDatosDividendos(datosDividendosCache);
  input.value = "";
  pintarFormaPagoACuentaDetalle(idx);
  pintarListaPagosACuenta();

async function agregarPagoACuenta(){
  const clave = empresaDistribActualSeleccionada;
  const anio = parseInt(document.getElementById("pacAnio").value, 10);
  const monto = parseFloat(document.getElementById("pacMonto").value)||0;
  const observacion = document.getElementById("pacObs").value.trim();
  if(!anio || !monto){ alert("Ingresa el año y el monto del pago."); return; }
  if(!datosDividendosCache.pagosACuenta) datosDividendosCache.pagosACuenta = {};
  if(!datosDividendosCache.pagosACuenta[clave]) datosDividendosCache.pagosACuenta[clave] = [];
  datosDividendosCache.pagosACuenta[clave].push({ anio, monto, observacion, metodoPago:null, pagosBanco:[], cuentasPorPagarAcumulado:0, montoCompensado:0 });
  await guardarDatosDividendos(datosDividendosCache);
  await registrarCambio("Dividendos", "editar", `Pago a cuenta registrado: ${datosDividendosCache.porEmpresa[clave]?.nombreHoja||''} año ${anio}, $${monto.toFixed(2)}`);
  document.getElementById("pacAnio").value=""; document.getElementById("pacMonto").value=""; document.getElementById("pacObs").value="";
  pintarListaPagosACuenta();
}

/* --- Anticipos de dividendos pagados, desglosados por año. Se llenan solos
   desde las retenciones guardadas (agrupadas por año) y también admiten
   entradas manuales, para anticipos que no pasaron por la Calculadora de
   retención. Sirve de contexto para Escenarios y para llevar control
   histórico de lo ya pagado, empezando desde el primer año que corresponda. --- */
function pintarListaAnticiposDividendos(){
  const cont = document.getElementById("listaAnticiposDividendos");
  if(!cont) return;
  const clave = empresaEscenarioSeleccionada;
  const lista = ((datosDividendosCache.anticiposDividendos||{})[clave]||[]).slice().sort((a,b)=>a.anio-b.anio);
  if(!lista.length){ cont.innerHTML = `<p style="color:var(--muted);font-size:13px;">Sin anticipos registrados.</p>`; return; }
  const total = lista.reduce((s,a)=>s+(a.monto||0),0);
  cont.innerHTML = `<table style="font-size:12px;"><thead><tr><th>Año</th><th>Monto</th><th>Observación</th><th></th></tr></thead><tbody>
    ${lista.map((a,idx) => `<tr>
        <td>${a.anio}</td>
        <td><input type="number" style="width:100px;" value="${a.monto}" onchange="editarAnticipoDividendo(${idx},'monto',this.value)"></td>
        <td><input type="text" style="width:160px;" value="${escapeHtml(a.observacion||'')}" onchange="editarAnticipoDividendo(${idx},'observacion',this.value)"></td>
        <td><button class="btn small danger" onclick="eliminarAnticipoDividendo(${idx})">Eliminar</button></td>
      </tr>`).join("")}
    <tr style="font-weight:bold;background:var(--panel2);"><td>TOTAL</td><td>$${total.toFixed(2)}</td><td colspan="2"></td></tr>
  </tbody></table>`;
}

async function agregarAnticipoDividendoManual(){
  const clave = empresaEscenarioSeleccionada;
  const anio = parseInt(document.getElementById("antAnio").value, 10);
  const monto = parseFloat(document.getElementById("antMonto").value)||0;
  const observacion = document.getElementById("antObs").value.trim();
  if(!anio || !monto){ alert("Ingresa el año y el monto del anticipo."); return; }
  if(!datosDividendosCache.anticiposDividendos) datosDividendosCache.anticiposDividendos = {};
  if(!datosDividendosCache.anticiposDividendos[clave]) datosDividendosCache.anticiposDividendos[clave] = [];
  datosDividendosCache.anticiposDividendos[clave].push({ anio, monto, observacion, retencionId:null });
  await guardarDatosDividendos(datosDividendosCache);
  document.getElementById("antAnio").value=""; document.getElementById("antMonto").value=""; document.getElementById("antObs").value="";
  pintarListaAnticiposDividendos();
}

async function editarAnticipoDividendo(idx, campo, valor){
  const clave = empresaEscenarioSeleccionada;
  const lista = (datosDividendosCache.anticiposDividendos||{})[clave];
  if(!lista || !lista[idx] || lista[idx].retencionId) return;
  lista[idx][campo] = campo==="observacion" ? valor : (parseFloat(valor)||0);
  await guardarDatosDividendos(datosDividendosCache);
  pintarListaAnticiposDividendos();
}

async function eliminarAnticipoDividendo(idx){
  const clave = empresaEscenarioSeleccionada;
  const lista = (datosDividendosCache.anticiposDividendos||{})[clave];
  if(!lista || !lista[idx] || lista[idx].retencionId) return;
  if(!confirm("¿Eliminar este anticipo?")) return;
  lista.splice(idx,1);
  await guardarDatosDividendos(datosDividendosCache);
  pintarListaAnticiposDividendos();
}

// Suma los anticipos (auto + manuales) de un año específico — se usa para
// pasarle el dato a la IA en Escenarios ("Anticipos ya pagados este año").
function calcularAnticiposDelAnio(clave, anio){
  const lista = (datosDividendosCache.anticiposDividendos||{})[clave] || [];
  return lista.filter(a=>a.anio===anio).reduce((s,a)=>s+(a.monto||0),0);
}

async function editarPagoACuenta(idx, campo, valor){
  const clave = empresaDistribActualSeleccionada;
  const pagos = (datosDividendosCache.pagosACuenta||{})[clave];
  if(!pagos || !pagos[idx]) return;
  pagos[idx][campo] = (campo==="observacion") ? valor : (parseFloat(valor)||0);
  await guardarDatosDividendos(datosDividendosCache);
  pintarListaPagosACuenta();
}

async function eliminarPagoACuenta(idx){
  const clave = empresaDistribActualSeleccionada;
  const pagos = (datosDividendosCache.pagosACuenta||{})[clave];
  if(!pagos || !pagos[idx]) return;
  if(pagos[idx].autoDesdeAnticipos){ alert("Esta fila se genera sola a partir de los Anticipos de dividendos y las Retenciones guardadas en Escenarios — edítalas o elimínalas ahí, y esta fila se actualiza sola."); return; }
  if(!confirm("¿Eliminar este pago a cuenta?")) return;
  pagos.splice(idx, 1);
  await guardarDatosDividendos(datosDividendosCache);
  pintarListaPagosACuenta();
}

/* =========================================================================
   ESCENARIOS DE DISTRIBUCIÓN DE DIVIDENDOS (con IA)
   ========================================================================= */
let empresaEscenarioSeleccionada = null;

function pintarEscenariosDividendos(){

  cont.innerHTML = `
    <div class="card">
      <p class="helpNote">Genera y compara escenarios de qué hacer con la utilidad acumulada no distribuida de una empresa, considerando el impuesto a la distribución, el pago a cuenta ya realizado y su plazo de compensación (2 ejercicios fiscales posteriores al pago).</p>

        <select id="selEmpresaEscenario" onchange="cambiarEmpresaEscenario(this.value)">

      <button class="btn small" style="margin-left:8px;" onclick="imprimirInformeRetencionAccionistas()">🖨️ Imprimir / Descargar PDF</button>

      <div id="resultadoCalcRetencion"></div>
      <div style="margin-top:18px;border-top:1px solid var(--border);padding-top:14px;">

      </div>
