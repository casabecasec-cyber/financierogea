  `;
  pintarListaAccionistasCalc();
  pintarListaAnticiposDividendos();
  pintarListaRetencionesRealizadas();
}

let seleccionAccionistasCalc = {}; // { [empresaClave]: [{nombre, incluido, corresponde, valorPagar, anticipoValor}] }
let modalidadRepartoCalc = "actuales"; // 'actuales' | 'historicos'
let anioRepartoCalc = null;

function calcularCorrespondePorAccionista(modalidad, anio){
  const clave = empresaEscenarioSeleccionada;
  const datosCapital = datosDividendosCache.resumenCapital.empresas[clave];
  const datosResumenDiv = datosDividendosCache.resumenDividendos.empresas[clave];
  const aniosCapital = datosDividendosCache.resumenCapital.anios;
  const ultimoAnioCapital = aniosCapital[aniosCapital.length-1];

  if(modalidad==="historicos"){
    // Cada accionista recibe lo que históricamente le correspondió ESE año específico
    return (datosResumenDiv?.filas||[]).map(f => ({
      nombre: f.accionista,
      porcentaje: null,
      corresponde: f.valores[anio] || 0
    }));
  }
  // modalidad "actuales": los accionistas actuales (capital > 0 en el último año) son
  // dueños de TODA la utilidad acumulada histórica, repartida según su % de participación hoy.
  const totalCapitalActual = datosCapital?.suman[ultimoAnioCapital] || 1;
  const utilidadAcumuladaTotal = datosDividendosCache.resumenDividendos.anios.reduce((s,a)=> s+(datosResumenDiv?.suman[a]||0), 0);
  return (datosCapital?.filas||[])
    .filter(f => (f.valores[ultimoAnioCapital]||0) > 0)
    .map(f => {
      const porcentaje = totalCapitalActual ? ((f.valores[ultimoAnioCapital]||0)/totalCapitalActual*100) : 0;
      return { nombre: f.accionista, porcentaje, corresponde: utilidadAcumuladaTotal*(porcentaje/100) };
    });
}

let tipoBeneficiarioCalc = "residente";

function calcularRetencionAccionista(a, anio){
  const franja = franjaExentaDelAnio(anio);
  const tarifa = TARIFAS_RETENCION_DIVIDENDOS[tipoBeneficiarioCalc].tarifa;
  const franjaUsadaAnticipo = Math.min(franja, a.anticipoValor||0);
  const franjaRestante = Math.max(0, franja - franjaUsadaAnticipo);
  const baseImponible = Math.max(0, (a.valorPagar||0) - franjaRestante);
  const retencion = baseImponible * tarifa;
  const neto = baseImponible - retencion;
  return { franja, franjaRestante, baseImponible, retencion, neto, tarifa };
}

function cambiarTipoBeneficiarioCalc(valor){
  tipoBeneficiarioCalc = valor;
  pintarListaAccionistasCalc();
}

function pintarListaAccionistasCalc(){
  const cont = document.getElementById("listaAccionistasCalc");
  if(!cont) return;
  const aniosDisponibles = datosDividendosCache.resumenDividendos.anios;
  if(!anioRepartoCalc) anioRepartoCalc = aniosDisponibles[aniosDisponibles.length-1];

  const corresponde = calcularCorrespondePorAccionista(modalidadRepartoCalc, anioRepartoCalc);
  const previo = seleccionAccionistasCalc[empresaEscenarioSeleccionada] || [];
  // Reconstruye la lista de trabajo, preservando incluido/valorPagar/anticipo si el accionista ya estaba
  const lista = corresponde.map(c => {
    const anterior = previo.find(p=>p.nombre===c.nombre);
    return {
      nombre: c.nombre, porcentaje: c.porcentaje, corresponde: c.corresponde,
      incluido: anterior?.incluido || false,
      valorPagar: anterior?.valorPagar !== undefined ? anterior.valorPagar : c.corresponde,
      anticipoValor: anterior?.anticipoValor || 0
    };
  });
  seleccionAccionistasCalc[empresaEscenarioSeleccionada] = lista;
  const franjaDelAnio = franjaExentaDelAnio(anioRepartoCalc);

  const controlesHtml = `
    <div class="grid2" style="margin-bottom:10px;">
      <div class="field" style="margin:0;"><label>Modalidad de reparto</label>
        <select onchange="cambiarModalidadRepartoCalc(this.value)">
          <option value="actuales" ${modalidadRepartoCalc==='actuales'?'selected':''}>Accionistas actuales (dueños de todo lo acumulado, según su % hoy)</option>
          <option value="historicos" ${modalidadRepartoCalc==='historicos'?'selected':''}>Accionistas de ese año específico (histórico)</option>
        </select>
      </div>
      <div class="field" style="margin:0;"><label>Año</label>
        <select onchange="cambiarAnioRepartoCalc(this.value)">
          ${aniosDisponibles.map(a=>`<option value="${a}" ${anioRepartoCalc===a?'selected':''}>${a}</option>`).join("")}
        </select>
      </div>
    </div>
    <div class="field" style="margin-bottom:10px;"><label>Tipo de beneficiario (define la tarifa de retención)</label>
      <select onchange="cambiarTipoBeneficiarioCalc(this.value)">
        ${Object.keys(TARIFAS_RETENCION_DIVIDENDOS).map(k=>`<option value="${k}" ${tipoBeneficiarioCalc===k?'selected':''}>${TARIFAS_RETENCION_DIVIDENDOS[k].label} — ${(TARIFAS_RETENCION_DIVIDENDOS[k].tarifa*100).toFixed(0)}%</option>`).join("")}
      </select>
    </div>
    <p class="helpNote">"Le corresponde" se calcula automático según la modalidad elegida. "Valor a repartir" es editable — por defecto es igual a "le corresponde", pero puedes cambiarlo si vas a pagar solo una parte; la retención se calcula sobre este valor, descontando primero la franja exenta disponible (3 SBU del año ${anioRepartoCalc} = <b>$${franjaDelAnio.toFixed(2)}</b>, menos lo ya consumido por anticipos) y aplicando la tarifa según el tipo de beneficiario elegido arriba.</p>
  `;

  if(!lista.length){ cont.innerHTML = controlesHtml + `<p style="color:var(--muted);">No hay accionistas para esta modalidad/año.</p>`; return; }

  cont.innerHTML = controlesHtml + `<table style="font-size:12px;"><thead><tr>
      <th>Incluir</th><th>Accionista</th>${modalidadRepartoCalc==='actuales'?'<th>%</th>':''}<th>Le corresponde (auto)</th><th>Valor a repartir (editable)</th><th>Anticipo ya entregado</th><th>Franja exenta disponible</th><th>Base imponible</th><th>Retención (${(TARIFAS_RETENCION_DIVIDENDOS[tipoBeneficiarioCalc].tarifa*100).toFixed(0)}%)</th><th>Neto a pagar</th>
    </tr></thead><tbody>
    ${lista.map((a,idx) => {
      const calc = calcularRetencionAccionista(a, anioRepartoCalc);
      return `<tr>
      <td><input type="checkbox" ${a.incluido?'checked':''} onchange="actualizarAccionistaCalc(${idx},'incluido',this.checked)"></td>
      <td>${escapeHtml(a.nombre)}</td>
      ${modalidadRepartoCalc==='actuales'?`<td>${a.porcentaje.toFixed(2)}%</td>`:''}
      <td>$${a.corresponde.toFixed(2)}</td>
      <td><input type="number" style="width:110px;" value="${a.valorPagar}" onchange="actualizarAccionistaCalc(${idx},'valorPagar',parseFloat(this.value)||0)"></td>
      <td><input type="number" style="width:110px;" value="${a.anticipoValor}" onchange="actualizarAccionistaCalc(${idx},'anticipoValor',parseFloat(this.value)||0)"></td>
      <td>$${calc.franjaRestante.toFixed(2)}</td>
      <td>$${calc.baseImponible.toFixed(2)}</td>
      <td style="font-weight:600;">$${calc.retencion.toFixed(2)}</td>
      <td style="font-weight:600;color:var(--accent2);">$${calc.neto.toFixed(2)}</td>
    </tr>`;
    }).join("")}
  </tbody></table>`;
}

function cambiarModalidadRepartoCalc(valor){
  modalidadRepartoCalc = valor;
  pintarListaAccionistasCalc();
}
function cambiarAnioRepartoCalc(valor){
  anioRepartoCalc = parseInt(valor,10);
  pintarListaAccionistasCalc();
}

function actualizarAccionistaCalc(idx, campo, valor){
  seleccionAccionistasCalc[empresaEscenarioSeleccionada][idx][campo] = valor;
  pintarListaAccionistasCalc();
}

let retencionEnEdicionId = null;

async function ejecutarCalculoRetencionAccionistas(){
  const periodo = document.getElementById("calcPeriodo").value.trim() || String(anioRepartoCalc);
  const fechaRetencion = document.getElementById("calcFechaRetencion").value;
  const clave = empresaEscenarioSeleccionada;
  const nombreEmpresa = datosDividendosCache.porEmpresa[clave]?.nombreHoja || clave;
  const seleccionados = (seleccionAccionistasCalc[clave]||[]).filter(a=>a.incluido && a.valorPagar>0);
  if(!seleccionados.length){ alert("Marca al menos un accionista (checklist 'Incluir') con un valor a repartir mayor a cero."); return; }

  const infoTarifa = TARIFAS_RETENCION_DIVIDENDOS[tipoBeneficiarioCalc];
  const franjaDelAnio = franjaExentaDelAnio(anioRepartoCalc);
  const detalleAccionistas = seleccionados.map(a => ({ ...a, calc: calcularRetencionAccionista(a, anioRepartoCalc) }));
  const textoAccionistas = detalleAccionistas.map(({nombre, corresponde, valorPagar, anticipoValor, calc}) => {
    return `- ${nombre}: le corresponde $${corresponde.toFixed(2)} en total según ${modalidadRepartoCalc==='actuales'?'su % de participación actual sobre la utilidad acumulada':'lo registrado ese año'}. Valor que se desea repartir/pagar ahora: $${valorPagar.toFixed(2)}. ${anticipoValor>0 ? `Ya se le entregó un anticipo de $${anticipoValor.toFixed(2)} que debe restarse.` : "Sin anticipos entregados."}\n  CÁLCULO YA HECHO EN LA APP (usa estos valores tal cual en tu respuesta, no los recalcules): franja exenta disponible después del anticipo = $${calc.franjaRestante.toFixed(2)} (de una franja total de $${calc.franja.toFixed(2)} = 3 SBU del año ${anioRepartoCalc}), base imponible = $${calc.baseImponible.toFixed(2)}, tarifa aplicada = ${(calc.tarifa*100).toFixed(0)}% (${infoTarifa.label}), retención calculada = $${calc.retencion.toFixed(2)}, valor neto a pagar = $${calc.neto.toFixed(2)}.`;
  }).join("\n");
  const contenido = `Empresa: ${nombreEmpresa}\nPeriodo: ${periodo}\n${fechaRetencion?`Fecha de retención (fecha del acta/pago): ${fmtFecha(new Date(fechaRetencion+"T00:00:00").getTime())}\n`:''}Modalidad de reparto: ${modalidadRepartoCalc==='actuales'?'Accionistas actuales (dueños de toda la utilidad acumulada según % actual)':'Accionistas históricos de ese año'}\nTipo de beneficiario: ${infoTarifa.label} (tarifa ${(infoTarifa.tarifa*100).toFixed(0)}%)\nFranja exenta total del año ${anioRepartoCalc} (3 SBU): $${franjaDelAnio.toFixed(2)}\n\nAccionistas a calcular (usa el "valor a repartir" como base del cálculo de retención, no el "le corresponde"; el CÁLCULO YA HECHO por la app es la fuente de verdad, no lo recalcules ni lo cambies, solo repítelo en el formato del informe):\n${textoAccionistas}`;

  const estadoEl = document.getElementById("estadoCalcRetencion");
  document.getElementById("resultadoCalcRetencion").innerHTML = "";
  estadoEl.innerHTML = `<span class="spinner"></span> Calculando con IA...`;
  try{
    const resultado = await llamarIA("calcular_informe_retencion_dividendos", contenido, "");
    window._ultimoInformeRetencionAccionistas = { resultado, periodo, nombreEmpresa, fechaRetencion };
    estadoEl.textContent = "Cálculo completo. Guardando...";
    document.getElementById("resultadoCalcRetencion").innerHTML = renderInformeRetencionAccionistas(resultado, fechaRetencion);

    // Guarda (o actualiza) esta retención como "realizada" — esto es lo que
    // alimenta automáticamente la columna "Utilidad Repartida" del
    // Comparativo SRI para el año de esta retención.
    if(!datosDividendosCache.retenciones) datosDividendosCache.retenciones = {};
    if(!datosDividendosCache.retenciones[clave]) datosDividendosCache.retenciones[clave] = [];
    const registro = {
      id: retencionEnEdicionId || ("ret_"+Date.now()+"_"+Math.floor(Math.random()*10000)),
      anio: anioRepartoCalc, periodo, fechaRetencion: fechaRetencion||null,
      modalidad: modalidadRepartoCalc, tipoBeneficiario: tipoBeneficiarioCalc,
      accionistas: detalleAccionistas.map(({nombre, corresponde, valorPagar, anticipoValor, calc}) => ({
        nombre, corresponde, valorPagar, anticipoValor,
        franjaExenta: calc.franjaRestante, baseImponible: calc.baseImponible, retencion: calc.retencion, neto: calc.neto
      })),
      totalValorPagar: detalleAccionistas.reduce((s,a)=>s+a.valorPagar,0),
      totalRetencion: detalleAccionistas.reduce((s,a)=>s+a.calc.retencion,0),
      totalNeto: detalleAccionistas.reduce((s,a)=>s+a.calc.neto,0),
      resultadoIA: resultado,
      metodoPago: null, pagosBanco: [], cuentasPorPagarAcumulado: 0,
      creado: retencionEnEdicionId ? (datosDividendosCache.retenciones[clave].find(r=>r.id===retencionEnEdicionId)?.creado||Date.now()) : Date.now(),
      actualizado: Date.now()
    };
    const idxExistente = datosDividendosCache.retenciones[clave].findIndex(r=>r.id===registro.id);
    if(idxExistente>=0){
      // conserva la forma de pago ya registrada si estaba editando — con
      // respaldo explícito, porque un registro guardado antes de que
      // existiera esta función de "pago" puede no tener estos campos
      // (undefined), y Firebase rechaza cualquier valor undefined al guardar.
      const existente = datosDividendosCache.retenciones[clave][idxExistente];
      registro.metodoPago = existente.metodoPago ?? null;
      registro.pagosBanco = existente.pagosBanco ?? [];
      registro.cuentasPorPagarAcumulado = existente.cuentasPorPagarAcumulado ?? 0;
      datosDividendosCache.retenciones[clave][idxExistente] = registro;
    } else {
      datosDividendosCache.retenciones[clave].push(registro);
    }
    retencionEnEdicionId = null;
    resincronizarPagoACuentaDesdeAnticiposYRetenciones(clave);
    await guardarDatosDividendos(datosDividendosCache);
    estadoEl.textContent = "Cálculo completo y guardado (también se pasó automáticamente a Pago a Cuenta en Distribución Actual).";
    pintarListaRetencionesRealizadas();
    await registrarCambio("Dividendos", "generar_ia", `Informe de retención calculado y guardado: ${nombreEmpresa}, periodo ${periodo}, ${seleccionados.length} accionista(s)`);
  }catch(e){
    estadoEl.textContent = "";
    alert("No se pudo calcular: " + e.message);
  }
}

// Reconstruye por completo la parte automática de "Pago a cuenta" a partir
// de: (1) los Anticipos de dividendos por año (Escenarios) — una fila por
// cada año que tenga anticipos, con "Monto" = total de anticipos de ese año;
// y (2) el total de TODAS las retenciones formales realizadas juntas (sin
// importar en qué año se hicieron) — ese total compensa ÚNICAMENTE el año
// MÁS BAJO con anticipo registrado, hasta el monto de ese año. Los demás
// años NO reciben nada del pool (quedan con Compensado $0, sin tocar). Si el
// total retenido supera el monto del año más bajo, esa diferencia NO se
// traslada a ningún otro año — ya se retuvo/pagó, así que se debe pagar
// aparte: se documenta en un recuadro separado (monto a pagar, si fue en
// cheque o transferencia, y observaciones para el N° de formulario). Las
// filas manuales (Art. 39.2.1) nunca se tocan. Se puede llamar siempre
// (idempotente) — recalcula todo desde cero cada vez.
function resincronizarPagoACuentaDesdeAnticiposYRetenciones(clave){
  if(!datosDividendosCache.pagosACuenta) datosDividendosCache.pagosACuenta = {};
  if(!datosDividendosCache.pagosACuenta[clave]) datosDividendosCache.pagosACuenta[clave] = [];
  const listaActual = datosDividendosCache.pagosACuenta[clave];
  const anticipos = (datosDividendosCache.anticiposDividendos||{})[clave] || [];
  const aniosConAnticipo = [...new Set(anticipos.map(a=>a.anio))].sort((a,b)=>a-b);
  const retenciones = (datosDividendosCache.retenciones||{})[clave] || [];

  const filasManuales = listaActual.filter(p => !p.autoDesdeAnticipos);
  const autoPorAnioViejo = {};
  listaActual.filter(p => p.autoDesdeAnticipos).forEach(p => { autoPorAnioViejo[p.anio] = p; });

  const totalRetenciones = retenciones.reduce((s,r)=>s+(r.totalRetencion||0), 0);
  const anioMasBajo = aniosConAnticipo[0]; // undefined si no hay ningún anticipo

  const nuevasFilasAuto = aniosConAnticipo.map(anio => {
    const montoAnio = calcularAnticiposDelAnio(clave, anio);
    // Solo el año más bajo recibe compensación del total retenido; los demás
    // años quedan siempre en $0 (no se les traslada nada).
    const compensarAqui = (anio===anioMasBajo) ? Math.min(totalRetenciones, montoAnio) : 0;
    const previa = autoPorAnioViejo[anio] || {};
    // Resumen (de solo lectura) de la forma de pago ya registrada en las
    // retenciones de ese año — la forma de pago se gestiona en la retención
    // misma (Escenarios), no aquí, para no duplicar el dato.
    const retencionesDelAnio = retenciones.filter(r=>r.anio===anio);
    const totalBancoRet = retencionesDelAnio.reduce((s,r)=>s+((r.pagosBanco||[]).reduce((s2,x)=>s2+(x.monto||0),0)),0);
    const totalCxPRet = retencionesDelAnio.reduce((s,r)=>s+(r.cuentasPorPagarAcumulado||0),0);
    return {
      anio, monto: montoAnio, montoCompensado: compensarAqui,
      observacion: anio===anioMasBajo
        ? `Anticipos de dividendos del año ${anio} (año más bajo) — compensado con el total de retenciones formales ya realizadas — generado automáticamente`
        : `Anticipos de dividendos del año ${anio} — no recibe compensación (el total retenido se aplica solo al año más bajo) — generado automáticamente`,
      metodoPago: previa.metodoPago || null,
      pagosBanco: previa.pagosBanco || [],
      cuentasPorPagarAcumulado: previa.cuentasPorPagarAcumulado || 0,
      formaPagoRetencionesResumen: { banco: totalBancoRet, cuentasPorPagar: totalCxPRet },
      autoDesdeAnticipos: true,
    };
  });

  datosDividendosCache.pagosACuenta[clave] = [...filasManuales, ...nuevasFilasAuto];

  // Si el total retenido supera el monto del año más bajo, esa diferencia ya
  // se retuvo/pagó y NO se traslada a ningún otro año — se documenta aparte
  // como "diferencia a pagar".
  const montoAnioMasBajo = anioMasBajo!==undefined ? calcularAnticiposDelAnio(clave, anioMasBajo) : 0;
  const diferenciaAPagar = Math.max(0, totalRetenciones - montoAnioMasBajo);

  if(!datosDividendosCache.excesoPagoACuenta) datosDividendosCache.excesoPagoACuenta = {};
  const excesoPrevio = datosDividendosCache.excesoPagoACuenta[clave] || {};
  datosDividendosCache.excesoPagoACuenta[clave] = {
    monto: diferenciaAPagar,
    comoSePago: excesoPrevio.comoSePago || "",
    observacion: excesoPrevio.observacion || "",
  };
}

// Una retención ya calculada/formal NO es un "anticipo" — es la retención en
// sí. Esta función quita cualquier fila que se haya creado por error en
// "Anticipos de dividendos" vinculada a una retención (de una versión
// anterior de la app que sí las creaba), para que esa tabla quede solo con
// anticipos reales (manuales).
function limpiarAnticiposDeRetenciones(clave){
  const lista = (datosDividendosCache.anticiposDividendos||{})[clave];
  if(!lista || !lista.length) return false;
  const antes = lista.length;
  datosDividendosCache.anticiposDividendos[clave] = lista.filter(a=>!a.retencionId);
  return datosDividendosCache.anticiposDividendos[clave].length !== antes;
}

// Repara/actualiza la parte automática de "Pago a cuenta" — se ejecuta cada
// vez que se abre Escenarios o Distribución Actual: limpia cualquier
// "anticipo" que se haya generado por error desde una retención (versiones
// anteriores), y reconstruye las filas automáticas de Pago a Cuenta por año
// con el reparto FIFO de retenciones. Es idempotente, así que es seguro
// llamarla siempre.
function resincronizarRetencionesGuardadas(clave){
  const huboLimpieza = limpiarAnticiposDeRetenciones(clave);
  resincronizarPagoACuentaDesdeAnticiposYRetenciones(clave);
  guardarDatosDividendos(datosDividendosCache);
}

function badgeFormaPagoRetencion(r){
  if(r.metodoPago==="banco"){
    const totalBanco = (r.pagosBanco||[]).reduce((s,p)=>s+(p.monto||0),0);
    return `<span class="pill ${Math.abs(totalBanco-r.totalNeto)<0.5?'ok':'warn'}">Banco: $${totalBanco.toFixed(2)}</span>`;
  }
  if(r.metodoPago==="cuentasPorPagar"){
    return `<span class="pill warn">Cuentas x pagar: $${(r.cuentasPorPagarAcumulado||0).toFixed(2)}</span>`;
  }
  return `<span class="pill muted">Sin registrar</span>`;
}

// Carga los datos de una retención guardada de vuelta en el formulario para
// poder corregirla — al volver a presionar "Calcular", se ACTUALIZA el mismo
// registro (no se crea uno nuevo), y la "Utilidad Repartida" del Comparativo
// SRI se recalcula sola con el nuevo total.
function editarRetencionRealizada(id){
  const clave = empresaEscenarioSeleccionada;
  const r = (datosDividendosCache.retenciones[clave]||[]).find(x=>x.id===id);
  if(!r) return;
  retencionEnEdicionId = id;
  anioRepartoCalc = r.anio;
  modalidadRepartoCalc = r.modalidad;
  tipoBeneficiarioCalc = r.tipoBeneficiario;
  document.getElementById("calcPeriodo").value = r.periodo;
  document.getElementById("calcFechaRetencion").value = r.fechaRetencion || "";
  pintarListaAccionistasCalc();
  // Aplica los valores guardados (incluido/valorPagar/anticipo) sobre la lista recién generada
  const lista = seleccionAccionistasCalc[clave] || [];
  r.accionistas.forEach(ra => {
    const fila = lista.find(l=>l.nombre===ra.nombre);
    if(fila){ fila.incluido = true; fila.valorPagar = ra.valorPagar; fila.anticipoValor = ra.anticipoValor||0; }
  });
  pintarListaAccionistasCalc();
  document.getElementById("avisoEdicionRetencion").innerHTML = `<p class="helpNote" style="background:rgba(232,179,57,.15);padding:8px 10px;border-radius:6px;">✏️ Editando la retención de <b>${escapeHtml(r.periodo)}</b> (año ${r.anio}) — al presionar "Calcular retención y generar informes" se actualiza este mismo registro. <button class="btn small" onclick="cancelarEdicionRetencion()">Cancelar edición</button></p>`;
  document.getElementById("calcPeriodo").scrollIntoView({behavior:"smooth", block:"center"});
}

function cancelarEdicionRetencion(){
  retencionEnEdicionId = null;
  document.getElementById("avisoEdicionRetencion").innerHTML = "";
}

async function eliminarRetencionRealizada(id){
  if(!confirm("¿Eliminar esta retención guardada? Esto también quita su monto de la columna \"Utilidad Repartida\" del Comparativo SRI para ese año, y recalcula lo \"Compensado\" en Pago a Cuenta con las retenciones que queden.")) return;
  const clave = empresaEscenarioSeleccionada;
  datosDividendosCache.retenciones[clave] = (datosDividendosCache.retenciones[clave]||[]).filter(r=>r.id!==id);
  resincronizarPagoACuentaDesdeAnticiposYRetenciones(clave);
  await guardarDatosDividendos(datosDividendosCache);
  if(retencionEnEdicionId===id) cancelarEdicionRetencion();
  pintarListaRetencionesRealizadas();
  pintarListaAnticiposDividendos();
}

async function corregirCuentaPorPagarRetencion(id){
  const clave = empresaEscenarioSeleccionada;
  const r = (datosDividendosCache.retenciones[clave]||[]).find(x=>x.id===id);
  if(!r) return;
  const actual = r.cuentasPorPagarAcumulado||0;
  const nuevoTexto = prompt(`Escribe el monto correcto de cuentas por pagar acumuladas (actualmente $${actual.toFixed(2)}):`, actual.toFixed(2));
  if(nuevoTexto===null) return; // canceló
  const nuevoMonto = parseFloat(nuevoTexto);
  if(isNaN(nuevoMonto) || nuevoMonto<0){ alert("Ingresa un monto válido (número mayor o igual a cero)."); return; }
  r.cuentasPorPagarAcumulado = nuevoMonto;
  await guardarDatosDividendos(datosDividendosCache);
  pintarFormaPagoRetencion(id);

async function ejecutarGenerarEscenarios(){
  const anio = document.getElementById("escAnio").value.trim();
  const utilidad = parseFloat(document.getElementById("escUtilidad").value)||0;
  const pagoACuenta = parseFloat(document.getElementById("escPagoACuenta").value)||0;
  const anticipos = calcularAnticiposDelAnio(empresaEscenarioSeleccionada, parseInt(anio,10));
  const retencionesRealizadas = parseFloat(document.getElementById("escRetencionesRealizadas").value)||0;
  const instrucciones = document.getElementById("escInstrucciones").value.trim();
  if(!utilidad){ alert("Ingresa la utilidad acumulada no distribuida."); return; }
  const nombreEmpresa = datosDividendosCache.porEmpresa[empresaEscenarioSeleccionada]?.nombreHoja || empresaEscenarioSeleccionada;
  const datosCapital = datosDividendosCache.resumenCapital.empresas[empresaEscenarioSeleccionada];
  const ultimoAnioCapital = Math.max(...datosDividendosCache.resumenCapital.anios);
  const totalCapital = datosCapital?.suman[ultimoAnioCapital] || 1;
  const accionistas = (datosCapital?.filas||[]).map(f => {
    const porcentaje = totalCapital ? ((f.valores[ultimoAnioCapital]||0)/totalCapital*100) : 0;
    return `${f.accionista}: ${porcentaje.toFixed(2)}%`;
  }).join("\n");
  const pagos = (datosDividendosCache.pagosACuenta||{})[empresaEscenarioSeleccionada] || [];
  const pagosTexto = pagos.length ? pagos.map(p=>`Pago a cuenta año ${p.anio}: $${Number(p.monto).toFixed(2)}, plazo de compensación hasta el cierre del ejercicio ${p.anio+2}`).join("\n") : "Sin pagos a cuenta registrados";
  const pagoACuentaEstimadoTabla = calcularPagoACuentaTarifaUnica(utilidad);

  const contenido = `Empresa: ${nombreEmpresa}\nAño de análisis: ${anio}\nUtilidad acumulada no distribuida: USD $${utilidad.toFixed(2)}\nPago(s) a cuenta ya realizado (monto total relevante para esta decisión): USD $${pagoACuenta.toFixed(2)}\nDetalle de pagos a cuenta:\n${pagosTexto}\nAnticipos de dividendos ya pagados este año: USD $${anticipos.toFixed(2)}\nRetenciones ya realizadas por distribución de dividendos, disponibles para compensar el pago a cuenta (dentro de los 2 ejercicios fiscales posteriores al pago, 3 años en total contando el del pago): USD $${retencionesRealizadas.toFixed(2)}\nPago a cuenta ESTIMADO si no se distribuye antes del 31 de julio (ya calculado con la tabla de TARIFA ÚNICA del Art. 39.2.1 LRTI — 0% a 2.5% según el saldo total, aplicada sobre el 100% del monto, NO es la tabla progresiva de personas naturales — usa este valor tal cual, no lo recalcules): USD $${pagoACuentaEstimadoTabla.toFixed(2)}\nAccionistas y % de participación (según capital al año ${ultimoAnioCapital}):\n${accionistas}`;

  const estadoEl = document.getElementById("estadoEscenarios");
  document.getElementById("resultadoEscenarios").innerHTML = "";
  estadoEl.innerHTML = `<span class="spinner"></span> Generando escenarios con IA...`;
  try{
    const resultado = await llamarIA("generar_escenarios_dividendos", contenido, instrucciones);
    estadoEl.textContent = "Escenarios generados.";
    document.getElementById("resultadoEscenarios").innerHTML = renderEscenariosDividendos(resultado);
    await registrarCambio("Dividendos", "generar_ia", `Escenarios de distribución generados para ${nombreEmpresa} (${anio})`);
  }catch(e){
    estadoEl.textContent = "";
    alert("No se pudo generar los escenarios: " + e.message);
  }
}

function recalcularPorcentajesIncluidosArr(accionistas){
  const incluidos = accionistas.filter(a=>a.incluido);
  const sumaBase = incluidos.reduce((s,a)=>s+(a.porcentajeBase||0),0) || 1;
  incluidos.forEach(a => { a.porcentaje = (a.porcentajeBase/sumaBase)*100; });
  accionistas.filter(a=>!a.incluido).forEach(a => { a.porcentaje = 0; });
}

function obtenerOInicializarDistribActual(clave){
  if(!datosDividendosCache.distribucionActual) datosDividendosCache.distribucionActual = {};
  if(!datosDividendosCache.distribucionActual[clave]){
    const datosCapital = datosDividendosCache.resumenCapital.empresas[clave];
    const datosResumenDiv = datosDividendosCache.resumenDividendos.empresas[clave];
    const ultimoAnioCapital = Math.max(...datosDividendosCache.resumenCapital.anios);
    const totalCapital = datosCapital?.suman[ultimoAnioCapital] || 1;
    const utilidadAcumulada = datosDividendosCache.resumenDividendos.anios.reduce((s,a)=> s+(datosResumenDiv?.suman[a]||0), 0);

    // Checklist de posibles accionistas: unión de nombres vistos en capital y en dividendos
    const nombresUnion = Array.from(new Set([
      ...(datosCapital?.filas||[]).map(f=>f.accionista),
      ...(datosResumenDiv?.filas||[]).map(f=>f.accionista)
    ]));

    const accionistas = nombresUnion.map(nombre => {
      const filaCapital = (datosCapital?.filas||[]).find(f=>f.accionista===nombre);
      const capitalActual = filaCapital ? (filaCapital.valores[ultimoAnioCapital]||0) : 0;
      const porcentajeBase = totalCapital ? (capitalActual/totalCapital*100) : 0;
      return {
        nombre,
        incluido: capitalActual > 0, // sugerencia inicial: accionista actual = tiene capital > 0 en el último año
        porcentajeBase,
        porcentaje: porcentajeBase,
        tuvoAnticipo: false, anticipoMonto: 0, anticipoImpuesto: 0,
        montoDispuestoPagar: 0,
        retencionCalculada: null, saldoPendiente: null, recomendacion: ""
      };
    });
    recalcularPorcentajesIncluidosArr(accionistas);

    datosDividendosCache.distribucionActual[clave] = {
      utilidadTotal: utilidadAcumulada,
      accionistas,
      planAnios: [],
      ultimoResultadoIA: null
    };
  }
  return datosDividendosCache.distribucionActual[clave];
}

// Trae la "Utilidad Acumulada" ya calculada en el Comparativo SRI/Súper
// Cías/Contable para ESTA MISMA empresa, hasta el año elegido, y la usa como
// base de "Utilidad acumulada total a repartir" — reutiliza exactamente la
// misma lógica de cálculo que la pestaña Comparativo (calcularFilasComparativo),
// así que el número siempre coincide con lo que se ve ahí.
function traerUtilidadAcumuladaDeComparativo(clave){
  const anioSel = parseInt(document.getElementById("anioTraerAcumuladoComparativo").value, 10);
  const filas = calcularFilasComparativo(clave);
  const fila = filas.find(f => f.anio === anioSel);
  const valor = fila ? (fila.acumuladoMostrado||0) : 0;
  const datos = obtenerOInicializarDistribActual(clave);
  datos.utilidadTotal = valor;
  pintarDetalleDistribActual();
  setSafeText("estadoTraerAcumulado", `Se trajo $${valor.toLocaleString('es-EC',{minimumFractionDigits:2,maximumFractionDigits:2})} del año ${anioSel} (Comparativo SRI...). Presiona "💾 Guardar" para conservarlo.`);
}

function pintarTablaAniosDistrib(){
  const cont = document.getElementById("tablaAniosDistrib");

  if(!datos.planAnios.length){ cont.innerHTML = `<p style="color:var(--muted);">Aún no hay años agregados al plan.</p>`; return; }

async function ejecutarGenerarPlanMultianual(){
  const nombreEmpresa = datosDividendosCache.porEmpresa[empresaDistribActualSeleccionada]?.nombreHoja || empresaDistribActualSeleccionada;
  const datos = datosDividendosCache.distribucionActual[empresaDistribActualSeleccionada];
  const incluidos = datos.accionistas.filter(a=>a.incluido);
  if(!incluidos.length){ alert("Marca al menos un accionista como 'Actual' en el checklist antes de generar el plan."); return; }
  const textoAccionistas = incluidos.map(a => `- ${a.nombre}: ${a.porcentaje.toFixed(2)}% de participación`).join("\n");
  const pagos = (datosDividendosCache.pagosACuenta||{})[empresaDistribActualSeleccionada] || [];
  const hoyAnio = new Date().getFullYear();
  const pagosVigentes = pagos.filter(p => hoyAnio <= (p.anio+2));
  const pagosTexto = pagosVigentes.length ? pagosVigentes.map(p=>`Pago a cuenta año ${p.anio}: $${montoEfectivoPagoACuenta(p).toFixed(2)}, plazo de compensación hasta el cierre del ejercicio ${p.anio+2}`).join("\n") : "Sin pagos a cuenta vigentes";

  const contenido = `Empresa: ${nombreEmpresa}\nUtilidad acumulada total a distribuir: USD $${datos.utilidadTotal.toFixed(2)}\nAño de inicio del plan: ${hoyAnio}\nAccionistas actuales y % de participación:\n${textoAccionistas}\nPagos a cuenta vigentes:\n${pagosTexto}`;

  const estadoEl = document.getElementById("estadoPlanMultianual");
  document.getElementById("resultadoPlanMultianual").innerHTML = "";
  estadoEl.innerHTML = `<span class="spinner"></span> Generando plan con IA...`;
  try{
    const resultado = await llamarIA("generar_plan_multianual_dividendos", contenido, "");
    // Reemplaza el plan de años con la recomendación de la IA
    datos.planAnios = (resultado.plan_anios||[]).map(p => ({
      anio: parseInt(p.anio,10) || hoyAnio,
      monto: parseFloat(String(p.monto_ese_anio||"").replace(/[^0-9.-]/g,"")) || 0,
      seRetuvo: false,
      retencionCalculada: p.retencion_estimada || null,
      recomendacion: p.recomendacion || "",
      montoAcumuladoIA: p.monto_acumulado || null
    }));
    await guardarDatosDividendos(datosDividendosCache);
    await registrarCambio("Dividendos", "generar_ia", `Plan multi-año generado con IA para ${nombreEmpresa}`);
    estadoEl.textContent = "Plan generado.";
    document.getElementById("resultadoPlanMultianual").innerHTML = renderPlanMultianual(resultado);
    pintarTablaAniosDistrib();
  }catch(e){
    estadoEl.textContent = "";
    alert("No se pudo generar el plan: " + e.message);
  }
}

function clasificarSociosEmpresa(clave){
  const datosCapital = datosDividendosCache.resumenCapital.empresas[clave];
  const anios = datosDividendosCache.resumenCapital.anios;
  if(!datosCapital || !anios.length) return [];
  const ultimoAnio = anios[anios.length-1];
  const totalCapitalActual = datosCapital.suman[ultimoAnio] || 0;
  return datosCapital.filas.map(f => {
    const capitalActual = f.valores[ultimoAnio] || 0;
    const esActual = capitalActual > 0;
    // Si ya no tiene saldo actual, buscar el último año en que sí tuvo capital
    let ultimoAnioConSaldo = null, ultimoCapitalConSaldo = 0;
    if(!esActual){
      for(let i=anios.length-1; i>=0; i--){
        const v = f.valores[anios[i]]||0;
        if(v>0){ ultimoAnioConSaldo = anios[i]; ultimoCapitalConSaldo = v; break; }
      }
    }
    return {
      nombre: f.accionista,
      clasificacion: esActual ? "Actual" : (ultimoAnioConSaldo ? "Anterior" : "Sin capital registrado"),
      capital: esActual ? capitalActual : ultimoCapitalConSaldo,
      acciones: esActual ? capitalActual : ultimoCapitalConSaldo, // 1 acción = USD $1
      porcentaje: esActual ? (totalCapitalActual ? (capitalActual/totalCapitalActual*100) : 0) : null,
      anioReferencia: esActual ? ultimoAnio : ultimoAnioConSaldo
    };
  });
}

/* =========================================================================

let empresaComparativoSeleccionada = null;
const ANIO_INICIO_COMPARATIVO = 1992;

      <div class="field"><label>Archivo Excel (.xlsx)</label><input type="file" id="archivoImportarComparativo" accept=".xlsx,.xls"></div>
      <button class="btn primary" onclick="ejecutarImportarComparativoExcel()">Importar a ${escapeHtml(datosDividendosCache.porEmpresa[empresaComparativoSeleccionada]?.nombreHoja||'')}</button>

async function ejecutarImportarComparativoExcel(){
  const input = document.getElementById("archivoImportarComparativo");
  const file = input.files[0];
  if(!file){ alert("Selecciona el archivo Excel primero."); return; }
  if(!empresaComparativoSeleccionada){ alert("Selecciona primero la empresa."); return; }
  const estadoEl = document.getElementById("estadoImportarComparativo");
  estadoEl.innerHTML = `<span class="spinner"></span> Leyendo archivo...`;
  try{
    const buffer = await file.arrayBuffer();
    const wb = XLSX.read(buffer, {type:"array"});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const filas = XLSX.utils.sheet_to_json(ws, {header:1, defval:null});

    const normaliza = s => (s||"").toString().toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
    let filaEncabezado = -1, colImpuesto=-1, colParticipacion=-1, colReserva=-1;
    for(let i=0;i<filas.length;i++){
      const fila = filas[i]||[];
      for(let j=0;j<fila.length;j++){
        const val = normaliza(fila[j]);
        if(!val) continue;
        if(val.includes("IMPUESTO CAUSADO")) colImpuesto=j;
        else if(val.includes("PARTICIPACION")) colParticipacion=j;
        else if(val.includes("RESERVA LEGAL")) colReserva=j;
      }
      if(colImpuesto>=0 || colParticipacion>=0 || colReserva>=0){ filaEncabezado=i; break; }
    }
    if(filaEncabezado===-1){
      throw new Error(`No se encontraron columnas con encabezado "Impuesto Causado", "Participación Trabajadores" o "Reserva Legal" en el archivo.`);
    }

    // Detecta la columna del año: la que, en las filas debajo del encabezado,
    // tenga sobre todo números enteros entre 1900 y 2100.
    let colAnio = -1;
    for(let j=0; j<12; j++){
      let aciertos=0, total=0;
      for(let i=filaEncabezado+1; i<filas.length; i++){
        const v = (filas[i]||[])[j];
        if(v===null||v===undefined||v==="") continue;
        total++;
        if(typeof v==="number" && Number.isInteger(v) && v>=1900 && v<=2100) aciertos++;
      }
      if(total>0 && aciertos/total>0.7){ colAnio=j; break; }
    }
    if(colAnio===-1){
      throw new Error("No se pudo identificar automáticamente la columna del año en el archivo.");
    }

    const clave = empresaComparativoSeleccionada;
    let aniosImportados = 0;
    for(let i=filaEncabezado+1; i<filas.length; i++){
      const fila = filas[i]||[];
      const anio = fila[colAnio];
      if(typeof anio!=="number" || !Number.isInteger(anio) || anio<1900 || anio>2100) continue;
      let huboDato = false;
      const f = obtenerFilaComparativo(clave, anio);
      const v = (col) => { const x = fila[col]; return (x===null||x===undefined||x==="") ? null : Number(x); };
      if(colImpuesto>=0 && v(colImpuesto)!==null){ f.impuestoCausado = v(colImpuesto); huboDato = true; }
      if(colParticipacion>=0 && v(colParticipacion)!==null){ f.participacionTrabajadoresRepartida = v(colParticipacion); huboDato = true; }
      if(colReserva>=0 && v(colReserva)!==null){ f.reservaLegal = v(colReserva); huboDato = true; }
      if(huboDato) aniosImportados++;
    }
    if(!aniosImportados){ throw new Error("No se encontró ningún año con datos válidos para importar."); }

    await guardarDatosDividendos(datosDividendosCache);
    estadoEl.textContent = `Se importaron datos de ${aniosImportados} año(s).`;
    input.value = "";
    pintarTablaComparativoSri();
  }catch(e){
    estadoEl.textContent = "";
    alert("No se pudo importar el archivo: " + (e.message||String(e)));
  }
}


function cambiarEmpresaComparativo(clave){
  empresaComparativoSeleccionada = clave || null;

function obtenerFilaComparativo(clave, anio){
  if(!datosDividendosCache.comparativoSri) datosDividendosCache.comparativoSri = {};
  if(!datosDividendosCache.comparativoSri[clave]) datosDividendosCache.comparativoSri[clave] = {};
  if(!datosDividendosCache.comparativoSri[clave][anio]){
    datosDividendosCache.comparativoSri[clave][anio] = {
      sri:null, superCias:null, contable:null, valorRealFuente:"sri",
      participacionTrabajadores:null, participacionTrabajadoresRepartida:null, impuestoCausado:null,
      reservaLegal:null, otrasReservas:null, utilidadADistribuir:null, utilidadAcumuladaManual:null
    };
  }
  return datosDividendosCache.comparativoSri[clave][anio];
}

async function actualizarCeldaComparativo(clave, anio, campo, valor){
  const fila = obtenerFilaComparativo(clave, anio);
  fila[campo] = (campo==="valorRealFuente") ? valor : (valor===""? null : parseFloat(valor));
  await guardarDatosDividendos(datosDividendosCache);
  pintarTablaComparativoSri();
}

// Calcula, para una empresa, todas las filas del comparativo (1992-año actual)
// con sus valores derivados (Valor Real, Participación 15%, Utilidad a
// Distribuir, Utilidad Acumulada encadenada) ya resueltos. Se usa tanto para
// pintar la tabla editable en pantalla como para el informe impreso/PDF y la
// exportación a Excel, para que los tres siempre muestren los mismos números.
// Detecta si hay una diferencia relevante (>1 centavo) entre "Participación
// Trabajadores" (calculada o manual) y "Participación Trabajadores
// Repartida" (lo que realmente se repartió) — usado para resaltar en rojo.
function hayDiferenciaParticipacion(fila){
  const a = fila.participacionMostrada;
  const b = fila.raw.participacionTrabajadoresRepartida;
  if(a===null||a===undefined||b===null||b===undefined) return false;
  return Math.abs(Number(a)-Number(b)) > 0.01;
}

// Suma el total efectivamente pagado (valor a repartir) de todas las
// "retenciones realizadas" guardadas para esa empresa en ese año — esto es
// lo que alimenta la columna "Utilidad Repartida" del Comparativo SRI.
function calcularUtilidadRepartidaAnio(clave, anio){
  const lista = (datosDividendosCache.retenciones||{})[clave] || [];
  return lista.filter(r=>r.anio===anio).reduce((s,r)=>s+(r.totalValorPagar||0), 0);
}

function calcularFilasComparativo(clave){
  const anioActual = new Date().getFullYear();
  const datosPorAnio = (datosDividendosCache.comparativoSri||{})[clave] || {};
  let acumuladoAnterior = 0; // 1991 por defecto
  const filas = [];
  for(let anio=ANIO_INICIO_COMPARATIVO; anio<=anioActual; anio++){
    const f = datosPorAnio[anio] || { sri:null, superCias:null, contable:null, valorRealFuente:"sri", participacionTrabajadores:null, participacionTrabajadoresRepartida:null, impuestoCausado:null, reservaLegal:null, otrasReservas:null, utilidadADistribuir:null, utilidadAcumuladaManual:null };
    const valorReal = f[f.valorRealFuente==="superCias"?"superCias":(f.valorRealFuente==="contable"?"contable":"sri")];

    const participacionEsAuto = f.participacionTrabajadores===null || f.participacionTrabajadores===undefined;
    const participacionCalculada = (valorReal!==null && valorReal!==undefined) ? Number(valorReal)*0.15 : null;
    const participacionMostrada = participacionEsAuto ? participacionCalculada : f.participacionTrabajadores;

    const utilidadEsAuto = f.utilidadADistribuir===null || f.utilidadADistribuir===undefined;
    const utilidadCalculada = (valorReal!==null && valorReal!==undefined)
      ? Number(valorReal) - (f.participacionTrabajadoresRepartida||0) - (f.impuestoCausado||0) - (f.reservaLegal||0) - (f.otrasReservas||0)
      : null;
    const utilidadMostrada = utilidadEsAuto ? utilidadCalculada : f.utilidadADistribuir;

    // Utilidad Repartida: suma de "retenciones realizadas" (dividendos ya
    // efectivamente pagados/procesados) guardadas para este año. Se resta del
    // acumulado, porque una vez pagada, esa utilidad deja de estar "retenida/
    // acumulada" en la empresa.
    const utilidadRepartidaAnio = calcularUtilidadRepartidaAnio(clave, anio);

    const acumuladoCalculado = acumuladoAnterior + (utilidadMostrada||0) - utilidadRepartidaAnio;
    const acumuladoEsAuto = f.utilidadAcumuladaManual===null || f.utilidadAcumuladaManual===undefined;
    const acumuladoMostrado = acumuladoEsAuto ? acumuladoCalculado : f.utilidadAcumuladaManual;
    acumuladoAnterior = acumuladoMostrado;

    filas.push({
      anio, raw:f, valorReal,
      participacionMostrada, participacionEsAuto,
      utilidadMostrada, utilidadEsAuto,
      utilidadRepartidaAnio,
      acumuladoMostrado, acumuladoEsAuto
    });
  }
  return filas;
}

// Construye el HTML del informe ejecutivo profesional (usado tanto para
// Imprimir como para Descargar PDF, ya que ambos usan el diálogo de
// impresión del navegador — es el mismo mecanismo que el resto de la app).
function construirHtmlInformeComparativo(){
  const clave = empresaComparativoSeleccionada;
  const nombreEmpresa = datosDividendosCache.porEmpresa[clave]?.nombreHoja || clave;
  const filas = calcularFilasComparativo(clave);
  const filasConDatos = filas.filter(x => x.valorReal!==null && x.valorReal!==undefined);
  const anioActual = new Date().getFullYear();
  const fmtMoneda = v => (v===null||v===undefined) ? "—" : "$"+Number(v).toLocaleString('es-EC',{minimumFractionDigits:2,maximumFractionDigits:2});

  const ultimaFila = filas[filas.length-1];
  const primeraConDatos = filasConDatos[0];
  const totalUtilidadDistribuir = filasConDatos.reduce((s,f)=>s+(f.utilidadMostrada||0),0);
  const totalValorReal = filasConDatos.reduce((s,f)=>s+(f.valorReal||0),0);
  const promedioAnual = filasConDatos.length ? totalUtilidadDistribuir/filasConDatos.length : 0;
  const fuenteConteo = {sri:0, superCias:0, contable:0};

  const filasComp = calcularFilasComparativo(clave).filter(f=>f.valorReal!==null&&f.valorReal!==undefined);

  const filasCapitalHtml = (datosCapital?.filas||[]).map(f => `<tr>

  const filasConciliacionHtml = filasConciliacion.map(f => `<tr class="${!f.cuadra?'celda-alerta-fila':''}">

    </tr>`).join("");

  return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Informe Ejecutivo — ${escapeHtml(nombreEmpresa)}</title>

      .encabezado h1{font-size:19px;margin:0 0 2px;color:#1a2733;}
      .encabezado .sub{font-size:12px;color:#5c6b7a;}
      .encabezado .meta{font-size:11px;color:#8ea2b3;margin-top:4px;}
      .resumen{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
      .tarjeta{flex:1;min-width:150px;background:#f4f6f9;border:1px solid #d7dee6;border-radius:8px;padding:10px 12px;}
      .tarjeta .valor{font-size:16px;font-weight:700;color:#1a73c7;}
      .tarjeta .valor.verde{color:#178f5c;}
      .tarjeta .valor.rojo{color:#c8382c;}
      .tarjeta .label{font-size:10px;color:#5c6b7a;text-transform:uppercase;letter-spacing:.03em;margin-top:2px;}
      h2.seccion{font-size:13px;color:#1a2733;border-left:4px solid #1a73c7;padding-left:8px;margin:18px 0 8px;page-break-after:avoid;}
      table{width:100%;border-collapse:collapse;font-size:9.5px;}
      th{background:#1a2733;color:#fff;padding:5px 4px;text-align:left;white-space:nowrap;}
      td{padding:4px;border-bottom:1px solid #e3e8ee;}
      td.num{text-align:right;font-variant-numeric:tabular-nums;}
      tbody tr:nth-child(even){background:#f9fafb;}
      .celda-alerta-fila td{background:#fbdcdc!important;color:#c8382c;}
      .parrafo-ia{font-size:11px;line-height:1.5;color:#33414d;background:#f4f6f9;border-radius:8px;padding:10px 12px;margin-bottom:14px;}
      .pie{margin-top:20px;font-size:9px;color:#8ea2b3;border-top:1px solid #d7dee6;padding-top:8px;display:flex;justify-content:space-between;}
    </style>

function descargarExcelInformeResumenes(){
  if(!empresaDividendoSeleccionada){ alert("Selecciona una empresa primero."); return; }
  const clave = empresaDividendoSeleccionada;
  const nombreEmpresa = datosDividendosCache.porEmpresa[clave]?.nombreHoja || clave;
  const datosCapital = datosDividendosCache.resumenCapital.empresas[clave];
  const datosResumen = datosDividendosCache.resumenDividendos.empresas[clave];
  const aniosCapital = datosDividendosCache.resumenCapital.anios;
  const aniosDividendos = datosDividendosCache.resumenDividendos.anios;
  const { filas: filasConciliacion, totalDiferencia, totalComparativo, totalDividendos } = calcularConciliacionComparativoVsDividendos(clave);

  // Hoja 1: Capital Social
  const encCapital = ["Accionista", ...aniosCapital.map(String)];
  const filasCapital = (datosCapital?.filas||[]).map(f => [f.accionista, ...aniosCapital.map(a=>f.valores[a]||0)]);
  filasCapital.push(["SUMAN", ...aniosCapital.map(a=>datosCapital?.suman[a]||0)]);
  const wsCapital = XLSX.utils.aoa_to_sheet([
    [`Historial de Capital Social — ${nombreEmpresa}`], [`Generado el ${fmtFecha(Date.now())}`], [],
    encCapital, ...filasCapital
  ]);
  wsCapital["!cols"] = encCapital.map(()=>({wch:16}));

  // Hoja 2: Historial de Dividendos
  const encDiv = ["Accionista", ...aniosDividendos.map(String), "TOTAL ACUMULADO"];
  const filasDiv = (datosResumen?.filas||[]).map(f => [f.accionista, ...aniosDividendos.map(a=>f.valores[a]||0), f.total||0]);
  filasDiv.push(["SUMAN", ...aniosDividendos.map(a=>datosResumen?.suman[a]||0), aniosDividendos.reduce((s,a)=>s+(datosResumen?.suman[a]||0),0)]);
  const wsDiv = XLSX.utils.aoa_to_sheet([
    [`Historial de Dividendos por Accionista — ${nombreEmpresa}`], [`Generado el ${fmtFecha(Date.now())}`], [],
    encDiv, ...filasDiv
  ]);
  wsDiv["!cols"] = encDiv.map(()=>({wch:16}));

  // Hoja 3: Conciliación (acumulado corrido — misma lógica que "Recalcular")
  const encConc = ["Año", "Utilidad a Distribuir (año, Comparativo)", "SUMAN (año, Dividendos)", "Acumulado Comparativo", "Acumulado Dividendos", "Diferencia acumulada", "¿Cuadra?"];
  const filasConc = filasConciliacion.map(f => [f.anio, f.utilidadDistribuirComparativo, f.sumanDividendos, f.acumuladoComparativo, f.acumuladoDividendosCorrido, f.diferencia, f.cuadra?"Sí":"No"]);
  filasConc.push(["TOTAL / FINAL", "", "", totalComparativo, totalDividendos, totalDiferencia, Math.abs(totalDiferencia)<0.5?"Sí":"No"]);
  const wsConc = XLSX.utils.aoa_to_sheet([
    [`Conciliación Comparativo SRI vs. Historial de Dividendos (acumulado corrido) — ${nombreEmpresa}`], [`Generado el ${fmtFecha(Date.now())}`], [],
    encConc, ...filasConc
  ]);
  wsConc["!cols"] = encConc.map(()=>({wch:20}));

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, wsCapital, "Capital Social");
  XLSX.utils.book_append_sheet(wb, wsDiv, "Historial Dividendos");
  XLSX.utils.book_append_sheet(wb, wsConc, "Conciliación");
  XLSX.writeFile(wb, `Informe_Resumenes_${nombreEmpresa}`.replace(/\s+/g,"_")+".xlsx");
}


</script>
